<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tank Arena P2P</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#080c11;
    font-family:system-ui,"Segoe UI",Arial,sans-serif;user-select:none;color:#dff5e8;
    touch-action:none}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair;touch-action:none}
  .hidden{display:none !important}
  .screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:24px;
    background:radial-gradient(circle at 50% 40%,#0e1e26,#05080c 70%);
    overflow-y:auto;text-align:center}
  .screen h1{font-size:clamp(32px,7vw,56px);letter-spacing:6px;color:#9df3c4;
    text-shadow:0 0 40px #2ee07a66;margin-bottom:10px}
  .panel{background:#0a141a;border:2px solid #1e3a30;border-radius:14px;
    padding:22px;display:flex;flex-direction:column;gap:12px;width:min(340px,90vw)}
  .panel input{padding:12px 14px;border-radius:10px;background:#0e1a20;
    border:2px solid #26485a;color:#dff5e8;font-size:15px;outline:none;
    font-family:inherit;text-align:center;letter-spacing:2px}
  .panel input:focus{border-color:#2ee07a}
  .panel button{padding:12px;border-radius:10px;background:#12463a;
    color:#9df3c4;border:2px solid #2ee07a;font-size:14px;font-weight:800;
    letter-spacing:2px;cursor:pointer;transition:.15s}
  .panel button:hover{background:#2ee07a;color:#04140c}
  .panel button.ghost{background:#0e1a20;color:#cfe9d8;border-color:#26485a}
  .panel button.ghost:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}
  .panel button.pvp{background:#3a1020;color:#ff8a9a;border-color:#ff5b6e}
  .panel button.pvp:hover{background:#ff5b6e;color:#1a0410}
  .auth-tabs{display:flex;gap:8px}
  .auth-tabs button{padding:10px 26px;border-radius:10px 10px 0 0;
    background:#0e1a20;color:#7a9a92;border:2px solid #1e3a30;
    font-weight:800;letter-spacing:2px;cursor:pointer;font-size:13px;transition:.15s}
  .auth-tabs button.active{background:#12463a;color:#9df3c4;border-color:#2ee07a}
  #msg{font-size:13px;min-height:20px;letter-spacing:1px;color:#ff8a9a}
  #authMsg{font-size:13px;text-align:center;min-height:20px;letter-spacing:1px;color:#ff8a9a}
  .menu-stats{display:flex;flex-direction:column;gap:6px;padding:16px 24px;border-radius:12px;
    background:#0a141a;border:2px solid #1e3a30;font-size:14px;letter-spacing:1px;
    min-width:min(320px,90vw);text-align:center;margin-bottom:10px}
  .menu-stats b{color:#9df3c4;font-size:18px}
  #codeDisplay{font-size:32px;letter-spacing:10px;color:#9df3c4;font-weight:800;margin:8px 0}
  .hint{font-size:12px;color:#6ea8a0;letter-spacing:1px;line-height:1.7}
  #hud{position:fixed;inset:0;pointer-events:none;padding:18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    text-shadow:0 2px 8px #000;font-weight:700}
  #hudLeft{display:flex;flex-direction:column;gap:8px}
  .hpbar{width:220px;height:16px;border-radius:8px;background:#101c24;
    border:2px solid #26485a;overflow:hidden;position:relative;
    transition:border-color 0.2s}
  .hpbar.hurt{border-color:#ff5b6e;box-shadow:0 0 15px #ff5b6e88}
  .hpFill{height:100%;width:100%;border-radius:6px;position:absolute;top:0;left:0;
    background:linear-gradient(90deg,#2ee07a,#9df3c4);transition:width .1s;z-index:2}
  .hpFill.p2{background:linear-gradient(90deg,#3a8fe0,#9dd8ff)}
  .shieldFill{position:absolute;top:0;left:0;height:100%;width:0%;
    background:linear-gradient(90deg,#ffd93d,#fff2a8);
    border-radius:6px;transition:width .15s;z-index:3;opacity:.85;
    box-shadow:0 0 10px #ffd93d}
  .hpText{font-size:12px;margin-top:4px;opacity:.85}
  .xpbar{width:220px;height:8px;border-radius:4px;background:#101c24;
    border:1px solid #26485a;overflow:hidden;margin-top:6px}
  .xpFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd93d,#ff8c1a);transition:width .2s}
  .lvlText{font-size:11px;margin-top:3px;color:#ffd93d;letter-spacing:1px}
  #scoreBox{text-align:right;font-size:12px;letter-spacing:2px;line-height:1.8;opacity:.9}
  #scoreBox b{font-size:22px;color:#9df3c4;display:block}
  #hudRoomCode{color:#6ea8a0;font-size:14px;margin-bottom:5px;display:block}
  #hudRoomCode span{color:#ffd93d;font-size:18px;letter-spacing:3px}
  #modeTag{color:#ff8a9a;font-size:11px;letter-spacing:2px;display:block;margin-bottom:3px}
  #btnMenu{pointer-events:auto;cursor:pointer;margin-top:10px;padding:8px 16px;
    border-radius:8px;background:#0e1a20;color:#cfe9d8;border:2px solid #26485a;
    font-size:11px;font-weight:800;letter-spacing:2px}
  #btnMenu:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}
  #powerupHud{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    pointer-events:none;z-index:30;max-width:90vw}
  .pu-badge{padding:8px 14px;border-radius:10px;background:#0a141a;
    border:2px solid #ffd93d;font-size:12px;font-weight:800;letter-spacing:1px;
    color:#ffd93d;text-shadow:0 0 10px #ffd93d;animation:pulse 1s infinite}
  .pu-badge.bad{border-color:#ff5b6e;color:#ff5b6e;text-shadow:0 0 10px #ff5b6e}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle,#0d1a20cc,#000000f2);backdrop-filter:blur(4px);z-index:40}
  #overlay h1{font-size:clamp(36px,9vw,72px);letter-spacing:6px;color:#ff5b6e;
    text-shadow:0 0 30px #ff5b6e88}
  #overlay p{font-size:18px;letter-spacing:2px;opacity:.85;text-align:center}
  #overlay p b{color:#9df3c4;font-size:26px}
  .ov-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .ov-btns button{padding:14px 34px;border-radius:12px;font-size:15px;font-weight:800;
    letter-spacing:2px;transition:.15s;cursor:pointer;border:2px solid}
  #btnRestart{border-color:#2ee07a;background:#0e2a1e;color:#9df3c4;}
  #btnRestart:hover{background:#2ee07a;color:#04140c}
  #btnToMenu{border-color:#26485a;background:#0e1a20;color:#cfe9d8;}
  #btnToMenu:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}

  /* ============ JOYSTICK MOBILE ============ */
  #joystickLayer{position:fixed;inset:0;pointer-events:none;z-index:25;touch-action:none}
  .joystick{position:absolute;bottom:30px;width:140px;height:140px;
    pointer-events:auto;touch-action:none;opacity:.7;transition:opacity .15s}
  .joystick.active{opacity:1}
  #joyMove{left:30px}
  #joyShoot{right:30px}
  .joyBase{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,rgba(46,224,122,0.08),rgba(46,224,122,0.02));
    border:2px solid rgba(46,224,122,0.4);
    box-shadow:inset 0 0 20px rgba(46,224,122,0.1),0 0 15px rgba(46,224,122,0.2)}
  #joyShoot .joyBase{background:radial-gradient(circle,rgba(255,91,110,0.08),rgba(255,91,110,0.02));
    border-color:rgba(255,91,110,0.5);
    box-shadow:inset 0 0 20px rgba(255,91,110,0.1),0 0 15px rgba(255,91,110,0.2)}
  .joyStick{position:absolute;width:60px;height:60px;border-radius:50%;
    left:50%;top:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 30% 30%,#9df3c4,#2ee07a);
    border:2px solid #2ee07a;
    box-shadow:0 0 15px #2ee07a88,inset 0 0 10px #ffffff44;
    transition:transform .05s linear;pointer-events:none}
  #joyShoot .joyStick{background:radial-gradient(circle at 30% 30%,#ffb0b8,#ff5b6e);
    border-color:#ff5b6e;box-shadow:0 0 15px #ff5b6e88,inset 0 0 10px #ffffff44}
  .joyLabel{position:absolute;bottom:-22px;width:100%;text-align:center;
    font-size:10px;letter-spacing:2px;color:#9df3c4;font-weight:800;opacity:.7;
    pointer-events:none}
  #joyShoot .joyLabel{color:#ff8a9a}

  @media (pointer: coarse) {
    canvas{cursor:none}
  }
  @media (min-width: 1024px) and (hover: hover) {
    #joystickLayer{display:none !important}
  }
</style>
</head>
<body>

<div id="authScreen" class="screen">
  <h1>TANK ARENA P2P</h1>
  <div class="auth-tabs">
    <button id="tabLogin" class="active">ĐĂNG NHẬP</button>
    <button id="tabRegister">ĐĂNG KÝ</button>
  </div>
  <div class="panel">
    <input id="inputUsername" placeholder="Tên đăng nhập" maxlength="20">
    <input id="inputPassword" type="password" placeholder="Mật khẩu" maxlength="40">
    <button id="btnAuthSubmit">ĐĂNG NHẬP</button>
    <div id="authMsg"></div>
  </div>
  <div class="hint">Tài khoản được lưu trên trình duyệt của bạn.</div>
</div>

<div id="menuScreen" class="screen hidden">
  <h1>MENU</h1>
  <div class="menu-stats">
    <div>Xin chào, <b id="menuUsername">Player</b></div>
    <div>🏆 Điểm cao nhất (PvE): <b id="menuHighScore">0</b></div>
  </div>
  <div class="panel">
    <button id="btnCreatePvE">🌊 TẠO PHÒNG PvE (ĐẤU QUÁI)</button>
    <button id="btnCreatePvP" class="pvp">⚔️ TẠO PHÒNG PvP (ĐẤU NHAU)</button>
    <input id="inpCode" placeholder="NHẬP MÃ PHÒNG" maxlength="4" style="text-transform:uppercase">
    <button id="btnJoin">VÀO PHÒNG BẰNG MÃ</button>
    <button id="btnLogout" class="ghost" style="margin-top:10px">ĐĂNG XUẤT</button>
    <div id="msg"></div>
  </div>
</div>

<div id="waitingScreen" class="screen hidden">
  <h1>PHÒNG CHỜ</h1>
  <div class="panel">
    <div id="waitingMode" style="opacity:.7;font-size:13px;letter-spacing:2px"></div>
    <div style="opacity:.7;font-size:13px;letter-spacing:2px">MÃ PHÒNG</div>
    <div id="codeDisplay">----</div>
    <div style="font-size:13px;letter-spacing:1px;opacity:.85">
      Trạng thái: <span id="playerCount">Đang kết nối...</span>
    </div>
    <button id="btnReady" class="hidden">BẮT ĐẦU CHIẾN</button>
    <button id="btnLeave" class="ghost">RỜI PHÒNG</button>
  </div>
</div>

<canvas id="game" class="hidden"></canvas>

<!-- JOYSTICKS CHO MOBILE -->
<div id="joystickLayer" class="hidden">
  <div id="joyMove" class="joystick">
    <div class="joyBase"></div>
    <div class="joyStick" id="joyMoveStick"></div>
    <div class="joyLabel">DI CHUYỂN</div>
  </div>
  <div id="joyShoot" class="joystick">
    <div class="joyBase"></div>
    <div class="joyStick" id="joyShootStick"></div>
    <div class="joyLabel">BẮN</div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="hudLeft">
    <div id="p1Hud">
      <div class="hpbar" id="hpBarP1">
        <div class="hpFill" id="hpFillP1"></div>
        <div class="shieldFill" id="shieldFillP1"></div>
      </div>
      <div class="hpText" id="hpTextP1">100 / 100</div>
      <div class="xpbar" id="xpBarWrapP1"><div class="xpFill" id="xpFillP1"></div></div>
      <div class="lvlText" id="lvlWrapP1">LV <span id="lvlValP1">1</span> • XP <span id="xpValP1">0</span>/<span id="xpNeedP1">5</span></div>
    </div>
    <div id="p2Hud" class="hidden">
      <div class="hpbar" id="hpBarP2" style="margin-top:8px;border-color:#3a8fe0">
        <div class="hpFill p2" id="hpFillP2"></div>
      </div>
      <div class="hpText" id="hpTextP2">100 / 100</div>
    </div>
  </div>
  <div id="scoreBox">
    <span id="modeTag"></span>
    <span id="hudRoomCode">MÃ PHÒNG: <span></span></span>
    ĐIỂM<b id="scoreVal">0</b>
    SÓNG<b id="waveVal">1</b>
    <button id="btnMenu">☰ MENU</button>
  </div>
</div>
<div id="powerupHud" class="hidden"></div>

<div id="overlay" class="hidden">
  <h1 id="ovTitle">GAME OVER</h1>
  <p id="ovP1">Điểm: <b id="finalScore">0</b></p>
  <p id="ovP2" style="font-size:14px">Cấp đạt được: <b id="finalLevel" style="font-size:20px">1</b></p>
  <div class="ov-btns">
    <button id="btnRestart">CHƠI LẠI</button>
    <button id="btnToMenu">VỀ MENU</button>
  </div>
</div>

<script>
(function(){
'use strict';

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
const TAU = Math.PI * 2;

function hash(ix, iy, seed) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) +
           Math.imul(seed, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function rr(x, y, w, h, r) {
  w = Math.max(w, 1); h = Math.max(h, 1);
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ==========================================================
   1. ÂM THANH
   ========================================================== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  if (!audioCtx || typeof type !== 'string') return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  const map = {
    shoot:  {t:'square', f1:400, f2:100, g:0.05, d:0.1},
    hit:    {t:'sawtooth', f1:200, f2:50, g:0.1, d:0.1},
    hurt:   {t:'triangle', f1:100, f2:30, g:0.2, d:0.2},
    pickup: {t:'sine', f1:600, f2:1200, g:0.1, d:0.2},
    levelup:{t:'square', f1:400, f2:1600, g:0.15, d:0.4},
    boom:   {t:'sawtooth', f1:80, f2:20, g:0.3, d:0.5},
    laser:  {t:'sawtooth', f1:1200, f2:200, g:0.12, d:0.3},
    curse:  {t:'sawtooth', f1:180, f2:60, g:0.18, d:0.35},
    pvpkill:{t:'square', f1:800, f2:200, g:0.2, d:0.5},
  };
  const m = map[type]; if (!m) { osc.disconnect(); gain.disconnect(); return; }
  osc.type = m.t; osc.frequency.setValueAtTime(m.f1, now);
  osc.frequency.exponentialRampToValueAtTime(m.f2, now+m.d);
  gain.gain.setValueAtTime(m.g, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now+m.d);
  osc.start(now); osc.stop(now+m.d);
}
let shakeTime = 0, shakeIntensity = 0, hitFlash = 0;
function triggerHitEffect() {
  shakeTime = 0.3; shakeIntensity = 15; hitFlash = 1;
  const bar = document.getElementById('hpBarP1');
  if (bar) { bar.classList.add('hurt'); setTimeout(() => bar.classList.remove('hurt'), 200); }
}

/* ==========================================================
   2. TÀI KHOẢN
   ========================================================== */
const ACCOUNTS_KEY = 'tankArenaAccounts';
const SESSION_KEY = 'tankArenaSession';
function getAccounts() { try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}'); } catch { return {}; } }
function saveAccounts(a) { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }
function hashPass(pw) { let h=5381; for(let i=0;i<pw.length;i++) h=((h<<5)+h+pw.charCodeAt(i))|0; return h.toString(36); }
function registerUser(u, p) {
  if (u.length < 3) return { ok: false, msg: 'Tên phải có ít nhất 3 ký tự' };
  if (p.length < 4) return { ok: false, msg: 'Mật khẩu phải có ít nhất 4 ký tự' };
  const a = getAccounts();
  if (a[u]) return { ok: false, msg: 'Tên đăng nhập đã tồn tại' };
  a[u] = { pass: hashPass(p), highScore: 0 }; saveAccounts(a); return { ok: true };
}
function loginUser(u, p) {
  const a = getAccounts();
  if (!a[u]) return { ok: false, msg: 'Tài khoản không tồn tại' };
  if (a[u].pass !== hashPass(p)) return { ok: false, msg: 'Sai mật khẩu' };
  localStorage.setItem(SESSION_KEY, u); return { ok: true };
}
function updateHighScore(u, score) {
  const a = getAccounts();
  if (!a[u]) return;
  if (score > (a[u].highScore || 0)) {
    a[u].highScore = score; saveAccounts(a);
    document.getElementById('menuHighScore').textContent = score;
  }
}
let currentUser = localStorage.getItem(SESSION_KEY);

/* ==========================================================
   3. UI
   ========================================================== */
const screens = {
  auth: document.getElementById('authScreen'),
  menu: document.getElementById('menuScreen'),
  waiting: document.getElementById('waitingScreen')
};
const canvasEl = document.getElementById('game');
const hudEl = document.getElementById('hud');
const powerupHudEl = document.getElementById('powerupHud');
const joystickLayer = document.getElementById('joystickLayer');

function show(name) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  canvasEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  powerupHudEl.classList.add('hidden');
  joystickLayer.classList.add('hidden');
  if (name === 'game') {
    canvasEl.classList.remove('hidden');
    hudEl.classList.remove('hidden');
    powerupHudEl.classList.remove('hidden');
    if (isTouchDevice) joystickLayer.classList.remove('hidden');
  } else if (screens[name]) screens[name].classList.remove('hidden');
}
function showMenu() {
  if (!currentUser) { show('auth'); return; }
  show('menu');
  document.getElementById('menuUsername').textContent = currentUser;
  const a = getAccounts();
  document.getElementById('menuHighScore').textContent = (a[currentUser] && a[currentUser].highScore) || 0;
}

/* ==========================================================
   PHÁT HIỆN THIẾT BỊ CẢM ỨNG
   ========================================================== */
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

if (currentUser) showMenu(); else show('auth');

let authMode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabReg = document.getElementById('tabRegister');
const btnAuth = document.getElementById('btnAuthSubmit');
const authMsg = document.getElementById('authMsg');
tabLogin.onclick = () => { authMode = 'login'; tabLogin.classList.add('active'); tabReg.classList.remove('active'); btnAuth.textContent = 'ĐĂNG NHẬP'; authMsg.textContent = ''; };
tabReg.onclick = () => { authMode = 'register'; tabReg.classList.add('active'); tabLogin.classList.remove('active'); btnAuth.textContent = 'ĐĂNG KÝ'; authMsg.textContent = ''; };
btnAuth.onclick = () => {
  initAudio();
  const u = document.getElementById('inputUsername').value.trim();
  const p = document.getElementById('inputPassword').value;
  authMsg.style.color = '#ff8a9a';
  if (!u || !p) { authMsg.textContent = 'Vui lòng nhập đầy đủ'; return; }
  if (authMode === 'register') {
    const res = registerUser(u, p);
    if (!res.ok) { authMsg.textContent = res.msg; return; }
    loginUser(u, p);
  } else {
    const res = loginUser(u, p);
    if (!res.ok) { authMsg.textContent = res.msg; return; }
  }
  currentUser = u;
  document.getElementById('inputPassword').value = '';
  showMenu();
};
document.getElementById('btnLogout').onclick = () => {
  localStorage.removeItem(SESSION_KEY); currentUser = null; show('auth');
};

/* ==========================================================
   4. P2P
   ========================================================== */
let peer = null, conn = null, isHost = false;
let myId = Math.random().toString(36).substr(2, 5);
let myRoomCode = '';
let gameStarted = false;
let pendingMode = 'pve';
let pendingClient = null;

function createRoom(mode) {
  initAudio();
  isHost = true;
  pendingMode = mode;
  myRoomCode = Math.random().toString(36).substr(2, 4).toUpperCase();
  document.getElementById('codeDisplay').textContent = myRoomCode;
  document.getElementById('waitingMode').textContent = mode === 'pvp' ? '⚔️ CHẾ ĐỘ PVP' : '🌊 CHẾ ĐỘ PVE';
  document.getElementById('waitingMode').style.color = mode === 'pvp' ? '#ff8a9a' : '#9df3c4';

function setupConnection() {
  conn.on('open', () => {
    conn.send({ type: 'join', name: currentUser, id: myId });
    if (!isHost) {
      document.getElementById('playerCount').textContent = 'Đã kết nối (Client)';
      document.getElementById('btnReady').classList.remove('hidden');
    }
    show('waiting');
  });
  conn.on('data', (data) => {
    if (isHost) {
      if (data.type === 'join') {
        pendingClient = { id: data.id, name: data.name };
        if (state && !state.players[data.id]) {
          state.players[data.id] = makePlayer(data.id, data.name || 'Player2', state.mode);
          if (state.mode === 'pvp') {
            state.players[data.id].x = 300;
            state.players[data.id].y = 0;
          }
        }
      }
      if (data.type === 'ready' && !gameStarted) startGameAsHost();
      if (data.type === 'input' && state && state.players[data.id]) state.players[data.id].input = data.input;
      if (data.type === 'restartRequest' && state && state.over) restartGameAsHost();
    } else {
      if (data.type === 'state') {
        state = data.state;
        if (state.events && state.events.length) {
          state.events.forEach(e => {
            if (e && e.type === 'hurt') { playSound('hurt'); if (e.target === myId) triggerHitEffect(); }
            else if (typeof e === 'string') playSound(e);
          });
          state.events = [];
        }
        if (!gameStarted) {
          gameStarted = true; show('game');
          document.getElementById('hudRoomCode').querySelector('span').textContent = myRoomCode;
        }
        updateHUD(state, myId);
        updatePowerupHUD(state, myId);
      }
      if (data.type === 'restart') {
        hideOverlay();
        gameStarted = true;
      }
      if (data.type === 'gameover') {
        showPvEGameOver(data.score || 0, data.level || 1);
      }
      if (data.type === 'pvpGameover') {
        state.over = true;
        state.winner = data.winner;
        showPvPGameOver(data.winner);
      }
    }
  });
  conn.on('close', () => { if (gameStarted) { alert('Mất kết nối phòng!'); location.reload(); } });
}

function updateHUD(st, myId) {
  const isPvP = st.mode === 'pvp';
  document.getElementById('xpBarWrapP1').style.display = isPvP ? 'none' : '';
  document.getElementById('lvlWrapP1').style.display = isPvP ? 'none' : '';
  document.getElementById('modeTag').textContent = isPvP ? '⚔️ PVP' : '🌊 PVE';
  document.getElementById('modeTag').style.color = isPvP ? '#ff8a9a' : '#9df3c4';

  const me = st.players[myId];
  if (me) {
    const maxHp = me.maxHp || 100;
    const hpPct = Math.max(0, Math.min(100, (me.hp / maxHp) * 100));
    const shieldPct = (me.powerups && me.powerups.shield > 0)
      ? Math.max(0, Math.min(100, ((me.shieldHp || 0) / maxHp) * 100))
      : 0;
    document.getElementById('hpFillP1').style.width = hpPct + '%';
    document.getElementById('shieldFillP1').style.width = shieldPct + '%';
    const shieldTxt = (me.powerups && me.powerups.shield > 0) ? '  🛡' + Math.round(me.shieldHp || 0) : '';
    document.getElementById('hpTextP1').textContent =
      Math.max(0, Math.round(me.hp)) + ' / ' + Math.round(maxHp) + shieldTxt;
    document.getElementById('scoreVal').textContent = me.score;
    document.getElementById('waveVal').textContent = st.wave;
    if (!isPvP) {
      document.getElementById('lvlValP1').textContent = me.level || 1;
      document.getElementById('xpValP1').textContent = Math.floor(me.xp || 0);
      document.getElementById('xpNeedP1').textContent = xpNeeded(me.level || 1);
      const xpPct = ((me.xp || 0) / xpNeeded(me.level || 1)) * 100;
      document.getElementById('xpFillP1').style.width = Math.min(100, xpPct) + '%';
    }
  }
  const p2 = Object.values(st.players).find(p => p.id !== myId);
  if (p2) {
    document.getElementById('p2Hud').classList.remove('hidden');
    const maxHp2 = p2.maxHp || 100;
    document.getElementById('hpFillP2').style.width =
      Math.max(0, Math.min(100, (p2.hp / maxHp2) * 100)) + '%';
    document.getElementById('hpTextP2').textContent =
      Math.max(0, Math.round(p2.hp)) + ' / ' + Math.round(maxHp2) + '  (' + p2.name + ')';
  } else document.getElementById('p2Hud').classList.add('hidden');
}

const PU_LABEL = {
  laser: '⚡ LASER', bomb: '💣 BOM', shield: '🛡️ KHIÊN',
  speed: '👟 TỐC ĐỘ', pierce: '🔱 XUYÊN', tripleshot: '🔥 3 TIA',
  curse: '💀 YẾU', slow: '🐌 CHẬM', burn: '🔥 BỎNG', confuse: '🌀 RỐI',

};

function updatePowerupHUD(st, myId) {
  const me = st.players[myId];
  if (!me || !me.powerups) { powerupHudEl.innerHTML = ''; return; }
  let html = '';
  for (const k in me.powerups) {

      html += `<div class="pu-badge${isBad ? ' bad' : ''}">${PU_LABEL[k] || k} ${t.toFixed(1)}s</div>`;

/* ==========================================================
   5. GAME STATE
   ========================================================== */
let state = null, lastTime = performance.now(), sendTimer = 0;

function xpNeeded(level) { return 5 + (level - 1) * 3; }

function makePlayer(id, name, mode) {
  mode = mode || 'pve';
  return {
    id, name, x: 0, y: 0,
    hp: 100, maxHp: 100, score: 0,
    angle: -Math.PI/2, aim: 0,
    input: {x:0, y:0, aim:0, shoot:false},
    level: 1, xp: 0,
    fireRate: mode === 'pvp' ? 180 : 150,
    damage:    mode === 'pvp' ? 14  : 20,
    bulletSpeed: 1000,
    powerups: {
      laser:0, bomb:0, shield:0, speed:0,
      pierce:0, tripleshot:0,
      curse:0, slow:0, burn:0, confuse:0,
      freeze:0, jam:0
    },
    shieldHp: 0,
    burnTick: 0,
    lastShoot: 0,
    levelUpFlash: 0,
    curseFlash: 0,
    pvpInvuln: 0
  };
}

function initGame(mode) {
  mode = mode || 'pve';
  state = {
    mode,
    time: 0, wave: 1, spawnTimer: 1, bossIndex: 0, over: false,
    players: { [myId]: makePlayer(myId, currentUser, mode) },
    enemies: [], bullets: [], ebullets: [], pickups: [],
    particles: [], beams: [],
    events: [],
    arena: mode === 'pvp' ? { w: 1600, h: 1600 } : null,
    pvpSpawnTimer: 2.5,
    winner: null,
    announce: null
  };
  if (isHost && pendingClient) {
    state.players[pendingClient.id] = makePlayer(pendingClient.id, pendingClient.name, mode);
  }
  if (mode === 'pvp') {
    const ids = Object.keys(state.players);
    ids.forEach((id, i) => {
      state.players[id].x = i === 0 ? -300 : 300;
      state.players[id].y = 0;
    });
    state.announce = { text: 'PVP - HẠ GỤC ĐỐI THỦ', t: 2.5 };
  }
}

const TYPES = [
  { behavior: 'chase',    hp: 22,  speed: 96, r: 15, dmg: 8,  score: 10, color: '#7bd66b', stroke: '#3d8a35', xp: 1 },
  { behavior: 'chase',    hp: 52,  speed: 72, r: 23, dmg: 15, score: 25, color: '#e8a13a', stroke: '#a86a15', xp: 2 },
  { behavior: 'chase',    hp: 135, speed: 48, r: 33, dmg: 27, score: 60, color: '#d9506a', stroke: '#8b2a3c', xp: 4 },
  { behavior: 'shoot',    hp: 40,  speed: 60, r: 18, dmg: 12, score: 35, color: '#b46bff', stroke: '#6a2f9e', xp: 2 },
  { behavior: 'zigzag',   hp: 30,  speed: 120, r: 16, dmg: 10, score: 20, color: '#4dd9ff', stroke: '#1b4a5e', xp: 2 },
  { behavior: 'splitter', hp: 80,  speed: 55, r: 26, dmg: 18, score: 45, color: '#ff66b2', stroke: '#8a1f4d', xp: 3 }
];

function spawnEnemy() {
  if (state.enemies.length > 100) return;
  const margin = 100;
  const maxW = innerWidth / 2 + margin, maxH = innerHeight / 2 + margin;
  let spawnX, spawnY;
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { spawnX = (Math.random() * 2 - 1) * maxW; spawnY = -maxH; }
  else if (side === 1) { spawnX = maxW; spawnY = (Math.random() * 2 - 1) * maxH; }
  else if (side === 2) { spawnX = (Math.random() * 2 - 1) * maxW; spawnY = maxH; }
  else { spawnX = -maxW; spawnY = (Math.random() * 2 - 1) * maxH; }

  let avgX = 0, avgY = 0, count = 0;
  for (const id in state.players) {
    if (state.players[id].hp > 0) { avgX += state.players[id].x; avgY += state.players[id].y; count++; }
  }
  if (count > 0) { avgX /= count; avgY /= count; }

  let available = [0, 1, 2];
  if (state.wave >= 2) available.push(4);
  if (state.wave >= 3) available.push(3);
  if (state.wave >= 4) available.push(5);
  let idx = available[Math.floor(Math.random() * available.length)];
  if (Math.random() < 0.1 + state.wave * 0.02) idx = 2;
  const t = TYPES[idx];
  const hpScale = 1 + (state.wave - 1) * 0.1;

  state.enemies.push({
    x: avgX + spawnX, y: avgY + spawnY,
    behavior: t.behavior,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed * (1 + state.wave * 0.02), r: t.r, dmg: t.dmg,
    score: t.score, xp: t.xp, color: t.color, stroke: t.stroke,
    angle: 0, hitFlash: 0, seed: Math.random() * 10,
    isBig: idx === 2, isBoss: false, atkCd: rand(1,3),
    spawnAnim: 0.4, wobble: Math.random()*100
  });
}

function spawnBoss() {
  const type = state.bossIndex % 6; state.bossIndex++;
  const stats = [
    { hp: 720, speed: 66, r: 48, color: '#b46bff', stroke: '#6a2f9e', xp: 15 },
    { hp: 520, speed: 78, r: 46, color: '#ff4d6d', stroke: '#8a1f35', xp: 15 },
    { hp: 420, speed: 90, r: 44, color: '#ff8c1a', stroke: '#a04d00', xp: 15 },
    { hp: 560, speed: 55, r: 46, color: '#1ac4c4', stroke: '#0a7272', xp: 15 },
    { hp: 480, speed: 80, r: 45, color: '#e0e0e0', stroke: '#555', xp: 15 },
    { hp: 650, speed: 40, r: 50, color: '#ffd93d', stroke: '#8a6d1a', xp: 15 }
  ];
  const s = stats[type];
  let avgX = 0, avgY = 0, count = 0;
  for (const id in state.players) { avgX += state.players[id].x; avgY += state.players[id].y; count++; }
  if (count > 0) { avgX /= count; avgY /= count; }
  state.enemies.push({
    x: avgX + 700, y: avgY, hp: s.hp + state.wave * 100, maxHp: s.hp + state.wave * 100,
    speed: s.speed, r: s.r, dmg: 30 + state.wave * 2, score: 300 + state.wave * 30,
    xp: s.xp, color: s.color, stroke: s.stroke, angle: 0, hitFlash: 0, seed: Math.random() * 10,
    isBoss: true, bossType: type, atkCd: 1.5, spawnAnim: 0.8, wobble: Math.random()*100
  });
  state.events.push('pickup');
}

/* ==========================================================
   6. POWER-UPS
   ========================================================== */
const POWERUPS = [
  { type: 'health',    color: '#2ee07a', icon: '+', weight: 16, bad: false },
  { type: 'laser',     color: '#4dd9ff', icon: '⚡', weight: 9,  bad: false },
  { type: 'bomb',      color: '#ff5b6e', icon: '💣', weight: 9,  bad: false },
  { type: 'shield',    color: '#ffd93d', icon: '🛡', weight: 10, bad: false },
  { type: 'speed',     color: '#ff8c1a', icon: '»', weight: 10, bad: false },
  { type: 'pierce',    color: '#b46bff', icon: '➤', weight: 9,  bad: false },
  { type: 'tripleshot',color: '#ff66b2', icon: '⋔', weight: 9,  bad: false },
  { type: 'curse',     color: '#8a1f35', icon: '💀', weight: 6,  bad: true },
  { type: 'slow',      color: '#5a4a8a', icon: '🐌', weight: 5,  bad: true },
  { type: 'burn',      color: '#ff3a1a', icon: '🔥', weight: 5,  bad: true },
  { type: 'confuse',   color: '#8a1f8a', icon: '🌀', weight: 4,  bad: true },
  { type: 'freeze',    color: '#4dd9ff', icon: '❄', weight: 5,  bad: true },
  { type: 'jam',       color: '#888888', icon: '🐢', weight: 5,  bad: true },
];
function pickPowerupType() {
  const total = POWERUPS.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for (const p of POWERUPS) { r -= p.weight; if (r <= 0) return p.type; }
  return 'health';
}
function spawnPowerup(x, y, forceType) {
  const type = forceType || pickPowerupType();
  const def = POWERUPS.find(p=>p.type===type) || POWERUPS[0];
  state.pickups.push({
    x, y, type, color: def.color, icon: def.icon, bad: def.bad,
    life: 15, bob: Math.random()*Math.PI*2
  });
}

/* ==========================================================
   7. PARTICLES / EFFECTS
   ========================================================== */
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU;
    const s = speed * (0.3 + Math.random() * 0.7);
    state.particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 0.4 + Math.random()*0.4, maxLife: 0.8,
      color, r: 2 + Math.random()*3
    });
  }
}
function spawnLaser(x, y, angle, owner) {
  state.beams.push({ x, y, angle, life: 0.15, maxLife: 0.15, owner });
  const len = 2000;
  for (const e of state.enemies) {
    const dx = e.x - x, dy = e.y - y;
    const proj = dx * Math.cos(angle) + dy * Math.sin(angle);
    if (proj < 0 || proj > len) continue;
    const perp = Math.abs(-dx * Math.sin(angle) + dy * Math.cos(angle));
    if (perp < e.r + 8) {
      e.hp -= 50; e.hitFlash = 0.15;
      spawnParticles(e.x, e.y, e.color, 5, 150);
      if (e.hp <= 0) killEnemy(e, owner);
    }
  }
  if (state.mode === 'pvp') {
    for (const id in state.players) {
      if (id === owner) continue;
      const p = state.players[id];
      if (p.hp <= 0 || p.pvpInvuln > 0) continue;
      const dx = p.x - x, dy = p.y - y;
      const proj = dx * Math.cos(angle) + dy * Math.sin(angle);
      if (proj < 0 || proj > len) continue;
      const perp = Math.abs(-dx * Math.sin(angle) + dy * Math.cos(angle));
      if (perp < 20) {
        if (p.powerups.shield > 0) {
          if (!p.shieldHp) p.shieldHp = 40;
          p.shieldHp -= 30;
          if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
        } else {
          p.hp -= 30;
          p.pvpInvuln = 0.3;
        }
        spawnParticles(p.x, p.y, '#4dd9ff', 8, 200);
        state.events.push({ type: 'hurt', target: id });
      }
    }
  }
}
function explodeBomb(x, y, owner) {
  const R = 220;
  state.beams.push({ x, y, angle: 0, life: 0.4, maxLife: 0.4, owner, bomb: true, radius: R });
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    if (dist(x, y, e.x, e.y) < R + e.r) {
      e.hp -= 120; e.hitFlash = 0.2;
      spawnParticles(e.x, e.y, '#ff5b6e', 8, 200);
      if (e.hp <= 0) killEnemy(e, owner);
    }
  }
  if (state.mode === 'pvp') {
    for (const id in state.players) {
      if (id === owner) continue;
      const p = state.players[id];
      if (p.hp <= 0 || p.pvpInvuln > 0) continue;
      if (dist(x, y, p.x, p.y) < R + 20) {
        if (p.powerups.shield > 0) {
          if (!p.shieldHp) p.shieldHp = 40;
          p.shieldHp -= 60;
          if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
        } else {
          p.hp -= 60;
          p.pvpInvuln = 0.3;
        }
        spawnParticles(p.x, p.y, '#ff5b6e', 12, 250);
        state.events.push({ type: 'hurt', target: id });
      }
    }
  }
  spawnParticles(x, y, '#ff8c1a', 40, 400);
  playSound('boom');
}
function killEnemy(e, ownerId) {
  const idx = state.enemies.indexOf(e);
  if (idx === -1) return;
  state.enemies.splice(idx, 1);
  spawnParticles(e.x, e.y, e.color, e.isBoss ? 40 : 12, e.isBoss ? 400 : 200);
  const owner = state.players[ownerId];
  if (owner) {
    owner.score += e.score;
    owner.xp += e.xp;
    while (owner.xp >= xpNeeded(owner.level)) {
      owner.xp -= xpNeeded(owner.level);
      owner.level++;
      owner.maxHp += 10;
      owner.hp = Math.min(owner.maxHp, owner.hp + 20);
      owner.damage += 2;
      owner.fireRate = Math.max(60, owner.fireRate - 8);
      owner.levelUpFlash = 1;
      spawnParticles(owner.x, owner.y, '#ffd93d', 30, 300);
      state.events.push('levelup');
    }
    if (Math.random() < 0.18) spawnPowerup(e.x, e.y);
  }
  if (e.behavior === 'splitter') {
    for (let k = 0; k < 2; k++) {
      state.enemies.push({
        x: e.x+rand(-20,20), y: e.y+rand(-20,20),
        behavior: 'chase', hp: 20, maxHp: 20, speed: 100, r: 12, dmg: 8,
        score: 10, xp: 1, color: '#7bd66b', stroke: '#3d8a35',
        angle:0, hitFlash:0, seed:Math.random()*10, isBoss:false,
        atkCd:2, spawnAnim: 0.3, wobble: Math.random()*100
      });
    }
  }
}

/* ==========================================================
   8. HOST LOOP
   ========================================================== */
function hostLoop(now) {
  if (!isHost || !state || state.over) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  state.time += dt;

  if (state.announce) {
    state.announce.t -= dt;
    if (state.announce.t <= 0) state.announce = null;
  }

  const isPvP = state.mode === 'pvp';

  if (!isPvP) {
    if (state.time > state.wave * 15) { state.wave++; state.events.push('pickup'); }
  }

  let aliveCount = 0;
  let aliveId = null;
  for (const id in state.players) {
    if (state.players[id].hp > 0) { aliveCount++; aliveId = id; }
  }

  if (isPvP) {
    if (aliveCount <= 1) {
      state.over = true;
      state.winner = aliveId;
      if (conn && conn.open) {
        conn.send({ type: 'pvpGameover', winner: state.winner });
        conn.send({ type: 'state', state: JSON.parse(JSON.stringify(state)) });
      }
      if (state.winner === myId) playSound('pvpkill');
      showPvPGameOver(state.winner);
      return;
    }
  } else {
    if (aliveCount === 0) {
      state.over = true;
      const me = state.players[myId];
      const finalScore = me ? me.score : 0;
      const finalLevel = me ? me.level : 1;
      if (conn && conn.open) {
        conn.send({ type: 'gameover', score: finalScore, level: finalLevel });
        conn.send({ type: 'state', state: JSON.parse(JSON.stringify(state)) });
      }
      updateHighScore(currentUser, finalScore);
      showPvEGameOver(finalScore, finalLevel);
      return;
    }
  }

  if (!isPvP) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      state.spawnTimer = Math.max(0.3, 1.5 - state.wave * 0.1);
      let num = state.wave >= 10 ? 4 : state.wave >= 6 ? 3 : state.wave >= 3 ? 2 : 1;
      for (let i=0; i<num; i++) spawnEnemy();
    }
    if (state.wave % 3 === 0 && !state.enemies.some(e=>e.isBoss) && state.time > state.wave*15 - 1) spawnBoss();
  }

  if (isPvP) {
    state.pvpSpawnTimer -= dt;
    if (state.pvpSpawnTimer <= 0 && state.pickups.length < 4) {
      state.pvpSpawnTimer = 3 + Math.random() * 2;
      const hw = state.arena.w / 2 - 100;
      const hh = state.arena.h / 2 - 100;
      spawnPowerup(rand(-hw, hw), rand(-hh, hh));
    }
  }

  for (const id in state.players) {
    const p = state.players[id];
    if (p.hp <= 0) continue;
    if (p.pvpInvuln > 0) p.pvpInvuln -= dt;

    for (const k in p.powerups) if (p.powerups[k] > 0) p.powerups[k] = Math.max(0, p.powerups[k] - dt);
    if (p.levelUpFlash > 0) p.levelUpFlash -= dt;
    if (p.curseFlash > 0) p.curseFlash -= dt;

    if (p.powerups.burn > 0) {
      p.burnTick = (p.burnTick || 0) + dt;
      if (p.burnTick >= 0.5) {
        p.burnTick = 0;
        p.hp -= 1.5;
        spawnParticles(p.x + rand(-10,10), p.y + rand(-10,10), '#ff3a1a', 3, 80);
        state.events.push({ type: 'hurt', target: p.id });
        if (p.hp <= 0) p.hp = 0;
      }
    } else p.burnTick = 0;

    let inX = p.input.x, inY = p.input.y;
    if (p.powerups.confuse > 0) { inX = -inX; inY = -inY; }

    let speedMul = 1;
    if (p.powerups.speed > 0) speedMul *= 1.6;
    if (p.powerups.slow > 0) speedMul *= 0.6;
    if (p.powerups.freeze > 0) speedMul *= 0.35;

    const len = Math.hypot(inX, inY);
    if (len > 0) {
      p.x += (inX / len) * 280 * speedMul * dt;
      p.y += (inY / len) * 280 * speedMul * dt;
      p.angle = Math.atan2(inY, inX);
    }
    p.aim = p.input.aim;

    if (state.arena) {
      const hw = state.arena.w / 2 - 20;
      const hh = state.arena.h / 2 - 20;
      p.x = clamp(p.x, -hw, hw);
      p.y = clamp(p.y, -hh, hh);
    }

    let fireRate = p.fireRate;
    if (p.powerups.jam > 0) fireRate *= 2.0;

    if (p.input.shoot && (!p.lastShoot || now - p.lastShoot > fireRate)) {
      p.lastShoot = now;
      let dmg = p.damage;
      if (p.powerups.pierce > 0) dmg += 10;
      if (p.powerups.curse > 0) dmg *= 0.8;
      if (isPvP) dmg *= 0.6;
      const pierce = p.powerups.pierce > 0;
      const shots = p.powerups.tripleshot > 0 ? [-0.18, 0, 0.18] : [0];
      for (const off of shots) {
        const a = p.aim + off;
        state.bullets.push({
          x: p.x + Math.cos(a) * 30, y: p.y + Math.sin(a) * 30,
          vx: Math.cos(a) * p.bulletSpeed, vy: Math.sin(a) * p.bulletSpeed,
          life: 1.2, owner: id, dmg, pierce, hitSet: []
        });
      }
      if (p.powerups.laser > 0 && (!p.lastLaser || now - p.lastLaser > 400)) {
        p.lastLaser = now;
        spawnLaser(p.x, p.y, p.aim, id);
        state.events.push('laser');
      }
      if (p.powerups.bomb > 0 && (!p.lastBomb || now - p.lastBomb > 800)) {
        p.lastBomb = now;
        const tx = p.x + Math.cos(p.aim) * 260, ty = p.y + Math.sin(p.aim) * 260;
        explodeBomb(tx, ty, id);
      }
      state.events.push('shoot');
    }
  }

  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.bullets.splice(i, 1); continue; }

    let consumed = false;
    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      if (b.hitSet && b.hitSet.includes(e)) continue;
      if (dist(e.x, e.y, b.x, b.y) < e.r + 6) {
        e.hp -= b.dmg; e.hitFlash = 0.12;
        spawnParticles(b.x, b.y, '#fff8cc', 3, 120);
        if (e.hp <= 0) killEnemy(e, b.owner);
        if (b.pierce) { b.hitSet.push(e); }
        else { consumed = true; break; }
        state.events.push('hit');
        if (consumed) break;
      }
    }
    if (consumed) { state.bullets.splice(i, 1); continue; }

    if (state.mode === 'pvp') {
      for (const pid in state.players) {
        if (pid === b.owner) continue;
        const p = state.players[pid];
        if (p.hp <= 0 || p.pvpInvuln > 0) continue;
        if (dist(p.x, p.y, b.x, b.y) < 20 + 6) {
          if (p.powerups.shield > 0) {
            if (!p.shieldHp) p.shieldHp = 40;
            p.shieldHp -= b.dmg;
            if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
            spawnParticles(p.x, p.y, '#ffd93d', 6, 150);
          } else {
            p.hp -= b.dmg;
            p.pvpInvuln = 0.25;
            spawnParticles(p.x, p.y, '#ff5b6e', 8, 200);
          }
          state.events.push({ type: 'hurt', target: pid });
          state.bullets.splice(i, 1);
          break;
        }
      }
    }
  }

  for (const e of state.enemies) {
    if (e.spawnAnim > 0) { e.spawnAnim -= dt; e.wobble += dt * 8; continue; }
    e.wobble += dt * 4;
    let target = null, minD = Infinity;
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp <= 0) continue;
      const d = dist(p.x, p.y, e.x, e.y);
      if (d < minD) { minD = d; target = p; }
    }
    if (!target) continue;
    const dx = target.x - e.x, dy = target.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx/d, uy = dy/d;

    if (e.isBoss) {
      e.x += ux * e.speed * dt; e.y += uy * e.speed * dt;
      e.atkCd -= dt;
      if (e.atkCd <= 0) {
        e.atkCd = 2.5;
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2 + state.time;
          state.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*200, vy: Math.sin(a)*200, r: 9, dmg: e.dmg, life: 5, color: e.color });
        }
      }
    } else {
      if (e.behavior === 'chase') { e.x += ux * e.speed * dt; e.y += uy * e.speed * dt; }
      else if (e.behavior === 'zigzag') {
        const px = -uy, py = ux, zig = Math.sin(state.time * 12 + e.seed) * 1.5;
        e.x += (ux + px * zig) * e.speed * 0.8 * dt;
        e.y += (uy + py * zig) * e.speed * 0.8 * dt;
      } else if (e.behavior === 'shoot') {
        if (d > 320) { e.x += ux * e.speed * dt; e.y += uy * e.speed * dt; }
        else if (d < 250) { e.x -= ux * e.speed * dt; e.y -= uy * e.speed * dt; }
        e.atkCd -= dt;
        if (e.atkCd <= 0 && d < 600) {
          e.atkCd = rand(2, 3.5);
          state.ebullets.push({ x: e.x, y: e.y, vx: ux * 350, vy: uy * 350, r: 7, dmg: e.dmg, life: 4, color: '#b46bff' });
        }
      } else if (e.behavior === 'splitter') {
        e.x += ux * e.speed * dt; e.y += uy * e.speed * dt;
      }
    }
    if (d < e.r + 18 && target.hp > 0) {
      let dmg = e.dmg * dt;
      if (target.powerups.shield > 0) {
        if (!target.shieldHp) target.shieldHp = 40;
        target.shieldHp -= dmg * 2;
        if (target.shieldHp <= 0) { target.powerups.shield = 0; target.shieldHp = 0; }
      } else {
        target.hp -= dmg;
        if (Math.random() < 0.1) state.events.push({ type: 'hurt', target: target.id });
      }
    }
  }

  for (let i = state.ebullets.length - 1; i >= 0; i--) {
    const b = state.ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.ebullets.splice(i, 1); continue; }
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp > 0 && dist(p.x, p.y, b.x, b.y) < 20 + b.r) {
        if (p.powerups.shield > 0) {
          if (!p.shieldHp) p.shieldHp = 40;
          p.shieldHp -= b.dmg;
          if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
        } else {
          p.hp -= b.dmg;
          state.events.push({ type: 'hurt', target: p.id });
        }
        state.ebullets.splice(i, 1);
        break;
      }
    }
  }

  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const k = state.pickups[i];
    k.life -= dt;
    k.bob += dt * 4;
    if (k.life <= 0) { state.pickups.splice(i, 1); continue; }
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp > 0 && dist(p.x, p.y, k.x, k.y) < 32) {
        applyPickup(p, k);
        state.pickups.splice(i, 1);
        break;
      }
    }
  }

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pa = state.particles[i];
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    pa.vx *= 0.94; pa.vy *= 0.94;
    pa.life -= dt;
    if (pa.life <= 0) state.particles.splice(i, 1);
  }
  for (let i = state.beams.length - 1; i >= 0; i--) {
    const bm = state.beams[i];
    bm.life -= dt;
    if (bm.life <= 0) state.beams.splice(i, 1);
  }

  state.events.forEach(e => {
    if (e && e.type === 'hurt') { playSound('hurt'); if (e.target === myId) triggerHitEffect(); }
    else if (typeof e === 'string') playSound(e);
  });

  sendTimer += dt;
  if (sendTimer > 0.05) {
    sendTimer = 0;
    if (conn && conn.open) {
      const sendState = JSON.parse(JSON.stringify(state));
      for (const id in sendState.players) delete sendState.players[id].input;
      conn.send({ type: 'state', state: sendState });
    }
    state.events = [];
  }

  updateHUD(state, myId);
  updatePowerupHUD(state, myId);
  drawGame(state, myId);
  requestAnimationFrame(hostLoop);
}

function applyPickup(p, k) {
  switch (k.type) {
    case 'health': p.hp = Math.min(p.maxHp, p.hp + 40); break;
    case 'laser': p.powerups.laser = Math.min(15, p.powerups.laser + 8); break;
    case 'bomb': p.powerups.bomb = Math.min(15, p.powerups.bomb + 8); break;
    case 'shield': p.powerups.shield = Math.min(15, p.powerups.shield + 8); p.shieldHp = 40; break;
    case 'speed': p.powerups.speed = Math.min(15, p.powerups.speed + 8); break;
    case 'pierce': p.powerups.pierce = Math.min(15, p.powerups.pierce + 8); break;
    case 'tripleshot': p.powerups.tripleshot = Math.min(15, p.powerups.tripleshot + 8); break;
    case 'curse': p.powerups.curse = Math.min(15, p.powerups.curse + 10); break;
    case 'slow': p.powerups.slow = Math.min(15, p.powerups.slow + 8); break;
    case 'burn': p.powerups.burn = Math.min(15, p.powerups.burn + 6); break;
    case 'confuse': p.powerups.confuse = Math.min(15, p.powerups.confuse + 5); break;
    case 'freeze': p.powerups.freeze = Math.min(15, p.powerups.freeze + 6); break;
    case 'jam': p.powerups.jam = Math.min(15, p.powerups.jam + 7); break;
  }
  state.events.push('pickup');
  spawnParticles(k.x, k.y, k.color, 15, 250);
  if (PU_BAD.includes(k.type)) {
    p.curseFlash = 1;
    state.events.push('curse');
    state.events.push({ type: 'hurt', target: p.id });
  }
}

/* ==========================================================
   9. CLIENT LOOP
   ========================================================== */
let inputTimer = 0;
function clientLoop(now) {
  if (isHost || (state && state.over)) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  inputTimer += dt;
  if (inputTimer > 0.033 && conn && conn.open) {
    inputTimer = 0;
    conn.send({ type: 'input', id: myId, input: getInputs() });
  }
  if (state) {
    if (!gameStarted) {
      gameStarted = true; show('game');
      document.getElementById('hudRoomCode').querySelector('span').textContent = myRoomCode;
    }
    updatePowerupHUD(state, myId);
    drawGame(state, myId);
  }
  requestAnimationFrame(clientLoop);
}

/* ==========================================================
   10. INPUT — CHUỘT/BÀN PHÍM + JOYSTICK
   ========================================================== */
const keys = Object.create(null);
const mouse = { x: innerWidth / 2, y: innerHeight / 2, down: false };
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvasEl.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvasEl.addEventListener('mousedown', e => { mouse.down = true; });
addEventListener('mouseup', e => { mouse.down = false; });
canvasEl.addEventListener('contextmenu', e => e.preventDefault());

/* ============ JOYSTICK ============ */
const joyMove = document.getElementById('joyMove');
const joyShoot = document.getElementById('joyShoot');
const joyMoveStick = document.getElementById('joyMoveStick');
const joyShootStick = document.getElementById('joyShootStick');

const joyMoveState = { active: false, touchId: null, dx: 0, dy: 0 };
const joyShootState = { active: false, touchId: null, dx: 0, dy: 0 };

function getJoystickRadius(el) { return el.getBoundingClientRect().width / 2; }
function getJoystickCenter(el) {
  const r = el.getBoundingClientRect();
  return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
}

function handleJoyStart(e, joyEl, stickEl, state) {
  const r = joyEl.getBoundingClientRect();
  for (const t of e.changedTouches) {
    if (t.clientX >= r.left - 40 && t.clientX <= r.right + 40 &&
        t.clientY >= r.top - 40 && t.clientY <= r.bottom + 40) {
      state.active = true;
      state.touchId = t.identifier;
      joyEl.classList.add('active');
      updateJoyFromTouch(t, joyEl, stickEl, state);
      e.preventDefault();
      return true;
    }
  }
  return false;
}
function updateJoyFromTouch(t, joyEl, stickEl, state) {
  if (t.identifier !== state.touchId) return;
  const { cx, cy } = getJoystickCenter(joyEl);
  const radius = getJoystickRadius(joyEl) - 30;
  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  const len = Math.hypot(dx, dy);
  if (len > radius) { dx = dx / len * radius; dy = dy / len * radius; }
  state.dx = dx / radius;
  state.dy = dy / radius;
  stickEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function handleJoyMove(e, joyEl, stickEl, state) {
  for (const t of e.changedTouches) {
    if (t.identifier === state.touchId) {
      updateJoyFromTouch(t, joyEl, stickEl, state);
      e.preventDefault();
      return;
    }
  }
}
function handleJoyEnd(e, joyEl, stickEl, state) {
  for (const t of e.changedTouches) {
    if (t.identifier === state.touchId) {
      state.active = false;
      state.touchId = null;
      state.dx = 0; state.dy = 0;
      joyEl.classList.remove('active');
      stickEl.style.transform = 'translate(-50%,-50%)';
      e.preventDefault();
      return;
    }
  }
}

// Gắn sự kiện touch cho joystick trái
joyMove.addEventListener('touchstart', (e) => {
  handleJoyStart(e, joyMove, joyMoveStick, joyMoveState);
}, { passive: false });
joyMove.addEventListener('touchmove', (e) => {
  handleJoyMove(e, joyMove, joyMoveStick, joyMoveState);
}, { passive: false });
joyMove.addEventListener('touchend', (e) => {
  handleJoyEnd(e, joyMove, joyMoveStick, joyMoveState);
}, { passive: false });
joyMove.addEventListener('touchcancel', (e) => {
  handleJoyEnd(e, joyMove, joyMoveStick, joyMoveState);
}, { passive: false });

// Gắn sự kiện touch cho joystick phải
joyShoot.addEventListener('touchstart', (e) => {
  handleJoyStart(e, joyShoot, joyShootStick, joyShootState);
}, { passive: false });
joyShoot.addEventListener('touchmove', (e) => {
  handleJoyMove(e, joyShoot, joyShootStick, joyShootState);
}, { passive: false });
joyShoot.addEventListener('touchend', (e) => {
  handleJoyEnd(e, joyShoot, joyShootStick, joyShootState);
}, { passive: false });
joyShoot.addEventListener('touchcancel', (e) => {
  handleJoyEnd(e, joyShoot, joyShootStick, joyShootState);
}, { passive: false });

// Hỗ trợ chuột kéo joystick (test trên PC)
[joyMove, joyShoot].forEach((joyEl, idx) => {
  const stickEl = idx === 0 ? joyMoveStick : joyShootStick;
  const state = idx === 0 ? joyMoveState : joyShootState;
  let mouseDownJoy = false;

  joyEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    mouseDownJoy = true;
    state.active = true;
    joyEl.classList.add('active');
    updateJoyFromMouse(e, joyEl, stickEl, state);
    e.preventDefault();
    e.stopPropagation();
  });
  addEventListener('mousemove', (e) => {
    if (mouseDownJoy) updateJoyFromMouse(e, joyEl, stickEl, state);
  });
  addEventListener('mouseup', () => {
    if (mouseDownJoy) {
      mouseDownJoy = false;
      state.active = false;
      state.dx = 0; state.dy = 0;
      joyEl.classList.remove('active');
      stickEl.style.transform = 'translate(-50%,-50%)';
    }
  });
});

function updateJoyFromMouse(e, joyEl, stickEl, state) {
  const { cx, cy } = getJoystickCenter(joyEl);
  const radius = getJoystickRadius(joyEl) - 30;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const len = Math.hypot(dx, dy);
  if (len > radius) { dx = dx / len * radius; dy = dy / len * radius; }
  state.dx = dx / radius;
  state.dy = dy / radius;
  stickEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

/* ============ GET INPUTS ============ */
function getInputs() {
  let mx = 0, my = 0, aim = 0, shoot = false;

  if (isTouchDevice) {
    // Di chuyển từ joystick trái
    if (joyMoveState.active &&
        (Math.abs(joyMoveState.dx) > 0.15 || Math.abs(joyMoveState.dy) > 0.15)) {
      mx = joyMoveState.dx;
      my = joyMoveState.dy;
      const len = Math.hypot(mx, my);
      if (len > 1) { mx /= len; my /= len; }
    }
    // Bắn từ joystick phải
    if (joyShootState.active) {
      const len = Math.hypot(joyShootState.dx, joyShootState.dy);
      if (len > 0.25) {
        aim = Math.atan2(joyShootState.dy, joyShootState.dx);
        shoot = true;
      } else if (len > 0.05) {
        aim = Math.atan2(joyShootState.dy, joyShootState.dx);
      }
    }
  } else {
    // PC: WASD + chuột
    if (keys['a'] || keys['arrowleft']) mx--;
    if (keys['d'] || keys['arrowright']) mx++;
    if (keys['w'] || keys['arrowup']) my--;
    if (keys['s'] || keys['arrowdown']) my++;
    aim = Math.atan2(mouse.y - innerHeight / 2, mouse.x - innerWidth / 2);
    shoot = mouse.down || keys[' '];
  }

  return { x: mx, y: my, aim, shoot };
}

setInterval(() => {
  if (isHost && state && state.players[myId] && !state.over) state.players[myId].input = getInputs();
}, 33);

/* ==========================================================
   11. RENDER
   ========================================================== */
const ctx = canvasEl.getContext('2d');
let W = innerWidth, H = innerHeight;
const DPR = Math.min(devicePixelRatio || 1, 2);
let cam = { x: 0, y: 0 };
function resize() {
  W = innerWidth; H = innerHeight;
  canvasEl.width = Math.floor(W * DPR); canvasEl.height = Math.floor(H * DPR);
  canvasEl.style.width = W + 'px'; canvasEl.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const CELL = 128;
function drawMap() {
  const left = cam.x - W / 2, top = cam.y - H / 2;
  ctx.fillStyle = '#0b1017';
  ctx.fillRect(left - 60, top - 60, W + 120, H + 120);

  const g = 64;
  const gx0 = Math.floor(left / g) * g, gx1 = left + W;
  const gy0 = Math.floor(top / g) * g,  gy1 = top + H;
  ctx.strokeStyle = 'rgba(60,130,100,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = gx0; x <= gx1; x += g) { ctx.moveTo(x, gy0); ctx.lineTo(x, gy1); }
  for (let y = gy0; y <= gy1; y += g) { ctx.moveTo(gx0, y); ctx.lineTo(gx1, y); }
  ctx.stroke();

  const cx0 = Math.floor(left / CELL) - 1;
  const cx1 = Math.floor((left + W) / CELL) + 1;
  const cy0 = Math.floor(top / CELL) - 1;
  const cy1 = Math.floor((top + H) / CELL) + 1;

  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const h = hash(cx, cy, 1);
      const n = h < 0.55 ? 0 : h < 0.85 ? 1 : 2;
      for (let kk = 0; kk < n; kk++) {
        const px = cx * CELL + hash(cx, cy, 10 + kk * 7) * CELL;
        const py = cy * CELL + hash(cx, cy, 20 + kk * 7) * CELL;
        const type = hash(cx, cy, 30 + kk * 7);
        if (type < 0.45) {
          const r = 6 + hash(cx, cy, 40 + kk * 7) * 10;
          ctx.beginPath();
          ctx.ellipse(px, py, r, r * 0.72, hash(cx, cy, 50 + kk * 7) * TAU, 0, TAU);
          ctx.fillStyle = 'rgba(45,62,72,0.85)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(90,120,120,0.28)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (type < 0.8) {
          ctx.strokeStyle = 'rgba(60,130,90,0.35)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let b = 0; b < 4; b++) {
            const a = -Math.PI / 2 + (hash(cx, cy, 60 + kk * 7 + b) - 0.5) * 1.3;
            const len = 8 + hash(cx, cy, 70 + kk * 7 + b) * 10;
            ctx.moveTo(px + (b - 1.5) * 3, py);
            ctx.lineTo(px + (b - 1.5) * 3 + Math.cos(a) * len, py + Math.sin(a) * len);
          }
          ctx.stroke();
        } else {
          const r = 14 + hash(cx, cy, 80 + kk * 7) * 22;
          ctx.beginPath();
          ctx.arc(px, py, r, 0, TAU);
          ctx.fillStyle = 'rgba(20,30,38,0.55)';
          ctx.fill();
        }
      }
    }
  }
}

function drawArena(arena) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,80,80,0.6)';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 12]);
  ctx.lineDashOffset = -performance.now() * 0.05;
  const hw = arena.w / 2, hh = arena.h / 2;
  ctx.strokeRect(-hw, -hh, arena.w, arena.h);
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,50,50,0.04)';
  ctx.fillRect(-hw, -hh, arena.w, arena.h);
  ctx.strokeStyle = 'rgba(255,80,80,0.2)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-hw + 20, -hh + 20, arena.w - 40, arena.h - 40);
  ctx.restore();
}

const PICKUP_COLORS = {
  health: '#2ee07a', laser: '#4dd9ff', bomb: '#ff5b6e',
  shield: '#ffd93d', speed: '#ff8c1a', pierce: '#b46bff',
  tripleshot: '#ff66b2',
  curse: '#8a1f35', slow: '#5a4a8a', burn: '#ff3a1a', confuse: '#8a1f8a',
  freeze: '#4dd9ff', jam: '#888888'
};
function drawPickup(k) {
  const pulse = 1 + Math.sin(k.bob) * 0.12;
  const col = PICKUP_COLORS[k.type] || k.color;
  const isBad = PU_BAD.includes(k.type);

  ctx.save();
  ctx.translate(k.x, k.y);
  ctx.globalAlpha = k.life < 3 ? (Math.floor(performance.now() * 0.01) % 2 ? 0.3 : 1) : 1;

  ctx.beginPath(); ctx.arc(0, 0, 22 * pulse, 0, TAU);
  ctx.fillStyle = hexA(col, isBad ? 0.25 : 0.16); ctx.fill();

  ctx.beginPath(); ctx.arc(0, 0, 16 * pulse, 0, TAU);
  ctx.fillStyle = '#0e1a22'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = isBad ? 3 : 2.5; ctx.stroke();

  if (isBad) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 19 * pulse, 0, TAU); ctx.stroke();
  }

  if (k.type === 'health') {
    ctx.fillStyle = col;
    ctx.fillRect(-6, -2, 12, 4);
    ctx.fillRect(-2, -6, 4, 12);
  } else if (k.type === 'laser') {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-2, -8); ctx.lineTo(5, -1); ctx.lineTo(1, -1);
    ctx.lineTo(3, 8);  ctx.lineTo(-5, 0); ctx.lineTo(-1, 0);
    ctx.closePath(); ctx.fill();
  } else if (k.type === 'bomb') {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 1, 6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a2a35'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(2, -5); ctx.quadraticCurveTo(7, -9, 4, -11); ctx.stroke();
    ctx.fillStyle = '#fff2a8';
    ctx.beginPath(); ctx.arc(4, -11, 1.8, 0, TAU); ctx.fill();
  } else if (k.type === 'shield') {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, -9); ctx.lineTo(7, -4); ctx.lineTo(7, 4);
    ctx.lineTo(0, 9); ctx.lineTo(-7, 4); ctx.lineTo(-7, -4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8a6d1a'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (k.type === 'speed') {
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-6, -5); ctx.lineTo(2, -5);
    ctx.moveTo(-6, 0);  ctx.lineTo(5, 0);
    ctx.moveTo(-6, 5);  ctx.lineTo(2, 5);
    ctx.stroke();
  } else if (k.type === 'pierce') {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, -9); ctx.lineTo(4, -1); ctx.lineTo(2, -1);
    ctx.lineTo(2, 9); ctx.lineTo(-2, 9); ctx.lineTo(-2, -1);
    ctx.lineTo(-4, -1); ctx.closePath(); ctx.fill();
  } else if (k.type === 'tripleshot') {
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, 8); ctx.lineTo(0, -6);
    ctx.moveTo(0, 0); ctx.lineTo(-6, -7);
    ctx.moveTo(0, 0); ctx.lineTo(6, -7);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, -7, 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-6, -7, 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -7, 2, 0, TAU); ctx.fill();
  } else if (k.type === 'curse') {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, -2, 7, Math.PI, 0); ctx.fill();
    ctx.fillRect(-7, -2, 14, 5);
    ctx.fillStyle = '#10151c';
    ctx.beginPath(); ctx.arc(-3, -1, 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -1, 2, 0, TAU); ctx.fill();
    ctx.fillRect(-1, 3, 2, 3);
  } else if (k.type === 'slow') {
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < 40; i++) {
      const a = i * 0.3, r = 1 + i * 0.18;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  } else if (k.type === 'burn') {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-7, 2, -5, -4, -2, -8);
    ctx.bezierCurveTo(-1, -3, 1, -4, 2, -8);
    ctx.bezierCurveTo(5, -4, 7, 2, 0, 8);
    ctx.fill();
    ctx.fillStyle = '#fff2a8';
    ctx.beginPath(); ctx.arc(0, 3, 2, 0, TAU); ctx.fill();
  } else if (k.type === 'confuse') {
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < 30; i++) {
      const a = i * 0.5, r = i * 0.28;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  } else if (k.type === 'freeze') {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * 8, Math.sin(a) * 8); ctx.stroke();
      const mx = Math.cos(a) * 5, my = Math.sin(a) * 5;
      for (const s of [-0.5, 0.5]) {
        ctx.beginPath(); ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(a + s) * 3, my + Math.sin(a + s) * 3); ctx.stroke();
      }
    }
  } else if (k.type === 'jam') {
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 2, 0, TAU); ctx.fillStyle = col; ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e, st) {
  const t = st.time;
  const p = Object.values(st.players).find(pp => pp.hp > 0) || st.players[myId];
  ctx.save();
  ctx.translate(e.x, e.y);
  const spawnScale = e.spawnAnim > 0 ? Math.max(0.05, 1 - e.spawnAnim / 0.8) : 1;
  ctx.scale(spawnScale, spawnScale);
  const flash = e.hitFlash > 0 ? 1 : 0;

  ctx.globalAlpha = 0.18;
  ctx.beginPath(); ctx.arc(0, 0, e.r * (e.isBoss ? 1.9 : 1.7), 0, TAU);
  ctx.fillStyle = e.color; ctx.fill();
  ctx.globalAlpha = 1;

  if (e.isBoss) {
    const n = 18;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + t * 0.55;
      const rad = e.r * (0.88 + 0.16 * Math.sin(t * 5 + e.seed + i * 1.4));
      const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.fill();
    ctx.strokeStyle = e.stroke; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.6, 0, TAU);
    ctx.fillStyle = flash ? '#ffffff' : e.stroke; ctx.fill();
    if (p) {
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      ctx.beginPath(); ctx.arc(ux * e.r * 0.22, uy * e.r * 0.22, e.r * 0.32, 0, TAU);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.beginPath(); ctx.arc(ux * e.r * 0.3, uy * e.r * 0.3, e.r * 0.15, 0, TAU);
      ctx.fillStyle = '#10151c'; ctx.fill();
    }
  } else {
    const n = 12;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      const rad = e.r * (0.86 + 0.14 * Math.sin(t * 7 + e.seed + i * 1.9));
      const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.fill();
    ctx.strokeStyle = e.stroke; ctx.lineWidth = 3; ctx.stroke();
    if (p) {
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      const px2 = -uy, py2 = ux;
      const off = e.r * 0.36;
      const fx = ux * e.r * 0.34, fy = uy * e.r * 0.34;
      const er = Math.max(3, e.r * 0.22);
      for (const s of [-1, 1]) {
        const ex = fx + px2 * off * s;
        const ey = fy + py2 * off * s;
        ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex + ux * er * 0.35, ey + uy * er * 0.35, er * 0.5, 0, TAU);
        ctx.fillStyle = '#10151c'; ctx.fill();
      }
    }
  }
  if (e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-w / 2, -e.r - 15, w, 5);
    ctx.fillStyle = '#ff5b6e';
    ctx.fillRect(-w / 2, -e.r - 15, w * Math.max(0, e.hp / e.maxHp), 5);
  }
  ctx.restore();
}

function drawPlayer(p, isMe, st) {
  if (p.hp <= 0) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU);
    ctx.fillStyle = '#333'; ctx.fill();
    ctx.restore();
    return;
  }
  const bodyCol = isMe ? '#5fbf7d' : '#6ba8ff';
  const stroke = isMe ? '#1e5233' : '#1e3a8a';

  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.levelUpFlash > 0) {
    ctx.save();
    ctx.globalAlpha = p.levelUpFlash;
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 40;
    ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 40 + (1 - p.levelUpFlash) * 40, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.curseFlash > 0) {
    ctx.save();
    ctx.globalAlpha = p.curseFlash * 0.6;
    ctx.strokeStyle = '#ff5b6e'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.powerups.freeze > 0) {
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.2 * Math.sin(performance.now() * 0.005);
    ctx.strokeStyle = '#4dd9ff'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  if (p.powerups.burn > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(performance.now() * 0.02);
    ctx.strokeStyle = '#ff3a1a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.powerups.confuse > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#8a1f8a'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a0 = performance.now() * 0.005 + i * TAU / 3;
      ctx.beginPath();
      ctx.arc(0, 0, 30 + i * 4, a0, a0 + 1.2);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (p.powerups.jam > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.powerups && p.powerups.shield > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.2 * Math.sin(performance.now() * 0.01);
    ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  const invulnBlink = p.pvpInvuln > 0 && Math.floor(performance.now() * 0.02) % 2 === 0;
  if (invulnBlink) ctx.globalAlpha = 0.5;

  ctx.save(); ctx.rotate(p.angle || 0);
  ctx.fillStyle = '#1c2530';
  ctx.fillRect(-18, -18, 36, 8);
  ctx.fillRect(-18, 10, 36, 8);
  ctx.restore();

  ctx.fillStyle = bodyCol;
  ctx.strokeStyle = stroke; ctx.lineWidth = 2;
  ctx.fillRect(-15, -12, 30, 24);
  ctx.strokeRect(-15, -12, 30, 24);

  ctx.save(); ctx.rotate(p.aim || 0);
  ctx.fillStyle = '#26473a'; ctx.fillRect(5, -4, 25, 8);
  ctx.fillStyle = bodyCol;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
  ctx.strokeStyle = stroke; ctx.stroke();
  ctx.restore();

  ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = isMe ? '#9df3c4' : '#8ecaff';
  ctx.fillText(p.name + (st.mode === 'pve' ? ' Lv' + (p.level||1) : ''), 0, -32);

  const w = 40;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(-w/2, -24, w, 4);
  const hpPct = Math.max(0, p.hp / (p.maxHp || 100));
  ctx.fillStyle = hpPct > 0.5 ? '#2ee07a' : hpPct > 0.25 ? '#ffd93d' : '#ff5b6e';
  ctx.fillRect(-w/2, -24, w * hpPct, 4);

  ctx.restore();
}

function drawBeams(st) {
  for (const bm of st.beams) {
    const a = bm.life / bm.maxLife;
    ctx.save();
    if (bm.bomb) {
      ctx.globalAlpha = a;
      const rr2 = bm.radius * (1 - a * 0.3);
      const grad = ctx.createRadialGradient(bm.x, bm.y, 0, bm.x, bm.y, rr2);
      grad.addColorStop(0, 'rgba(255, 200, 50, 0.8)');
      grad.addColorStop(0.5, 'rgba(255, 100, 30, 0.5)');
      grad.addColorStop(1, 'rgba(255, 50, 50, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(bm.x, bm.y, rr2, 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = a;
      ctx.translate(bm.x, bm.y);
      ctx.rotate(bm.angle);
      const grad = ctx.createLinearGradient(0, 0, 2000, 0);
      grad.addColorStop(0, 'rgba(120, 230, 255, 0.9)');
      grad.addColorStop(0.7, 'rgba(80, 180, 255, 0.5)');
      grad.addColorStop(1, 'rgba(80, 180, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, -3, 2000, 6);
      ctx.shadowColor = '#4dd9ff'; ctx.shadowBlur = 20;
      ctx.fillStyle = 'rgba(200, 240, 255, 0.9)';
      ctx.fillRect(0, -1.5, 2000, 3);
    }
    ctx.restore();
  }
}

function drawBullets(st) {
  ctx.lineCap = 'round';
  for (const b of st.bullets) {
    const isPvP = st.mode === 'pvp';
    const colorOuter = b.pierce ? 'rgba(180,107,255,0.45)' : (isPvP ? 'rgba(255,120,120,0.5)' : 'rgba(255,214,102,0.35)');
    const colorGlow  = b.pierce ? '#b46bff' : (isPvP ? '#ff5b6e' : '#ffe066');
    const colorCore  = b.pierce ? '#e0c6ff' : (isPvP ? '#ffb0b8' : '#fff8cc');
    ctx.strokeStyle = colorOuter;
    ctx.lineWidth = 6 * 1.6;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.022, b.y - b.vy * 0.022);
    ctx.stroke();
    ctx.save();
    ctx.shadowColor = colorGlow; ctx.shadowBlur = 16;
    ctx.fillStyle = colorCore;
    ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawEBullets(st) {
  for (const b of st.ebullets) {
    ctx.save();
    ctx.shadowColor = b.color; ctx.shadowBlur = 16;
    ctx.fillStyle = '#fff0f6';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawParticles(st) {
  for (const pa of st.particles) {
    ctx.globalAlpha = Math.max(0, pa.life / pa.maxLife);
    ctx.fillStyle = pa.color;
    ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGame(st, myId) {
  ctx.clearRect(0, 0, W, H);
  const me = st.players[myId];
  if (!me) return;
  let targetX = me.x, targetY = me.y;
  if (me.hp <= 0) {
    const alive = Object.values(st.players).find(p => p.hp > 0);
    if (alive) { targetX = alive.x; targetY = alive.y; }
  }
  cam.x += (targetX - cam.x) * 0.15;
  cam.y += (targetY - cam.y) * 0.15;

  let sx = 0, sy = 0;
  if (shakeTime > 0) {
    shakeTime -= 0.016;
    sx = (Math.random() - 0.5) * shakeIntensity;
    sy = (Math.random() - 0.5) * shakeIntensity;
  }
  ctx.save();
  ctx.translate(W / 2 - cam.x + sx, H / 2 - cam.y + sy);

  drawMap();
  if (st.arena) drawArena(st.arena);
  for (const k of st.pickups) drawPickup(k);
  drawBeams(st);
  for (const e of st.enemies) drawEnemy(e, st);
  drawBullets(st);
  drawEBullets(st);
  for (const id in st.players) drawPlayer(st.players[id], id === myId, st);
  drawParticles(st);

  ctx.restore();

  if (hitFlash > 0) {
    hitFlash -= 0.05;
    ctx.fillStyle = `rgba(255, 30, 30, ${hitFlash * 0.4})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (st.announce) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, st.announce.t);
    ctx.font = 'bold 52px system-ui,sans-serif';
    ctx.fillStyle = '#9df3c4';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#2ee07a'; ctx.shadowBlur = 30;
    ctx.fillText(st.announce.text, W / 2, H * 0.26);
    ctx.restore();
  }

  if (st.mode === 'pve') {
    const boss = st.enemies.find(e => e.isBoss);
    if (boss) {
      const w = Math.min(520, W - 80);
      const x = (W - w) / 2, y = 62;
      const g2 = ctx.createLinearGradient(x, 0, x + w, 0);
      g2.addColorStop(0, boss.color);
      g2.addColorStop(1, '#ffffff');
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      rr(x - 5, y - 5, w + 10, 30, 9); ctx.fill();
      ctx.fillStyle = '#1a1015';
      rr(x, y, w, 20, 6); ctx.fill();
      ctx.fillStyle = g2;
      rr(x, y, w * (boss.hp / boss.maxHp), 20, 6); ctx.fill();
      ctx.fillStyle = '#ffe4e6';
      ctx.font = 'bold 12px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS   ' + Math.ceil(boss.hp) + ' / ' + Math.ceil(boss.maxHp), W / 2, y + 14);
    }
  }
}

})();
</script>
</body>
</html>
