<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tank Arena</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#080c11;
    font-family:system-ui,"Segoe UI",Arial,sans-serif;user-select:none;color:#dff5e8;
    overscroll-behavior:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair;touch-action:none}
  .hidden{display:none !important}
  .screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px;
    background:radial-gradient(circle at 50% 40%,#0e1e26,#05080c 70%);
    overflow-y:auto;text-align:center}
  .screen h1{font-size:clamp(30px,6vw,52px);letter-spacing:6px;color:#9df3c4;
    text-shadow:0 0 40px #2ee07a66;margin-bottom:6px}
  .panel{background:#0a141a;border:2px solid #1e3a30;border-radius:14px;
    padding:20px;display:flex;flex-direction:column;gap:12px;width:min(360px,92vw)}
  .panel input{padding:12px 14px;border-radius:10px;background:#0e1a20;
    border:2px solid #26485a;color:#dff5e8;font-size:16px;outline:none;
    font-family:inherit;text-align:center;letter-spacing:2px}
  .panel input:focus{border-color:#2ee07a}
  .panel button{padding:13px;border-radius:10px;background:#12463a;
    color:#9df3c4;border:2px solid #2ee07a;font-size:14px;font-weight:800;
    letter-spacing:2px;cursor:pointer;transition:.15s}
  .panel button:hover{background:#2ee07a;color:#04140c;transform:scale(1.02)}
  #nameMsg{font-size:13px;text-align:center;min-height:20px;letter-spacing:1px;color:#ff8a9a}
  .menu-stats{display:flex;flex-direction:column;gap:5px;padding:14px 22px;border-radius:12px;
    background:#0a141a;border:2px solid #1e3a30;font-size:13px;letter-spacing:1px;
    min-width:min(340px,92vw);text-align:center}
  .menu-stats b{color:#9df3c4;font-size:16px}
  .hint{font-size:12px;color:#6ea8a0;letter-spacing:1px;line-height:1.7;max-width:400px}
  .btn-pve{padding:16px 24px;border-radius:12px;background:#0e2a1e;
    color:#9df3c4;border:2px solid #2ee07a;font-size:15px;font-weight:800;
    letter-spacing:2px;cursor:pointer;transition:.15s;width:min(340px,92vw);
    box-shadow:0 0 20px #2ee07a22}
  .btn-pve:hover{background:#2ee07a;color:#04140c;transform:scale(1.03);
    box-shadow:0 0 30px #2ee07a88}
  .mode-divider{font-size:13px;color:#ff8a9a;font-weight:800;letter-spacing:2px;
    margin-top:8px;margin-bottom:2px}
  .diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;
    width:min(340px,92vw)}
  .btn-diff{padding:14px 8px;border-radius:10px;font-size:13px;font-weight:800;
    letter-spacing:1px;cursor:pointer;transition:.15s;border:2px solid}
  .btn-diff:hover{transform:scale(1.04)}
  .btn-diff.easy{background:#12463a;border-color:#2ee07a;color:#9df3c4}
  .btn-diff.easy:hover{background:#2ee07a;color:#04140c}
  .btn-diff.normal{background:#0d3a44;border-color:#4dd9ff;color:#9df3f4}
  .btn-diff.normal:hover{background:#4dd9ff;color:#04141a}
  .btn-diff.hard{background:#3a2a10;border-color:#ff8c1a;color:#ffd93d}
  .btn-diff.hard:hover{background:#ff8c1a;color:#1a0e00}
  .btn-diff.insane{background:#3a1020;border-color:#ff5b6e;color:#ff8a9a}
  .btn-diff.insane:hover{background:#ff5b6e;color:#1a0410}
  .btn-change-name{padding:8px 16px;border-radius:8px;background:#0e1a20;
    color:#7a9a92;border:2px solid #26485a;font-size:11px;font-weight:800;
    letter-spacing:2px;cursor:pointer;transition:.15s;margin-top:6px}
  .btn-change-name:hover{background:#12463a;color:#9df3c4;border-color:#2ee07a}

  #hud{position:fixed;inset:0;pointer-events:none;padding:18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    text-shadow:0 2px 8px #000;font-weight:700}
  #hudLeft{display:flex;flex-direction:column;gap:6px}
  .hpbar{width:min(240px,45vw);height:18px;border-radius:9px;background:#101c24;
    border:2px solid #26485a;overflow:hidden;position:relative;
    transition:border-color 0.2s;box-shadow:0 0 18px #0af3}
  .hpbar.hurt{border-color:#ff5b6e;box-shadow:0 0 15px #ff5b6e88}
  .hpFill{height:100%;width:100%;border-radius:7px;position:absolute;top:0;left:0;
    background:linear-gradient(90deg,#2ee07a,#9df3c4);transition:width .1s;z-index:2}
  .hpFill.p2{background:linear-gradient(90deg,#3a8fe0,#9dd8ff)}
  .shieldFill{position:absolute;top:0;left:0;height:100%;width:0%;
    background:linear-gradient(90deg,#ffd93d,#fff2a8);
    border-radius:7px;transition:width .15s;z-index:3;opacity:.85;
    box-shadow:0 0 10px #ffd93d}
  .hpText{font-size:12px;margin-top:3px;opacity:.85}
  .xpbar{width:min(240px,45vw);height:8px;border-radius:4px;background:#101c24;
    border:1px solid #26485a;overflow:hidden;margin-top:4px}
  .xpFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd93d,#ff8c1a);transition:width .2s}
  .lvlText{font-size:11px;margin-top:2px;color:#ffd93d;letter-spacing:1px}
  #scoreBox{text-align:right;font-size:12px;letter-spacing:2px;line-height:1.8;opacity:.9}
  #scoreBox b{font-size:22px;color:#9df3c4;display:block}
  #modeTag{color:#ff8a9a;font-size:14px;letter-spacing:2px;display:block;
    margin-bottom:8px;font-weight:800}
  #btnMenu{pointer-events:auto;cursor:pointer;margin-top:10px;padding:8px 16px;
    border-radius:8px;background:#0e1a20;color:#cfe9d8;border:2px solid #26485a;
    font-size:11px;font-weight:800;letter-spacing:2px}
  #btnMenu:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}
  #powerupHud{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    pointer-events:none;z-index:30;max-width:60vw}
  .pu-badge{padding:7px 12px;border-radius:10px;background:#0a141a;
    border:2px solid #ffd93d;font-size:11px;font-weight:800;letter-spacing:1px;
    color:#ffd93d;text-shadow:0 0 10px #ffd93d;animation:pulse 1s infinite}
  .pu-badge.bad{border-color:#ff5b6e;color:#ff5b6e;text-shadow:0 0 10px #ff5b6e}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle,#0d1a20cc,#000000f2);backdrop-filter:blur(4px);z-index:40}
  #overlay h1{font-size:clamp(36px,9vw,72px);letter-spacing:6px;color:#ff5b6e;
    text-shadow:0 0 30px #ff5b6e88}
  #overlay p{font-size:18px;letter-spacing:2px;opacity:.85;text-align:center}
  #overlay p b{color:#9df3c4;font-size:26px}
  .ov-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .ov-btns button{padding:14px 30px;border-radius:12px;font-size:15px;font-weight:800;
    letter-spacing:2px;transition:.15s;cursor:pointer;border:2px solid}
  #btnRestart{border-color:#2ee07a;background:#0e2a1e;color:#9df3c4}
  #btnRestart:hover{background:#2ee07a;color:#04140c;transform:scale(1.03)}
  #btnToMenu{border-color:#26485a;background:#0e1a20;color:#cfe9d8}
  #btnToMenu:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}

  #touchControls{position:fixed;inset:0;pointer-events:none;z-index:25}
  .joystick{
    position:absolute;width:140px;height:140px;border-radius:50%;
    background:rgba(46,224,122,0.10);border:2px solid rgba(46,224,122,0.55);
    bottom:30px;pointer-events:auto;touch-action:none;
    box-shadow:inset 0 0 30px rgba(46,224,122,0.15),0 0 20px rgba(46,224,122,0.2);
    cursor:grab;
  }
  .joystick:active{cursor:grabbing}
  #joyLeft{left:30px}
  #joyRight{
    right:30px;
    background:rgba(255,91,110,0.10);border-color:rgba(255,91,110,0.55);
    box-shadow:inset 0 0 30px rgba(255,91,110,0.15),0 0 20px rgba(255,91,110,0.2);
  }
  .knob{
    position:absolute;width:64px;height:64px;border-radius:50%;
    background:rgba(46,224,122,0.75);border:2px solid #2ee07a;
    top:50%;left:50%;transform:translate(-50%,-50%);
    pointer-events:none;box-shadow:0 0 25px #2ee07a88;
    will-change:transform;
  }
  #joyRight .knob{background:rgba(255,91,110,0.75);border-color:#ff5b6e;
    box-shadow:0 0 25px #ff5b6e88}
</style>
</head>
<body>

<!-- Màn hình nhập tên -->
<div id="nameScreen" class="screen">
  <h1>TANK ARENA</h1>
  <div class="panel">
    <input id="inputName" placeholder="Nhập tên của bạn" maxlength="20">
    <button id="btnEnterGame">VÀO GAME</button>
    <div id="nameMsg"></div>
  </div>
  <div class="hint">Tên được lưu lại cho lần chơi sau. Không cần tài khoản.</div>
</div>

<!-- Menu -->
<div id="menuScreen" class="screen hidden">
  <h1>TANK ARENA</h1>
  <div class="menu-stats">
    <div>Xin chào, <b id="menuUsername">Player</b></div>
    <div>🏆 Kỷ lục PvE: <b id="menuHighScore">0</b></div>
    <div>⚔️ Thắng bot: <b id="menuBotWins">0</b></div>
  </div>
  <button id="btnPvE" class="btn-pve">🎯 CÀY CẤP - ĐÁNH QUÁI</button>
  <div class="mode-divider">— HOẶC —</div>
  <div class="mode-divider" style="color:#9df3c4">🤖 ĐẤU BOT</div>
  <div class="diff-grid">
    <button id="btnEasy" class="btn-diff easy">😊 DỄ</button>
    <button id="btnNormal" class="btn-diff normal">😐 BÌNH THƯỜNG</button>
    <button id="btnHard" class="btn-diff hard">😠 KHÁ</button>
    <button id="btnInsane" class="btn-diff insane">💀 SIÊU KHÓ</button>
  </div>
  <button id="btnChangeName" class="btn-change-name">✏️ ĐỔI TÊN</button>
</div>

<canvas id="game" class="hidden"></canvas>
<div id="hud" class="hidden">
  <div id="hudLeft">
    <div class="hpbar" id="hpBarP1">
      <div class="hpFill" id="hpFillP1"></div>
      <div class="shieldFill" id="shieldFillP1"></div>
    </div>
    <div class="hpText" id="hpTextP1">100 / 100</div>
    <div class="xpbar" id="xpBarWrapP1"><div class="xpFill" id="xpFillP1"></div></div>
    <div class="lvlText" id="lvlWrapP1">LV <span id="lvlValP1">1</span> • XP <span id="xpValP1">0</span>/<span id="xpNeedP1">5</span></div>
    <div id="p2Hud" class="hidden">
      <div class="hpbar" id="hpBarP2" style="margin-top:10px;border-color:#3a8fe0">
        <div class="hpFill p2" id="hpFillP2"></div>
      </div>
      <div class="hpText" id="hpTextP2">BOT · 100 / 100</div>
    </div>
  </div>
  <div id="scoreBox">
    <span id="modeTag"></span>
    ĐIỂM<b id="scoreVal">0</b>
    MÀN<b id="waveVal">1</b>
    <button id="btnMenu">☰ MENU</button>
  </div>
</div>
<div id="powerupHud" class="hidden"></div>

<div id="touchControls" class="hidden">
  <div id="joyLeft" class="joystick"><div class="knob" id="knobLeft"></div></div>
  <div id="joyRight" class="joystick"><div class="knob" id="knobRight"></div></div>
</div>

<div id="overlay" class="hidden">
  <h1 id="ovTitle">GAME OVER</h1>
  <p id="ovP1"></p>
  <p id="ovP2" style="font-size:14px;opacity:.75"></p>
  <div class="ov-btns">
    <button id="btnRestart">CHƠI LẠI</button>
    <button id="btnToMenu">VỀ MENU</button>
  </div>
</div>

<script>
(function(){
'use strict';

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
const TAU = Math.PI * 2;

function hash(ix, iy, seed) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) +
           Math.imul(seed, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function rr(x, y, w, h, r) {
  w = Math.max(w, 1); h = Math.max(h, 1);
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ============ ÂM THANH ============ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  if (!audioCtx || typeof type !== 'string') return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  const map = {
    shoot:  {t:'square', f1:400, f2:100, g:0.05, d:0.1},
    hit:    {t:'sawtooth', f1:200, f2:50, g:0.1, d:0.1},
    hurt:   {t:'triangle', f1:100, f2:30, g:0.2, d:0.2},
    pickup: {t:'sine', f1:600, f2:1200, g:0.1, d:0.2},
    levelup:{t:'square', f1:400, f2:1600, g:0.15, d:0.4},
    boom:   {t:'sawtooth', f1:80, f2:20, g:0.3, d:0.5},
    laser:  {t:'sawtooth', f1:1200, f2:200, g:0.12, d:0.3},
    curse:  {t:'sawtooth', f1:180, f2:60, g:0.18, d:0.35},
    win:    {t:'square', f1:800, f2:200, g:0.25, d:0.7},
    lose:   {t:'sawtooth', f1:200, f2:40, g:0.25, d:0.8},
  };
  const m = map[type]; if (!m) { osc.disconnect(); gain.disconnect(); return; }
  osc.type = m.t; osc.frequency.setValueAtTime(m.f1, now);
  osc.frequency.exponentialRampToValueAtTime(m.f2, now+m.d);
  gain.gain.setValueAtTime(m.g, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now+m.d);
  osc.start(now); osc.stop(now+m.d);
}
let shakeTime = 0, shakeIntensity = 0, hitFlash = 0;
function triggerHitEffect() {
  shakeTime = 0.3; shakeIntensity = 15; hitFlash = 1;
  const bar = document.getElementById('hpBarP1');
  if (bar) { bar.classList.add('hurt'); setTimeout(() => bar.classList.remove('hurt'), 200); }
}

/* ============ LƯU TÊN + ĐIỂM ============ */
const NAME_KEY = 'tankArenaPlayerName';
const SCORES_KEY = 'tankArenaScores';
function getScores() { try { return JSON.parse(localStorage.getItem(SCORES_KEY) || '{}'); } catch { return {}; } }
function saveScores(a) { localStorage.setItem(SCORES_KEY, JSON.stringify(a)); }
function getPlayerData(name) {
  const s = getScores();
  return s[name] || { highScore: 0, botWins: 0 };
}
function ensurePlayerData(name) {
  const s = getScores();
  if (!s[name]) { s[name] = { highScore: 0, botWins: 0 }; saveScores(s); }
}
function recordPvEScore(score) {
  const s = getScores();
  if (!s[currentUser]) s[currentUser] = { highScore: 0, botWins: 0 };
  if (score > (s[currentUser].highScore || 0)) { s[currentUser].highScore = score; saveScores(s); }
}
function recordBotWin() {
  const s = getScores();
  if (!s[currentUser]) s[currentUser] = { highScore: 0, botWins: 0 };
  s[currentUser].botWins = (s[currentUser].botWins || 0) + 1;
  saveScores(s);
}
let currentUser = localStorage.getItem(NAME_KEY);

/* ============ UI ============ */
const screens = {
  name: document.getElementById('nameScreen'),
  menu: document.getElementById('menuScreen')
};
const canvasEl = document.getElementById('game');
const hudEl = document.getElementById('hud');
const puHudEl = document.getElementById('powerupHud');
const touchControlsEl = document.getElementById('touchControls');

function show(name) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  canvasEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  puHudEl.classList.add('hidden');
  touchControlsEl.classList.add('hidden');
  if (name === 'game') {
    canvasEl.classList.remove('hidden');
    hudEl.classList.remove('hidden');
    puHudEl.classList.remove('hidden');
    touchControlsEl.classList.remove('hidden');
  } else if (screens[name]) screens[name].classList.remove('hidden');
}

function showMenu() {
  if (!currentUser) { show('name'); return; }
  show('menu');
  document.getElementById('menuUsername').textContent = currentUser;
  const data = getPlayerData(currentUser);
  document.getElementById('menuHighScore').textContent = (data.highScore || 0) + ' điểm';
  document.getElementById('menuBotWins').textContent = (data.botWins || 0) + ' trận';
}

function showNameScreen() {
  show('name');
  const inp = document.getElementById('inputName');
  inp.value = currentUser || '';
  document.getElementById('nameMsg').textContent = '';
  setTimeout(() => inp.focus(), 100);
}

if (currentUser) showMenu(); else showNameScreen();

/* Nhập tên → vào game */
const inputName = document.getElementById('inputName');
const btnEnter = document.getElementById('btnEnterGame');
const nameMsg = document.getElementById('nameMsg');

function submitName() {
  initAudio();
  const u = inputName.value.trim();
  nameMsg.style.color = '#ff8a9a';
  if (u.length < 1) { nameMsg.textContent = 'Vui lòng nhập tên'; return; }
  if (u.length > 20) { nameMsg.textContent = 'Tên tối đa 20 ký tự'; return; }
  currentUser = u;
  localStorage.setItem(NAME_KEY, u);
  ensurePlayerData(u);
  showMenu();
}
btnEnter.onclick = submitName;
inputName.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitName();
});

/* Đổi tên */
document.getElementById('btnChangeName').onclick = () => {
  showNameScreen();
};

/* ============ JOYSTICK: PC (chuột) + Mobile (touch) ============ */
const touch = {
  moveX: 0, moveY: 0,
  aimX: 0, aimY: 0,
  shooting: false,
  moveActive: false,
  aimActive: false
};

function setupJoystick(el, knob, onMove, onEnd) {
  const maxR = 50;
  let activePointer = null;
  let usingMouse = false;

  const getClient = (e) => {
    if (e.touches) {
      for (const t of e.touches) if (t.identifier === activePointer) return t;
      return null;
    }
    return { clientX: e.clientX, clientY: e.clientY };
  };

  const start = (e) => {
    if (activePointer !== null) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.touches) {
      const t = e.touches[0];
      activePointer = t.identifier;
      usingMouse = false;
    } else {
      activePointer = 'mouse';
      usingMouse = true;
      document.body.style.cursor = 'grabbing';
    }
    move(e);
  };

  const move = (e) => {
    if (activePointer === null) return;
    const t = getClient(e);
    if (!t) return;
    e.preventDefault();
    e.stopPropagation();
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    onMove(dx / maxR, dy / maxR);
  };

  const end = (e) => {
    if (activePointer === null) return;
    if (e) e.stopPropagation();
    activePointer = null;
    if (usingMouse) document.body.style.cursor = '';
    usingMouse = false;
    knob.style.transform = 'translate(-50%,-50%)';
    onEnd();
  };

  el.addEventListener('touchstart', start, {passive: false});
  el.addEventListener('touchmove', move, {passive: false});
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);

  el.addEventListener('mousedown', start);
  window.addEventListener('mousemove', (e) => {
    if (usingMouse && activePointer === 'mouse') move(e);
  });
  window.addEventListener('mouseup', (e) => {
    if (usingMouse && activePointer === 'mouse') end(e);
  });

  el.addEventListener('dragstart', e => e.preventDefault());
  el.addEventListener('contextmenu', e => e.preventDefault());
}

setupJoystick(
  document.getElementById('joyLeft'),
  document.getElementById('knobLeft'),
  (x, y) => { touch.moveX = x; touch.moveY = y; touch.moveActive = true; },

/* ============ STATE ============ */
let state = null, lastTime = performance.now();
const myId = 'PLAYER';

function xpNeeded(lvl) { return 5 + (lvl - 1) * 3; }

function makePlayer(id, name) {
  return {
    id, name, x: 0, y: 0,
    hp: 100, maxHp: 100, score: 0,
    angle: -Math.PI/2, aim: 0,
    input: {x:0, y:0, aim:0, shoot:false},
    level: 1, xp: 0,
    fireRate: 180, damage: 14, bulletSpeed: 1000,
    powerups: { laser:0, bomb:0, shield:0, speed:0, pierce:0, tripleshot:0, curse:0, slow:0, burn:0, confuse:0, freeze:0, jam:0 },
    shieldHp: 0, burnTick: 0, lastShoot: 0,
    levelUpFlash: 0, curseFlash: 0, pvpInvuln: 0,
    isBot: false, difficulty: null,
    _prevX: 0, _prevY: 0,
    smoothX: 0, smoothY: 0
  };
}
function makeBot(difficulty) {
  const cfg = BOT_CFG[difficulty];
  const b = makePlayer('BOT', cfg.name);
  b.isBot = true;
  b.difficulty = difficulty;
  b.hp = cfg.hp;
  b.maxHp = cfg.hp;
  b.fireRate = cfg.fireRate;
  b.damage = cfg.damage;
  return b;
}

function initGame(mode, difficulty) {
  state = {
    mode, difficulty,
    time: 0, wave: 1, spawnTimer: 1, bossIndex: 0, over: false,
    bossSpawnedWave: 0,
    players: { [myId]: makePlayer(myId, currentUser) },
    enemies: [], bullets: [], ebullets: [], pickups: [],
    particles: [], beams: [], events: [],
    arena: mode === 'bot' ? { w: 1400, h: 1400 } : null,
    pickupTimer: 2.5,
    announce: null, winner: null
  };

  if (mode === 'bot') {
    state.players['BOT'] = makeBot(difficulty);
    
    // BUFF NHẸ CHO PLAYER KHI ĐẤU BOT
    state.players[myId].fireRate = 130; 
    state.players[myId].bulletSpeed = 1300;
    
    state.players[myId].x = -350;
    state.players['BOT'].x = 350;
    state.announce = { text: 'VS ' + BOT_CFG[difficulty].name, t: 2.5 };
    document.getElementById('modeTag').textContent = '⚔️ ' + DIFF_NAME[difficulty].toUpperCase();
    document.getElementById('modeTag').style.color = BOT_CFG[difficulty].color;
    document.getElementById('xpBarWrapP1').style.display = 'none';
    document.getElementById('lvlWrapP1').style.display = 'none';

    document.getElementById('xpBarWrapP1').style.display = '';
    document.getElementById('lvlWrapP1').style.display = '';
    document.getElementById('p2Hud').classList.add('hidden');
  }
}

function startGame(mode, difficulty) {
  initAudio();
  hideOverlay();
  shakeTime = 0; shakeIntensity = 0; hitFlash = 0;
  state = null;
  initGame(mode, difficulty);
  show('game');
  lastTime = performance.now();

function updateHUD(st) {
  if (!st) return;

  if (me) {
    const maxHp = me.maxHp || 100;
    const hpPct = Math.max(0, Math.min(100, (me.hp / maxHp) * 100));
    const shieldPct = (me.powerups.shield > 0)
      ? Math.max(0, Math.min(100, ((me.shieldHp || 0) / maxHp) * 100)) : 0;
    document.getElementById('hpFillP1').style.width = hpPct + '%';
    document.getElementById('shieldFillP1').style.width = shieldPct + '%';
    const shieldTxt = (me.powerups.shield > 0) ? '  🛡' + Math.round(me.shieldHp || 0) : '';
    document.getElementById('hpTextP1').textContent =
      Math.max(0, Math.round(me.hp)) + ' / ' + Math.round(maxHp) + shieldTxt;
    document.getElementById('scoreVal').textContent = me.score;
    document.getElementById('waveVal').textContent = st.mode === 'bot' ? '-' : st.wave;
    if (st.mode === 'pve') {
      document.getElementById('lvlValP1').textContent = me.level || 1;
      document.getElementById('xpValP1').textContent = Math.floor(me.xp || 0);
      document.getElementById('xpNeedP1').textContent = xpNeeded(me.level || 1);
      document.getElementById('xpFillP1').style.width =
        Math.min(100, ((me.xp || 0) / xpNeeded(me.level || 1)) * 100) + '%';
    }
  }
  if (st.mode === 'bot') {
    const bot = st.players['BOT'];
    if (bot) {
      const maxHp = bot.maxHp || 100;
      document.getElementById('hpFillP2').style.width =

function pickPUType() {
  const total = POWERUPS.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for (const p of POWERUPS) { r -= p.weight; if (r <= 0) return p.type; }
  return 'health';
}
function spawnPowerup(x, y) {
  if (!state) return;
  const type = pickPUType();
  const def = POWERUPS.find(p=>p.type===type) || POWERUPS[0];
  state.pickups.push({ x, y, type, color: def.color, bad: def.bad, life: 18, bob: Math.random()*Math.PI*2 });
}
function applyPickup(p, k) {
  switch (k.type) {
    case 'health': p.hp = Math.min(p.maxHp, p.hp + 40); break;
    case 'laser': p.powerups.laser = Math.min(15, p.powerups.laser + 8); break;
    case 'bomb': p.powerups.bomb = Math.min(15, p.powerups.bomb + 8); break;
    case 'shield': p.powerups.shield = Math.min(15, p.powerups.shield + 8); p.shieldHp = 40; break;
    case 'speed': p.powerups.speed = Math.min(15, p.powerups.speed + 8); break;
    case 'pierce': p.powerups.pierce = Math.min(15, p.powerups.pierce + 8); break;
    case 'tripleshot': p.powerups.tripleshot = Math.min(15, p.powerups.tripleshot + 8); break;
    case 'curse': p.powerups.curse = Math.min(15, p.powerups.curse + 10); break;
    case 'slow': p.powerups.slow = Math.min(15, p.powerups.slow + 8); break;
    case 'burn': p.powerups.burn = Math.min(15, p.powerups.burn + 6); break;
    case 'confuse': p.powerups.confuse = Math.min(15, p.powerups.confuse + 5); break;
    case 'freeze': p.powerups.freeze = Math.min(15, p.powerups.freeze + 6); break;
    case 'jam': p.powerups.jam = Math.min(15, p.powerups.jam + 7); break;
  }
  if (!state) return;
  state.events.push('pickup');
  spawnParticles(k.x, k.y, k.color, 15, 250);
  if (PU_BAD.includes(k.type)) { p.curseFlash = 1; state.events.push('curse'); }
}

/* ============ PARTICLES ============ */
function spawnParticles(x, y, color, count, speed) {
  if (!state) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU;
    const s = speed * (0.3 + Math.random() * 0.7);
    state.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.4 + Math.random()*0.4, maxLife: 0.8, color, r: 2 + Math.random()*3 });
  }
}
function spawnLaser(x, y, angle, ownerId) {
  if (!state) return;
  state.beams.push({ x, y, angle, life: 0.15, maxLife: 0.15, owner: ownerId });
  const len = 2000;
  for (const e of state.enemies) {
    const dx = e.x - x, dy = e.y - y;
    const proj = dx * Math.cos(angle) + dy * Math.sin(angle);
    if (proj < 0 || proj > len) continue;
    const perp = Math.abs(-dx * Math.sin(angle) + dy * Math.cos(angle));
    if (perp < e.r + 8) {
      e.hp -= 50; e.hitFlash = 0.15;
      spawnParticles(e.x, e.y, e.color, 5, 150);
      if (e.hp <= 0) killEnemy(e, ownerId);
    }
  }
  for (const pid in state.players) {
    if (pid === ownerId) continue;
    const p = state.players[pid];
    if (p.hp <= 0 || p.pvpInvuln > 0) continue;
    const dx = p.x - x, dy = p.y - y;
    const proj = dx * Math.cos(angle) + dy * Math.sin(angle);
    if (proj < 0 || proj > len) continue;
    const perp = Math.abs(-dx * Math.sin(angle) + dy * Math.cos(angle));
    if (perp < 22) {
      if (p.powerups.shield > 0) {
        if (!p.shieldHp) p.shieldHp = 40;
        p.shieldHp -= 30;
        if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
        spawnParticles(p.x, p.y, '#ffd93d', 6, 150);
      } else {
        p.hp -= 30; p.pvpInvuln = 0.3;
        spawnParticles(p.x, p.y, '#4dd9ff', 8, 200);
      }
      state.events.push({ type: 'hurt', target: pid });
    }
  }
}
function explodeBomb(x, y, ownerId) {
  if (!state) return;
  const R = 200;
  state.beams.push({ x, y, angle: 0, life: 0.4, maxLife: 0.4, owner: ownerId, bomb: true, radius: R });
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    if (dist(x, y, e.x, e.y) < R + e.r) {
      e.hp -= 100; e.hitFlash = 0.2;
      spawnParticles(e.x, e.y, '#ff5b6e', 8, 200);
      if (e.hp <= 0) killEnemy(e, ownerId);
    }
  }
  for (const pid in state.players) {
    if (pid === ownerId) continue;
    const p = state.players[pid];
    if (p.hp <= 0 || p.pvpInvuln > 0) continue;
    if (dist(x, y, p.x, p.y) < R + 20) {
      if (p.powerups.shield > 0) {
        if (!p.shieldHp) p.shieldHp = 40;
        p.shieldHp -= 55;
        if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
      } else { p.hp -= 55; p.pvpInvuln = 0.3; }
      spawnParticles(p.x, p.y, '#ff5b6e', 12, 250);
      state.events.push({ type: 'hurt', target: pid });
    }
  }
  spawnParticles(x, y, '#ff8c1a', 40, 400);
  playSound('boom');
}

const TYPES = [
  { behavior: 'chase',    hp: 22,  speed: 96, r: 15, dmg: 8,  score: 10, color: '#7bd66b', stroke: '#3d8a35', xp: 1 },
  { behavior: 'chase',    hp: 52,  speed: 72, r: 23, dmg: 15, score: 25, color: '#e8a13a', stroke: '#a86a15', xp: 2 },
  { behavior: 'chase',    hp: 135, speed: 48, r: 33, dmg: 27, score: 60, color: '#d9506a', stroke: '#8b2a3c', xp: 4 },
  { behavior: 'shoot',    hp: 40,  speed: 60, r: 18, dmg: 12, score: 35, color: '#b46bff', stroke: '#6a2f9e', xp: 2 },
  { behavior: 'zigzag',   hp: 30,  speed: 120, r: 16, dmg: 10, score: 20, color: '#4dd9ff', stroke: '#1b4a5e', xp: 2 },
  { behavior: 'splitter', hp: 80,  speed: 55, r: 26, dmg: 18, score: 45, color: '#ff66b2', stroke: '#8a1f4d', xp: 3 }
];

function spawnEnemy() {
  if (!state) return;
  if (state.enemies.length > 100) return;
  const margin = 100;
  const maxW = innerWidth / 2 + margin, maxH = innerHeight / 2 + margin;
  let spawnX, spawnY;
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { spawnX = (Math.random() * 2 - 1) * maxW; spawnY = -maxH; }
  else if (side === 1) { spawnX = maxW; spawnY = (Math.random() * 2 - 1) * maxH; }
  else if (side === 2) { spawnX = (Math.random() * 2 - 1) * maxW; spawnY = maxH; }
  else { spawnX = -maxW; spawnY = (Math.random() * 2 - 1) * maxH; }

  let avgX = 0, avgY = 0, count = 0;
  for (const id in state.players) {
    if (state.players[id].hp > 0) { avgX += state.players[id].x; avgY += state.players[id].y; count++; }
  }
  if (count > 0) { avgX /= count; avgY /= count; }

  let available = [0, 1, 2];
  if (state.wave >= 2) available.push(4);
  if (state.wave >= 3) available.push(3);
  if (state.wave >= 4) available.push(5);
  let idx = available[Math.floor(Math.random() * available.length)];
  if (Math.random() < 0.1 + state.wave * 0.02) idx = 2;
  const t = TYPES[idx];
  const hpScale = 1 + (state.wave - 1) * 0.1;

  state.enemies.push({
    x: avgX + spawnX, y: avgY + spawnY,
    behavior: t.behavior, hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed * (1 + state.wave * 0.02), r: t.r, dmg: t.dmg,
    score: t.score, xp: t.xp, color: t.color, stroke: t.stroke,
    angle: 0, hitFlash: 0, seed: Math.random() * 10,
    isBig: idx === 2, isBoss: false, atkCd: rand(1,3),
    spawnAnim: 0.4, wobble: Math.random()*100
  });
}
function spawnBoss() {
  if (!state) return;
  const type = state.bossIndex % 6; state.bossIndex++;
  // TĂNG MẠNH HP VÀ SÁT THƯƠNG CỦA BOSS
  const stats = [
    { hp: 1800, speed: 70, r: 48, color: '#b46bff', stroke: '#6a2f9e', xp: 30 },
    { hp: 1400, speed: 85, r: 46, color: '#ff4d6d', stroke: '#8a1f35', xp: 30 },
    { hp: 1100, speed: 100, r: 44, color: '#ff8c1a', stroke: '#a04d00', xp: 30 },
    { hp: 1500, speed: 60, r: 46, color: '#1ac4c4', stroke: '#0a7272', xp: 30 },
    { hp: 1300, speed: 90, r: 45, color: '#e0e0e0', stroke: '#555', xp: 30 },
    { hp: 1700, speed: 45, r: 50, color: '#ffd93d', stroke: '#8a6d1a', xp: 30 }
  ];
  const s = stats[type];
  let avgX = 0, avgY = 0, count = 0;
  for (const id in state.players) { avgX += state.players[id].x; avgY += state.players[id].y; count++; }
  if (count > 0) { avgX /= count; avgY /= count; }
  state.enemies.push({
    x: avgX + 700, y: avgY, 
    hp: s.hp + state.wave * 250, maxHp: s.hp + state.wave * 250,
    speed: s.speed, r: s.r, dmg: 50 + state.wave * 5, score: 500 + state.wave * 50,
    xp: s.xp, color: s.color, stroke: s.stroke, angle: 0, hitFlash: 0, seed: Math.random() * 10,
    isBoss: true, bossType: type, atkCd: 1.2, spawnAnim: 0.8, wobble: Math.random()*100
  });
  state.events.push('pickup');
}
function killEnemy(e, ownerId) {
  if (!state) return;
  const idx = state.enemies.indexOf(e);
  if (idx === -1) return;
  state.enemies.splice(idx, 1);
  spawnParticles(e.x, e.y, e.color, e.isBoss ? 40 : 12, e.isBoss ? 400 : 200);
  const owner = state.players[ownerId];
  if (owner) {
    owner.score += e.score;
    owner.xp += e.xp;
    while (owner.xp >= xpNeeded(owner.level)) {
      owner.xp -= xpNeeded(owner.level);
      owner.level++;
      owner.maxHp += 10;
      owner.hp = Math.min(owner.maxHp, owner.hp + 20);
      owner.damage += 2;
      owner.fireRate = Math.max(60, owner.fireRate - 8);
      owner.levelUpFlash = 1;
      spawnParticles(owner.x, owner.y, '#ffd93d', 30, 300);
      state.events.push('levelup');
    }
    if (Math.random() < 0.18) spawnPowerup(e.x, e.y);
  }
  if (e.behavior === 'splitter') {
    for (let k = 0; k < 2; k++) {
      state.enemies.push({
        x: e.x+rand(-20,20), y: e.y+rand(-20,20),
        behavior: 'chase', hp: 20, maxHp: 20, speed: 100, r: 12, dmg: 8,
        score: 10, xp: 1, color: '#7bd66b', stroke: '#3d8a35',
        angle:0, hitFlash:0, seed:Math.random()*10, isBoss:false,
        atkCd:2, spawnAnim: 0.3, wobble: Math.random()*100
      });
    }
  }
}

/* ============ BOT AI (LÀM MƯỢT TUYỆT ĐỐI) ============ */
function computeBotInput(bot, player, pvx, pvy) {
  const cfg = BOT_CFG[bot.difficulty];
  if (!cfg || bot.hp <= 0 || player.hp <= 0) {
    return { x: 0, y: 0, aim: bot.aim || 0, shoot: false };
  }
  const dx = player.x - bot.x, dy = player.y - bot.y;
  const d = Math.hypot(dx, dy) || 1;
  const nx = dx / d, ny = dy / d;
  const bulletTime = d / bot.bulletSpeed;
  const px = player.x + pvx * bulletTime * cfg.lead;
  const py = player.y + pvy * bulletTime * cfg.lead;
  const jitter = (Math.random() - 0.5) * cfg.aimJitter;
  const aim = Math.atan2(py - bot.y, px - bot.x) + jitter;
  
  let mx = 0, my = 0, dodging = false;

  // 1. Né đạn (chỉ né khi thực sự nguy hiểm)
  if (cfg.dodge) {
    for (const b of state.bullets) {
      if (b.owner === bot.id) continue;
      const bdx = b.x - bot.x, bdy = b.y - bot.y;
      const bd = Math.hypot(bdx, bdy);
      if (bd > cfg.dodgeRange || bd < 10) continue;
      const blen = Math.hypot(b.vx, b.vy) || 1;
      const bnx = b.vx / blen, bny = b.vy / blen;
      const approaching = -(bdx * bnx + bdy * bny) / bd;
      
      if (approaching > 0.6 && bd < cfg.dodgeRange * 0.8) {
        const perpX = -bny, perpY = bnx;
        const cross = bdx * bny - bdy * bnx;
        const side = cross > 0 ? 1 : -1;
        const urgency = 1 - bd / cfg.dodgeRange;
        mx += perpX * side * urgency * 2.5;
        my += perpY * side * urgency * 2.5;
        dodging = true;
      }
    }
  }

  // 2. Đi nhặt power-up (nếu thông minh)
  if (cfg.smart && !dodging) {
    let bestGood = null, bestD = 500;
    for (const k of state.pickups) {
      if (PU_BAD.includes(k.type)) continue;
      const pd = Math.hypot(k.x - bot.x, k.y - bot.y);
      if (pd < bestD) { bestD = pd; bestGood = k; }
    }
    if (bestGood) {
      const pdx = bestGood.x - bot.x, pdy = bestGood.y - bot.y;
      const pl = Math.hypot(pdx, pdy) || 1;
      mx += pdx / pl * 1.2; my += pdy / pl * 1.2;
    }
    for (const k of state.pickups) {
      if (!PU_BAD.includes(k.type)) continue;
      const pd = Math.hypot(k.x - bot.x, k.y - bot.y);
      if (pd < 220) {
        const pdx = bot.x - k.x, pdy = bot.y - k.y;
        const pl = Math.hypot(pdx, pdy) || 1;
        const urgency = (220 - pd) / 220;
        mx += pdx / pl * urgency * 2; my += pdy / pl * urgency * 2;
      }
    }
  }

  // 3. Giữ khoảng cách và đi lòng vòng
  if (!dodging) {
    if (d < cfg.idealDist - 100) { mx -= nx; my -= ny; }
    else if (d > cfg.idealDist + 100) { mx += nx * 0.7; my += ny * 0.7; }
    else {
      const strafeSign = Math.sin(state.time * 1.5) > 0 ? 1 : -1;
      mx += -ny * strafeSign * 0.8; my += nx * strafeSign * 0.8;
    }
  }

  const ml = Math.hypot(mx, my);
  if (ml > 0) { mx /= ml; my /= ml; }

  // 4. LÀM MƯỢT CHUYỂN ĐỘNG
  bot.smoothX = bot.smoothX * 0.92 + mx * 0.08;
  bot.smoothY = bot.smoothY * 0.92 + my * 0.08;
  
  const sLen = Math.hypot(bot.smoothX, bot.smoothY);
  if (sLen > 0.15) {
    mx = bot.smoothX / sLen;
    my = bot.smoothY / sLen;
  } else {
    mx = 0; 
    my = 0;
    bot.smoothX = 0;
    bot.smoothY = 0;
  }

  const shoot = d < cfg.shootRange;
  return { x: mx, y: my, aim, shoot };
}

/* ============ GAME LOOP ============ */
function gameLoop(now) {
  if (!state || state.over) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  state.time += dt;

  if (state.announce) {
    state.announce.t -= dt;
    if (state.announce.t <= 0) state.announce = null;
  }
  const isPvE = state.mode === 'pve';

  state.players[myId].input = getInputs();

  if (state.mode === 'bot') {
    const bot = state.players['BOT'];
    const player = state.players[myId];
    const pvx = dt > 0 ? (player.x - player._prevX) / dt : 0;
    const pvy = dt > 0 ? (player.y - player._prevY) / dt : 0;
    if (bot.hp > 0 && player.hp > 0) bot.input = computeBotInput(bot, player, pvx, pvy);
    else bot.input = { x: 0, y: 0, aim: bot.aim || 0, shoot: false };
  }

  let aliveCount = 0, aliveId = null;
  for (const id in state.players) if (state.players[id].hp > 0) { aliveCount++; aliveId = id; }

  if (isPvE) {
    if (aliveCount === 0) {
      state.over = true;
      recordPvEScore(state.players[myId].score);
      showOverlay('GAME OVER', '#ff5b6e', 'Điểm: <b>' + state.players[myId].score + '</b>', 'Cấp đạt được: <b>' + state.players[myId].level + '</b>');
      return;
    }
  } else {
    if (aliveCount <= 1) {
      state.over = true;
      state.winner = aliveId;
      const diffTxt = 'Độ khó: ' + DIFF_NAME[state.difficulty];
      if (state.winner === myId) {
        playSound('win'); recordBotWin();
        showOverlay('🏆 BẠN THẮNG!', '#2ee07a', 'Đã hạ gục <b>' + BOT_CFG[state.difficulty].name + '</b>', diffTxt);
      } else {
        playSound('lose');
        showOverlay('💀 BẠN THUA!', '#ff5b6e', '<b>' + BOT_CFG[state.difficulty].name + '</b> đã hạ gục bạn', diffTxt);
      }
      return;
    }
  }

  if (isPvE) {
    if (state.time > state.wave * 15) {
      state.wave++;
      state.events.push('pickup');
      state.announce = { text: 'MÀN ' + state.wave, t: 2 };
    }
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      state.spawnTimer = Math.max(0.3, 1.5 - state.wave * 0.1);
      let num = state.wave >= 10 ? 4 : state.wave >= 6 ? 3 : state.wave >= 3 ? 2 : 1;
      for (let i=0; i<num; i++) spawnEnemy();
    }
    if (state.wave % 3 === 0 && state.bossSpawnedWave !== state.wave &&
        !state.enemies.some(e=>e.isBoss) && state.time > state.wave*15 - 1) {
      spawnBoss();
      state.bossSpawnedWave = state.wave;
      state.announce = { text: 'BOSS XUẤT HIỆN!', t: 2.5 };
    }
  }

  for (const id in state.players) {
    const p = state.players[id];
    if (p.hp <= 0) continue;
    if (p.pvpInvuln > 0) p.pvpInvuln -= dt;
    for (const k in p.powerups) if (p.powerups[k] > 0) p.powerups[k] = Math.max(0, p.powerups[k] - dt);
    if (p.levelUpFlash > 0) p.levelUpFlash -= dt;
    if (p.curseFlash > 0) p.curseFlash -= dt;
    if (p.powerups.burn > 0) {
      p.burnTick = (p.burnTick || 0) + dt;
      if (p.burnTick >= 0.5) {
        p.burnTick = 0; p.hp -= 1.5;
        spawnParticles(p.x + rand(-10,10), p.y + rand(-10,10), '#ff3a1a', 3, 80);
        state.events.push({ type: 'hurt', target: p.id });
        if (p.hp <= 0) p.hp = 0;
      }
    } else p.burnTick = 0;

    let inX = p.input.x, inY = p.input.y;
    if (p.powerups.confuse > 0) { inX = -inX; inY = -inY; }

    let speedMul = 1;
    if (p.powerups.speed > 0) speedMul *= 1.6;
    if (p.powerups.slow > 0) speedMul *= 0.6;
    if (p.powerups.freeze > 0) speedMul *= 0.35;
    if (p.isBot) speedMul *= BOT_CFG[p.difficulty].speedBonus;

    const len = Math.hypot(inX, inY);
    if (len > 0) {
      p.x += (inX / len) * 280 * speedMul * dt;
      p.y += (inY / len) * 280 * speedMul * dt;
      p.angle = Math.atan2(inY, inX);
    }
    p.aim = p.input.aim;

    if (state.arena) {
      const hw = state.arena.w / 2 - 20, hh = state.arena.h / 2 - 20;
      p.x = clamp(p.x, -hw, hw); p.y = clamp(p.y, -hh, hh);
    }
    let fireRate = p.fireRate;
    if (p.powerups.jam > 0) fireRate *= 2.0;

    if (p.input.shoot && (!p.lastShoot || state.time - p.lastShoot > fireRate / 1000)) {
      p.lastShoot = state.time;
      let dmg = p.damage;
      if (p.powerups.pierce > 0) dmg += 10;
      if (p.powerups.curse > 0) dmg *= 0.8;
      const pierce = p.powerups.pierce > 0;
      const shots = p.powerups.tripleshot > 0 ? [-0.18, 0, 0.18] : [0];
      for (const off of shots) {
        const a = p.aim + off;
        state.bullets.push({ x: p.x + Math.cos(a) * 30, y: p.y + Math.sin(a) * 30, vx: Math.cos(a) * p.bulletSpeed, vy: Math.sin(a) * p.bulletSpeed, life: 1.2, owner: id, dmg, pierce, hitSet: [] });
      }
      if (p.powerups.laser > 0 && (!p.lastLaser || state.time - p.lastLaser > 0.4)) {
        p.lastLaser = state.time; spawnLaser(p.x, p.y, p.aim, id); state.events.push('laser');
      }
      if (p.powerups.bomb > 0 && (!p.lastBomb || state.time - p.lastBomb > 0.8)) {
        p.lastBomb = state.time;
        const tx = p.x + Math.cos(p.aim) * 260, ty = p.y + Math.sin(p.aim) * 260;
        explodeBomb(tx, ty, id);
      }
      state.events.push('shoot');
    }
    p._prevX = p.x; p._prevY = p.y;
  }

  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.bullets.splice(i, 1); continue; }
    let consumed = false;
    if (isPvE) {
      for (let j = state.enemies.length - 1; j >= 0; j--) {
        const e = state.enemies[j];
        if (b.hitSet && b.hitSet.includes(e)) continue;
        if (dist(e.x, e.y, b.x, b.y) < e.r + 6) {
          e.hp -= b.dmg; e.hitFlash = 0.12;
          spawnParticles(b.x, b.y, '#fff8cc', 3, 120);
          state.events.push('hit');
          if (e.hp <= 0) killEnemy(e, b.owner);
          if (b.pierce) b.hitSet.push(e); else consumed = true;
          break;
        }
      }
    }
    if (!consumed && state.mode === 'bot') {
      for (const pid in state.players) {
        if (pid === b.owner) continue;
        const p = state.players[pid];
        if (p.hp <= 0 || p.pvpInvuln > 0) continue;
        if (dist(p.x, p.y, b.x, b.y) < 20 + 6) {
          if (p.powerups.shield > 0) {
            if (!p.shieldHp) p.shieldHp = 40;
            p.shieldHp -= b.dmg;
            if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
            spawnParticles(p.x, p.y, '#ffd93d', 6, 150);
          } else {
            p.hp -= b.dmg; p.pvpInvuln = 0.25;
            spawnParticles(p.x, p.y, '#ff5b6e', 8, 200);
          }
          state.events.push({ type: 'hurt', target: pid });
          consumed = true; break;
        }
      }
    }
    if (consumed) state.bullets.splice(i, 1);
  }

  if (isPvE) {
    for (const e of state.enemies) {
      if (e.spawnAnim > 0) { e.spawnAnim -= dt; e.wobble += dt * 8; continue; }
      e.wobble += dt * 4;
      let target = null, minD = Infinity;
      for (const id in state.players) {
        const p = state.players[id];
        if (p.hp <= 0) continue;
        const d = dist(p.x, p.y, e.x, e.y);
        if (d < minD) { minD = d; target = p; }
      }
      if (!target) continue;
      const dx = target.x - e.x, dy = target.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx/d, uy = dy/d;

      if (e.isBoss) {
        e.x += ux * e.speed * dt; e.y += uy * e.speed * dt;
        e.atkCd -= dt;
        if (e.atkCd <= 0) {
          e.atkCd = 2.5;
          for (let k = 0; k < 6; k++) {
            const a = (k / 6) * Math.PI * 2 + state.time;
            state.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*200, vy: Math.sin(a)*200, r: 9, dmg: e.dmg, life: 5, color: e.color });
          }
        }
      } else {
        if (e.behavior === 'chase') { e.x += ux * e.speed * dt; e.y += uy * e.speed * dt; }
        else if (e.behavior === 'zigzag') {
          const px = -uy, py = ux, zig = Math.sin(state.time * 12 + e.seed) * 1.5;
          e.x += (ux + px * zig) * e.speed * 0.8 * dt;
          e.y += (uy + py * zig) * e.speed * 0.8 * dt;
        } else if (e.behavior === 'shoot') {
          if (d > 320) { e.x += ux * e.speed * dt; e.y += uy * e.speed * dt; }
          else if (d < 250) { e.x -= ux * e.speed * dt; e.y -= uy * e.speed * dt; }
          e.atkCd -= dt;
          if (e.atkCd <= 0 && d < 600) {
            e.atkCd = rand(2, 3.5);
            state.ebullets.push({ x: e.x, y: e.y, vx: ux * 350, vy: uy * 350, r: 7, dmg: e.dmg, life: 4, color: '#b46bff' });
          }
        } else if (e.behavior === 'splitter') {
          e.x += ux * e.speed * dt; e.y += uy * e.speed * dt;
        }
      }
      if (d < e.r + 18 && target.hp > 0) {
        let dmg = e.dmg * dt;
        if (target.powerups.shield > 0) {
          if (!target.shieldHp) target.shieldHp = 40;
          target.shieldHp -= dmg * 2;
          if (target.shieldHp <= 0) { target.powerups.shield = 0; target.shieldHp = 0; }
        } else {
          target.hp -= dmg;
          if (Math.random() < 0.1) state.events.push({ type: 'hurt', target: target.id });
        }
      }
    }
    for (let i = state.ebullets.length - 1; i >= 0; i--) {
      const b = state.ebullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { state.ebullets.splice(i, 1); continue; }
      for (const id in state.players) {
        const p = state.players[id];
        if (p.hp > 0 && dist(p.x, p.y, b.x, b.y) < 20 + b.r) {
          if (p.powerups.shield > 0) {
            if (!p.shieldHp) p.shieldHp = 40;
            p.shieldHp -= b.dmg;
            if (p.shieldHp <= 0) { p.powerups.shield = 0; p.shieldHp = 0; }
          } else {
            p.hp -= b.dmg;
            state.events.push({ type: 'hurt', target: p.id });
          }
          state.ebullets.splice(i, 1); break;
        }
      }
    }
  }

  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const k = state.pickups[i];
    k.life -= dt; k.bob += dt * 4;
    if (k.life <= 0) { state.pickups.splice(i, 1); continue; }
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp > 0 && dist(p.x, p.y, k.x, k.y) < 32) {
        applyPickup(p, k); state.pickups.splice(i, 1); break;
      }
    }
  }

  if (state.mode === 'bot') {
    state.pickupTimer -= dt;
    if (state.pickupTimer <= 0 && state.pickups.length < 4) {
      state.pickupTimer = 3 + Math.random() * 2;
      const hw = state.arena.w / 2 - 100, hh = state.arena.h / 2 - 100;
      spawnPowerup(rand(-hw, hw), rand(-hh, hh));
    }
  }

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pa = state.particles[i];
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    pa.vx *= 0.94; pa.vy *= 0.94;
    pa.life -= dt;
    if (pa.life <= 0) state.particles.splice(i, 1);
  }
  for (let i = state.beams.length - 1; i >= 0; i--) {
    const bm = state.beams[i];
    bm.life -= dt;
    if (bm.life <= 0) state.beams.splice(i, 1);
  }

  state.events.forEach(e => {
    if (e && typeof e === 'object' && e.type === 'hurt') {
      playSound('hurt');
      if (e.target === myId) triggerHitEffect();
    } else if (typeof e === 'string') {
      playSound(e);
    }
  });
  state.events = [];

  updateHUD(state);
  updatePowerupHUD(state);
  drawGame(state);
  requestAnimationFrame(gameLoop);
}

function showOverlay(title, color, p1, p2) {
  const t = document.getElementById('ovTitle');
  t.textContent = title; t.style.color = color;
  document.getElementById('ovP1').innerHTML = p1;
  document.getElementById('ovP2').innerHTML = p2;
  document.getElementById('overlay').classList.remove('hidden');
  if (state) { updateHUD(state); drawGame(state); }
}

/* ============ INPUT ============ */
const keys = Object.create(null);
const mouse = { x: innerWidth / 2, y: innerHeight / 2, down: false };
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvasEl.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvasEl.addEventListener('mousedown', e => {
  if (e.target.closest && e.target.closest('.joystick')) return;
  mouse.down = true;
});
addEventListener('mouseup', e => { mouse.down = false; });
canvasEl.addEventListener('contextmenu', e => e.preventDefault());

function getInputs() {
  let mx = 0, my = 0;

  if (keys['a'] || keys['arrowleft']) mx--;
  if (keys['d'] || keys['arrowright']) mx++;
  if (keys['w'] || keys['arrowup']) my--;
  if (keys['s'] || keys['arrowdown']) my++;

  if (touch.moveActive) { mx = touch.moveX; my = touch.moveY; }

  const len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; }

  let aim, shoot;
  if (touch.aimActive) {
    aim = Math.atan2(touch.aimY, touch.aimX);
    shoot = touch.shooting;
  } else {
    aim = Math.atan2(mouse.y - H / 2, mouse.x - W / 2);
    shoot = mouse.down || keys[' '];
  }
  return { x: mx, y: my, aim, shoot };
}

/* ============ RENDER ============ */
const ctx = canvasEl.getContext('2d');
let W = innerWidth, H = innerHeight;
const DPR = Math.min(devicePixelRatio || 1, 2);
let cam = { x: 0, y: 0 };
function resize() {
  W = innerWidth; H = innerHeight;
  canvasEl.width = Math.floor(W * DPR); canvasEl.height = Math.floor(H * DPR);
  canvasEl.style.width = W + 'px'; canvasEl.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mouse.x = W / 2; mouse.y = H / 2;
}
addEventListener('resize', resize); resize();

const CELL = 128;
function drawMap() {
  const left = cam.x - W / 2, top = cam.y - H / 2;
  ctx.fillStyle = '#0b1017';
  ctx.fillRect(left - 60, top - 60, W + 120, H + 120);

  const g = 64;
  const gx0 = Math.floor(left / g) * g, gx1 = left + W;
  const gy0 = Math.floor(top / g) * g,  gy1 = top + H;
  ctx.strokeStyle = 'rgba(60,130,100,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = gx0; x <= gx1; x += g) { ctx.moveTo(x, gy0); ctx.lineTo(x, gy1); }
  for (let y = gy0; y <= gy1; y += g) { ctx.moveTo(gx0, y); ctx.lineTo(gx1, y); }
  ctx.stroke();

  const cx0 = Math.floor(left / CELL) - 1;
  const cx1 = Math.floor((left + W) / CELL) + 1;
  const cy0 = Math.floor(top / CELL) - 1;
  const cy1 = Math.floor((top + H) / CELL) + 1;

  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const h = hash(cx, cy, 1);
      const n = h < 0.55 ? 0 : h < 0.85 ? 1 : 2;
      for (let kk = 0; kk < n; kk++) {
        const px = cx * CELL + hash(cx, cy, 10 + kk * 7) * CELL;
        const py = cy * CELL + hash(cx, cy, 20 + kk * 7) * CELL;
        const type = hash(cx, cy, 30 + kk * 7);
        if (type < 0.45) {
          const r = 6 + hash(cx, cy, 40 + kk * 7) * 10;
          ctx.beginPath();
          ctx.ellipse(px, py, r, r * 0.72, hash(cx, cy, 50 + kk * 7) * TAU, 0, TAU);
          ctx.fillStyle = 'rgba(45,62,72,0.85)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(90,120,120,0.28)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (type < 0.8) {
          ctx.strokeStyle = 'rgba(60,130,90,0.35)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let b = 0; b < 4; b++) {
            const a = -Math.PI / 2 + (hash(cx, cy, 60 + kk * 7 + b) - 0.5) * 1.3;
            const len = 8 + hash(cx, cy, 70 + kk * 7 + b) * 10;
            ctx.moveTo(px + (b - 1.5) * 3, py);
            ctx.lineTo(px + (b - 1.5) * 3 + Math.cos(a) * len, py + Math.sin(a) * len);
          }
          ctx.stroke();
        } else {
          const r = 14 + hash(cx, cy, 80 + kk * 7) * 22;
          ctx.beginPath();
          ctx.arc(px, py, r, 0, TAU);
          ctx.fillStyle = 'rgba(20,30,38,0.55)';
          ctx.fill();
        }
      }
    }
  }
}

function drawArena(arena) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,80,80,0.55)';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 12]);
  ctx.lineDashOffset = -performance.now() * 0.05;
  const hw = arena.w / 2, hh = arena.h / 2;
  ctx.strokeRect(-hw, -hh, arena.w, arena.h);
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,50,50,0.03)';
  ctx.fillRect(-hw, -hh, arena.w, arena.h);
  ctx.strokeStyle = 'rgba(255,80,80,0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(-hw + 20, -hh + 20, arena.w - 40, arena.h - 40);
  ctx.restore();
}

function drawPickup(k) {
  const pulse = 1 + Math.sin(k.bob) * 0.12;
  const isBad = k.bad;
  const ringColor = isBad ? '#ff5b6e' : '#2ee07a';
  const iconCol = PU_COLOR[k.type] || '#fff';

  ctx.save();
  ctx.translate(k.x, k.y);
  ctx.globalAlpha = k.life < 3 ? (Math.floor(performance.now() * 0.01) % 2 ? 0.3 : 1) : 1;

  ctx.save();
  ctx.shadowColor = ringColor; ctx.shadowBlur = 22;
  ctx.strokeStyle = ringColor; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, 22 * pulse, 0, TAU); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.rotate(performance.now() * 0.002 * (isBad ? -1 : 1));
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = ringColor;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 17 * pulse, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.beginPath(); ctx.arc(0, 0, 15 * pulse, 0, TAU);
  ctx.fillStyle = '#0e1a22'; ctx.fill();
  ctx.strokeStyle = hexA(iconCol, 0.7); ctx.lineWidth = 1.5; ctx.stroke();

  ctx.font = 'bold 16px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(PU_ICON[k.type] || '?', 0, 1);

  ctx.restore();
}

function drawEnemy(e, st, targetPlayer) {
  const t = st.time;
  const p = targetPlayer;
  ctx.save();
  ctx.translate(e.x, e.y);
  const spawnScale = e.spawnAnim > 0 ? Math.max(0.05, 1 - e.spawnAnim / 0.8) : 1;
  ctx.scale(spawnScale, spawnScale);
  const flash = e.hitFlash > 0 ? 1 : 0;

  ctx.globalAlpha = 0.18;
  ctx.beginPath(); ctx.arc(0, 0, e.r * (e.isBoss ? 1.9 : 1.7), 0, TAU);
  ctx.fillStyle = e.color; ctx.fill();
  ctx.globalAlpha = 1;

  if (e.isBoss) {
    const n = 18;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + t * 0.55;
      const rad = e.r * (0.88 + 0.16 * Math.sin(t * 5 + e.seed + i * 1.4));
      const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.fill();
    ctx.strokeStyle = e.stroke; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.6, 0, TAU);
    ctx.fillStyle = flash ? '#ffffff' : e.stroke; ctx.fill();
    if (p) {
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      ctx.beginPath(); ctx.arc(ux * e.r * 0.22, uy * e.r * 0.22, e.r * 0.32, 0, TAU);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.beginPath(); ctx.arc(ux * e.r * 0.3, uy * e.r * 0.3, e.r * 0.15, 0, TAU);
      ctx.fillStyle = '#10151c'; ctx.fill();
    }
  } else {
    const n = 12;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      const rad = e.r * (0.86 + 0.14 * Math.sin(t * 7 + e.seed + i * 1.9));
      const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = flash ? '#ffffff' : e.color;
    ctx.fill();
    ctx.strokeStyle = e.stroke; ctx.lineWidth = 3; ctx.stroke();
    if (p) {
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      const px2 = -uy, py2 = ux;
      const off = e.r * 0.36;
      const fx = ux * e.r * 0.34, fy = uy * e.r * 0.34;
      const er = Math.max(3, e.r * 0.22);
      for (const s of [-1, 1]) {
        const ex = fx + px2 * off * s;
        const ey = fy + py2 * off * s;
        ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex + ux * er * 0.35, ey + uy * er * 0.35, er * 0.5, 0, TAU);
        ctx.fillStyle = '#10151c'; ctx.fill();
      }
    }
  }
  if (e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-w / 2, -e.r - 15, w, 5);
    ctx.fillStyle = '#ff5b6e';
    ctx.fillRect(-w / 2, -e.r - 15, w * Math.max(0, e.hp / e.maxHp), 5);
  }
  ctx.restore();
}

function drawPlayer(p, isMe, st) {
  if (p.hp <= 0) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU);
    ctx.fillStyle = '#333'; ctx.fill();
    ctx.restore();
    return;
  }
  const bodyCol = isMe ? '#5fbf7d' : '#6ba8ff';
  const stroke = isMe ? '#1e5233' : '#1e3a8a';
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.curseFlash > 0) {
    ctx.save();
    ctx.globalAlpha = p.curseFlash * 0.6;
    ctx.strokeStyle = '#ff5b6e'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.powerups.freeze > 0) {
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.2 * Math.sin(performance.now() * 0.005);
    ctx.strokeStyle = '#4dd9ff'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  if (p.powerups.burn > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(performance.now() * 0.02);
    ctx.strokeStyle = '#ff3a1a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.powerups.confuse > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#8a1f8a'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a0 = performance.now() * 0.005 + i * TAU / 3;
      ctx.beginPath(); ctx.arc(0, 0, 30 + i * 4, a0, a0 + 1.2); ctx.stroke();
    }
    ctx.restore();
  }
  if (p.powerups.jam > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.powerups.shield > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.2 * Math.sin(performance.now() * 0.01);
    ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.pvpInvuln > 0 && Math.floor(performance.now() * 0.02) % 2 === 0) ctx.globalAlpha = 0.5;

  ctx.save(); ctx.rotate(p.angle || 0);
  ctx.fillStyle = '#1c2530';
  ctx.fillRect(-18, -18, 36, 8);
  ctx.fillRect(-18, 10, 36, 8);
  ctx.restore();

  ctx.fillStyle = bodyCol;
  ctx.strokeStyle = stroke; ctx.lineWidth = 2;
  ctx.fillRect(-15, -12, 30, 24);
  ctx.strokeRect(-15, -12, 30, 24);

  ctx.save(); ctx.rotate(p.aim || 0);
  ctx.fillStyle = '#26473a'; ctx.fillRect(5, -4, 25, 8);
  ctx.fillStyle = bodyCol;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
  ctx.strokeStyle = stroke; ctx.stroke();
  ctx.restore();

  ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = isMe ? '#9df3c4' : '#8ecaff';
  const nameTxt = (st.mode === 'pve' ? p.name + ' Lv' + (p.level||1) : p.name);
  ctx.fillText(nameTxt, 0, -32);

  const w = 40;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(-w/2, -24, w, 4);
  const hpPct = Math.max(0, p.hp / (p.maxHp || 100));
  ctx.fillStyle = hpPct > 0.5 ? '#2ee07a' : hpPct > 0.25 ? '#ffd93d' : '#ff5b6e';
  ctx.fillRect(-w/2, -24, w * hpPct, 4);
  ctx.restore();
}

function drawBeams(st) {
  for (const bm of st.beams) {
    const a = bm.life / bm.maxLife;
    ctx.save();
    if (bm.bomb) {
      ctx.globalAlpha = a;
      const rr2 = bm.radius * (1 - a * 0.3);
      const grad = ctx.createRadialGradient(bm.x, bm.y, 0, bm.x, bm.y, rr2);
      grad.addColorStop(0, 'rgba(255, 200, 50, 0.8)');
      grad.addColorStop(0.5, 'rgba(255, 100, 30, 0.5)');
      grad.addColorStop(1, 'rgba(255, 50, 50, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(bm.x, bm.y, rr2, 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = a;
      ctx.translate(bm.x, bm.y);
      ctx.rotate(bm.angle);
      const grad = ctx.createLinearGradient(0, 0, 2000, 0);
      grad.addColorStop(0, 'rgba(120, 230, 255, 0.9)');
      grad.addColorStop(0.7, 'rgba(80, 180, 255, 0.5)');
      grad.addColorStop(1, 'rgba(80, 180, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, -3, 2000, 6);
      ctx.shadowColor = '#4dd9ff'; ctx.shadowBlur = 20;
      ctx.fillStyle = 'rgba(200, 240, 255, 0.9)';
      ctx.fillRect(0, -1.5, 2000, 3);
    }
    ctx.restore();
  }
}

function drawBullets(st) {
  ctx.lineCap = 'round';
  for (const b of st.bullets) {
    const isPlayer = b.owner === myId;
    const outer = b.pierce ? 'rgba(180,107,255,0.45)' : (isPlayer ? 'rgba(255,214,102,0.35)' : 'rgba(255,120,120,0.5)');
    const glow  = b.pierce ? '#b46bff' : (isPlayer ? '#ffe066' : '#ff5b6e');
    const core  = b.pierce ? '#e0c6ff' : (isPlayer ? '#fff8cc' : '#ffb0b8');
    ctx.strokeStyle = outer;
    ctx.lineWidth = 9.6;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.022, b.y - b.vy * 0.022);
    ctx.stroke();
    ctx.save();
    ctx.shadowColor = glow; ctx.shadowBlur = 16;
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawEBullets(st) {
  for (const b of st.ebullets) {
    ctx.save();
    ctx.shadowColor = b.color; ctx.shadowBlur = 16;
    ctx.fillStyle = '#fff0f6';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawParticles(st) {
  for (const pa of st.particles) {
    ctx.globalAlpha = Math.max(0, pa.life / pa.maxLife);
    ctx.fillStyle = pa.color;
    ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBotIndicator(st) {
  let targetObj = null;
  let targetColor = '#ff5b6e';
  let labelName = 'BOT';
  
  if (st.mode === 'bot') {
    const bot = st.players['BOT'];
    if (bot && bot.hp > 0) { targetObj = bot; targetColor = '#ff5b6e'; labelName = 'BOT'; }
  } else if (st.mode === 'pve') {
    const boss = st.enemies.find(e => e.isBoss);
    if (boss) { targetObj = boss; targetColor = boss.color; labelName = 'BOSS'; }
  }

  if (!targetObj) return;
  const me = st.players[myId];
  if (!me || me.hp <= 0) return;
  if (!isFinite(cam.x) || !isFinite(cam.y)) return;

  const tx = targetObj.x - cam.x + W / 2;
  const ty = targetObj.y - cam.y + H / 2;
  const margin = 70;

  if (tx > margin && tx < W - margin && ty > margin && ty < H - margin) return;

  const pSX = me.x - cam.x + W / 2;
  const pSY = me.y - cam.y + H / 2;
  const dx = targetObj.x - me.x, dy = targetObj.y - me.y;
  const worldDist = Math.hypot(dx, dy) || 1;
  const ux = dx / worldDist, uy = dy / worldDist;

  const minX = margin, maxX = W - margin;
  const minY = margin, maxY = H - margin;
  let tEdge = Infinity;
  if (ux > 0.0001) tEdge = Math.min(tEdge, (maxX - pSX) / ux);
  if (ux < -0.0001) tEdge = Math.min(tEdge, (minX - pSX) / ux);
  if (uy > 0.0001) tEdge = Math.min(tEdge, (maxY - pSY) / uy);
  if (uy < -0.0001) tEdge = Math.min(tEdge, (minY - pSY) / uy);
  if (!isFinite(tEdge) || tEdge <= 0) return;

  const ex = pSX + ux * tEdge;
  const ey = pSY + uy * tEdge;
  const angle = Math.atan2(uy, ux);
  const now = performance.now();
  const pulse = 0.7 + 0.3 * Math.sin(now * 0.008);

  ctx.save();
  ctx.save();
  ctx.shadowColor = targetColor;
  ctx.shadowBlur = 18 + 8 * pulse;
  ctx.strokeStyle = `rgba(${targetColor === '#ff5b6e' ? '255,90,110' : '200,100,255'},${(0.7 * pulse)})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ex, ey, 24 + 4 * pulse, 0, TAU); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = `rgba(${targetColor === '#ff5b6e' ? '255,90,110' : '200,100,255'},${(0.15 * pulse)})`;
  ctx.beginPath(); ctx.arc(ex, ey, 20, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(angle);
  ctx.fillStyle = targetColor;
  ctx.shadowColor = targetColor;
  ctx.shadowBlur = 15;
  const aSize = 16;
  ctx.beginPath();
  ctx.moveTo(aSize, 0);
  ctx.lineTo(-aSize * 0.6, -aSize * 0.7);
  ctx.lineTo(-aSize * 0.15, 0);
  ctx.lineTo(-aSize * 0.6, aSize * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  const labelX = ex - ux * 38;
  const labelY = ey - uy * 38;
  ctx.font = 'bold 12px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const distTxt = labelName + ' ' + Math.round(worldDist / 10) + 'm';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(distTxt, labelX, labelY);
  ctx.fillStyle = '#fff';
  ctx.fillText(distTxt, labelX, labelY);

  ctx.restore();
}

function drawGame(st) {
  if (!st) return;
  ctx.clearRect(0, 0, W, H);
  const me = st.players[myId];
  if (!me) return;
  let targetX = me.x, targetY = me.y;
  if (me.hp <= 0) {
    const alive = Object.values(st.players).find(p => p.hp > 0);
    if (alive) { targetX = alive.x; targetY = alive.y; }
  }
  cam.x += (targetX - cam.x) * 0.15;
  cam.y += (targetY - cam.y) * 0.15;

  let sx = 0, sy = 0;
  if (shakeTime > 0) {
    shakeTime -= 0.016;
    sx = (Math.random() - 0.5) * shakeIntensity;
    sy = (Math.random() - 0.5) * shakeIntensity;
  }
  ctx.save();
  ctx.translate(W / 2 - cam.x + sx, H / 2 - cam.y + sy);

  drawMap();
  if (st.arena) drawArena(st.arena);
  for (const k of st.pickups) drawPickup(k);
  drawBeams(st);
  const targetPlayer = Object.values(st.players).find(pp => pp.hp > 0) || st.players[myId];
  for (const e of st.enemies) drawEnemy(e, st, targetPlayer);
  drawBullets(st);
  drawEBullets(st);
  for (const id in st.players) drawPlayer(st.players[id], id === myId, st);
  drawParticles(st);

  ctx.restore();

  drawBotIndicator(st);

  if (hitFlash > 0) {
    hitFlash -= 0.05;
    ctx.fillStyle = `rgba(255, 30, 30, ${hitFlash * 0.4})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (st.announce) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, st.announce.t);
    ctx.font = 'bold 52px system-ui,sans-serif';
    ctx.fillStyle = '#9df3c4';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#2ee07a'; ctx.shadowBlur = 30;
    ctx.fillText(st.announce.text, W / 2, H * 0.26);
    ctx.restore();
  }

  if (st.mode === 'pve') {
    const boss = st.enemies.find(e => e.isBoss);
    if (boss) {
      const w = Math.min(520, W - 80);
      const x = (W - w) / 2, y = 62;
      const g2 = ctx.createLinearGradient(x, 0, x + w, 0);
      g2.addColorStop(0, boss.color);
      g2.addColorStop(1, '#ffffff');
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      rr(x - 5, y - 5, w + 10, 30, 9); ctx.fill();
      ctx.fillStyle = '#1a1015';
      rr(x, y, w, 20, 6); ctx.fill();
      ctx.fillStyle = g2;
      rr(x, y, w * (boss.hp / boss.maxHp), 20, 6); ctx.fill();
      ctx.fillStyle = '#ffe4e6';
      ctx.font = 'bold 12px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS   ' + Math.ceil(boss.hp) + ' / ' + Math.ceil(boss.maxHp), W / 2, y + 14);
    }
  }
}

})();
</script>
