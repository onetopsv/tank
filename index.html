<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tank Arena P2P</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#080c11;
    font-family:system-ui,"Segoe UI",Arial,sans-serif;user-select:none;color:#dff5e8}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair}
  .hidden{display:none !important}
  
  .screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:24px;
    background:radial-gradient(circle at 50% 40%,#0e1e26,#05080c 70%);
    overflow-y:auto;text-align:center}
  .screen h1{font-size:clamp(32px,7vw,56px);letter-spacing:6px;color:#9df3c4;
    text-shadow:0 0 40px #2ee07a66;margin-bottom:10px}
  .panel{background:#0a141a;border:2px solid #1e3a30;border-radius:14px;
    padding:22px;display:flex;flex-direction:column;gap:12px;
    width:min(340px,90vw)}
  .panel input{padding:12px 14px;border-radius:10px;background:#0e1a20;
    border:2px solid #26485a;color:#dff5e8;font-size:15px;outline:none;
    font-family:inherit;text-align:center;letter-spacing:2px}
  .panel input:focus{border-color:#2ee07a}
  .panel button{padding:12px;border-radius:10px;background:#12463a;
    color:#9df3c4;border:2px solid #2ee07a;font-size:14px;font-weight:800;
    letter-spacing:2px;cursor:pointer;transition:.15s}
  .panel button:hover{background:#2ee07a;color:#04140c}
  .panel button.ghost{background:#0e1a20;color:#cfe9d8;border-color:#26485a}
  .panel button.ghost:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}
  .auth-tabs{display:flex;gap:8px}
  .auth-tabs button{padding:10px 26px;border-radius:10px 10px 0 0;
    background:#0e1a20;color:#7a9a92;border:2px solid #1e3a30;
    font-weight:800;letter-spacing:2px;cursor:pointer;font-size:13px;transition:.15s}
  .auth-tabs button.active{background:#12463a;color:#9df3c4;border-color:#2ee07a}
  #msg{font-size:13px;min-height:20px;letter-spacing:1px;color:#ff8a9a}
  #authMsg{font-size:13px;text-align:center;min-height:20px;letter-spacing:1px;color:#ff8a9a}
  .menu-stats{display:flex;flex-direction:column;gap:6px;padding:16px 24px;border-radius:12px;
    background:#0a141a;border:2px solid #1e3a30;font-size:14px;letter-spacing:1px;
    min-width:min(320px,90vw);text-align:center;margin-bottom:10px}
  .menu-stats b{color:#9df3c4;font-size:18px}
  #codeDisplay{font-size:32px;letter-spacing:10px;color:#9df3c4;
    font-weight:800;margin:8px 0}
  .hint{font-size:12px;color:#6ea8a0;letter-spacing:1px;line-height:1.7}

  #hud{position:fixed;inset:0;pointer-events:none;padding:18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    text-shadow:0 2px 8px #000;font-weight:700}
  #hudLeft{display:flex;flex-direction:column;gap:8px}
  .hpbar{width:220px;height:16px;border-radius:8px;background:#101c24;
    border:2px solid #26485a;overflow:hidden;transition:border-color 0.2s}
  .hpbar.hurt{border-color:#ff5b6e;box-shadow:0 0 15px #ff5b6e88}
  .hpFill{height:100%;width:100%;border-radius:6px;
    background:linear-gradient(90deg,#2ee07a,#9df3c4);transition:width .1s}
  .hpFill.p2{background:linear-gradient(90deg,#3a8fe0,#9dd8ff)}
  .hpText{font-size:12px;margin-top:4px;opacity:.85}
  
  #scoreBox{text-align:right;font-size:12px;letter-spacing:2px;line-height:1.8;opacity:.9}
  #scoreBox b{font-size:22px;color:#9df3c4;display:block}
  #hudRoomCode{color:#6ea8a0;font-size:14px;margin-bottom:5px;display:block}
  #hudRoomCode span{color:#ffd93d;font-size:18px;letter-spacing:3px}
  #btnMenu{pointer-events:auto;cursor:pointer;margin-top:10px;padding:8px 16px;
    border-radius:8px;background:#0e1a20;color:#cfe9d8;border:2px solid #26485a;
    font-size:11px;font-weight:800;letter-spacing:2px;pointer-events:auto}
  #btnMenu:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}

  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle,#0d1a20cc,#000000f2);backdrop-filter:blur(4px);z-index:40}
  #overlay h1{font-size:clamp(36px,9vw,72px);letter-spacing:6px;color:#ff5b6e;
    text-shadow:0 0 30px #ff5b6e88}
  #overlay p{font-size:18px;letter-spacing:2px;opacity:.85;text-align:center}
  #overlay p b{color:#9df3c4;font-size:26px}
  .ov-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .ov-btns button{padding:14px 34px;border-radius:12px;font-size:15px;font-weight:800;
    letter-spacing:2px;transition:.15s;cursor:pointer;border:2px solid}
  #btnRestart{border-color:#2ee07a;background:#0e2a1e;color:#9df3c4;}
  #btnRestart:hover{background:#2ee07a;color:#04140c}
  #btnToMenu{border-color:#26485a;background:#0e1a20;color:#cfe9d8;}
  #btnToMenu:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}
</style>
</head>
<body>

<div id="authScreen" class="screen">
  <h1>TANK ARENA P2P</h1>
  <div class="auth-tabs">
    <button id="tabLogin" class="active">ĐĂNG NHẬP</button>
    <button id="tabRegister">ĐĂNG KÝ</button>
  </div>
  <div class="panel">
    <input id="inputUsername" placeholder="Tên đăng nhập" maxlength="20">
    <input id="inputPassword" type="password" placeholder="Mật khẩu" maxlength="40">
    <button id="btnAuthSubmit">ĐĂNG NHẬP</button>
    <div id="authMsg"></div>
  </div>
  <div class="hint">Tài khoản được lưu trên trình duyệt của bạn.</div>
</div>

<div id="menuScreen" class="screen hidden">
  <h1>MENU</h1>
  <div class="menu-stats">
    <div>Xin chào, <b id="menuUsername">Player</b></div>
    <div>🏆 Điểm cao nhất: <b id="menuHighScore">0</b></div>
  </div>
  <div class="panel">
    <button id="btnCreate">TẠO PHÒNG MỚI (HOST)</button>
    <input id="inpCode" placeholder="NHẬP MÃ PHÒNG" maxlength="4" style="text-transform:uppercase">
    <button id="btnJoin">VÀO PHÒNG BẰNG MÃ</button>
    <button id="btnLogout" class="ghost" style="margin-top:10px">ĐĂNG XUẤT</button>
    <div id="msg"></div>
  </div>
</div>

<div id="waitingScreen" class="screen hidden">
  <h1>PHÒNG CHỜ</h1>
  <div class="panel">
    <div style="opacity:.7;font-size:13px;letter-spacing:2px">MÃ PHÒNG</div>
    <div id="codeDisplay">----</div>
    <div style="font-size:13px;letter-spacing:1px;opacity:.85">
      Trạng thái: <span id="playerCount">Đang kết nối...</span>
    </div>
    <button id="btnReady" class="hidden">BẮT ĐẦU CHIẾN</button>
    <button id="btnLeave" class="ghost">RỜI PHÒNG</button>
  </div>
</div>

<canvas id="game" class="hidden"></canvas>
<div id="hud" class="hidden">
  <div id="hudLeft">
    <div id="p1Hud">
      <div class="hpbar" id="hpBarP1"><div class="hpFill" id="hpFillP1"></div></div>
      <div class="hpText" id="hpTextP1">100 / 100</div>
    </div>
    <div id="p2Hud" class="hidden">
      <div class="hpbar" id="hpBarP2" style="margin-top:8px"><div class="hpFill p2" id="hpFillP2"></div></div>
      <div class="hpText" id="hpTextP2">100 / 100</div>
    </div>
  </div>
  <div id="scoreBox">
    <span id="hudRoomCode">MÃ PHÒNG: <span></span></span>
    ĐIỂM<b id="scoreVal">0</b>
    SÓNG<b id="waveVal">1</b>
    <button id="btnMenu">☰ MENU</button>
  </div>
</div>

<div id="overlay" class="hidden">
  <h1>GAME OVER</h1>
  <p>Điểm: <b id="finalScore">0</b></p>
  <div class="ov-btns">
    <button id="btnRestart">CHƠI LẠI</button>
    <button id="btnToMenu">VỀ MENU</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ==========================================================
   0. FIX: Hàm rand() bị thiếu — nguyên nhân crash chính
   ========================================================== */
function rand(a, b) { return a + Math.random() * (b - a); }

/* ==========================================================
   1. ÂM THANH
   ========================================================== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  if (!audioCtx) return;
  // FIX: 'shoot','hit','hurt','pickup' là string; events khác có thể là object
  if (typeof type !== 'string') return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (type === 'shoot') {
    osc.type='square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now+0.1);
    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.1);
    osc.start(now); osc.stop(now+0.1);
  } else if (type === 'hit') {
    osc.type='sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now+0.1);
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.1);
    osc.start(now); osc.stop(now+0.1);
  } else if (type === 'hurt') {
    osc.type='triangle'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(30, now+0.2);
    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.2);
    osc.start(now); osc.stop(now+0.2);
  } else if (type === 'pickup') {
    osc.type='sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(800, now+0.1);
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.2);
    osc.start(now); osc.stop(now+0.2);
  } else {
    osc.disconnect(); gain.disconnect();
  }
}

let shakeTime = 0, shakeIntensity = 0, hitFlash = 0;
function triggerHitEffect() {
  shakeTime = 0.3; shakeIntensity = 15; hitFlash = 1;
  const bar = document.getElementById('hpBarP1');
  if (bar) { bar.classList.add('hurt'); setTimeout(() => bar.classList.remove('hurt'), 200); }
}

/* ==========================================================
   2. TÀI KHOẢN
   ========================================================== */
const ACCOUNTS_KEY = 'tankArenaAccounts';
const SESSION_KEY = 'tankArenaSession';
function getAccounts() { try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}'); } catch { return {}; } }
function saveAccounts(a) { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }
function hashPass(pw) { let h=5381; for(let i=0;i<pw.length;i++) h=((h<<5)+h+pw.charCodeAt(i))|0; return h.toString(36); }

function registerUser(u, p) {
  if (u.length < 3) return { ok: false, msg: 'Tên phải có ít nhất 3 ký tự' };
  if (p.length < 4) return { ok: false, msg: 'Mật khẩu phải có ít nhất 4 ký tự' };
  const a = getAccounts();
  if (a[u]) return { ok: false, msg: 'Tên đăng nhập đã tồn tại' };
  a[u] = { pass: hashPass(p), highScore: 0 };
  saveAccounts(a); return { ok: true };
}
function loginUser(u, p) {
  const a = getAccounts();
  if (!a[u]) return { ok: false, msg: 'Tài khoản không tồn tại' };
  if (a[u].pass !== hashPass(p)) return { ok: false, msg: 'Sai mật khẩu' };
  localStorage.setItem(SESSION_KEY, u);
  return { ok: true };
}
function updateHighScore(u, score) {
  const a = getAccounts();
  if (!a[u]) return;
  if (score > (a[u].highScore || 0)) {
    a[u].highScore = score;
    saveAccounts(a);
    document.getElementById('menuHighScore').textContent = score;
  }
}

let currentUser = localStorage.getItem(SESSION_KEY);

/* ==========================================================
   3. UI
   ========================================================== */
const screens = {
  auth: document.getElementById('authScreen'),
  menu: document.getElementById('menuScreen'),
  waiting: document.getElementById('waitingScreen')
};
const canvasEl = document.getElementById('game');
const hudEl = document.getElementById('hud');

function show(name) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  canvasEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  if (name === 'game') {
    canvasEl.classList.remove('hidden'); hudEl.classList.remove('hidden');
  } else if (screens[name]) screens[name].classList.remove('hidden');
}

function showMenu() {
  if (!currentUser) { show('auth'); return; }
  show('menu');
  document.getElementById('menuUsername').textContent = currentUser;
  const a = getAccounts();
  document.getElementById('menuHighScore').textContent = (a[currentUser] && a[currentUser].highScore) || 0;
}

if (currentUser) showMenu(); else show('auth');

let authMode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabReg = document.getElementById('tabRegister');
const btnAuth = document.getElementById('btnAuthSubmit');
const authMsg = document.getElementById('authMsg');

tabLogin.onclick = () => { authMode = 'login'; tabLogin.classList.add('active'); tabReg.classList.remove('active'); btnAuth.textContent = 'ĐĂNG NHẬP'; authMsg.textContent = ''; };
tabReg.onclick = () => { authMode = 'register'; tabReg.classList.add('active'); tabLogin.classList.remove('active'); btnAuth.textContent = 'ĐĂNG KÝ'; authMsg.textContent = ''; };

btnAuth.onclick = () => {
  initAudio();
  const u = document.getElementById('inputUsername').value.trim();
  const p = document.getElementById('inputPassword').value;
  authMsg.style.color = '#ff8a9a';
  if (!u || !p) { authMsg.textContent = 'Vui lòng nhập đầy đủ'; return; }

  if (authMode === 'register') {
    const res = registerUser(u, p);
    if (!res.ok) { authMsg.textContent = res.msg; return; }
    loginUser(u, p);
  } else {
    const res = loginUser(u, p);
    if (!res.ok) { authMsg.textContent = res.msg; return; }
  }
  currentUser = u;
  document.getElementById('inputPassword').value = '';
  showMenu();
};

document.getElementById('btnLogout').onclick = () => {
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  show('auth');
};

/* ==========================================================
   4. P2P
   ========================================================== */
let peer = null, conn = null, isHost = false;
let myId = Math.random().toString(36).substr(2, 5);
let myRoomCode = '';
let joined = false;
let gameStarted = false; // FIX: cờ theo dõi game đã bắt đầu

document.getElementById('btnCreate').onclick = () => {
  initAudio();
  isHost = true;
  myRoomCode = Math.random().toString(36).substr(2, 4).toUpperCase();
  document.getElementById('codeDisplay').textContent = myRoomCode;
  document.getElementById('playerCount').textContent = 'Đang tạo phòng...';

  peer = new Peer('TANK-' + myRoomCode, { debug: 1 });
  peer.on('open', () => {
    joined = true;
    document.getElementById('playerCount').textContent = 'Sẵn sàng (Host)';
    document.getElementById('btnReady').classList.remove('hidden');
    show('waiting');
  });
  peer.on('error', (err) => {
    alert('Lỗi tạo phòng: ' + err.type);
  });
  peer.on('connection', (c) => {
    conn = c;
    setupConnection();
  });
};

document.getElementById('btnJoin').onclick = () => {
  initAudio();
  const code = document.getElementById('inpCode').value.trim().toUpperCase();
  const msg = document.getElementById('msg');
  if (code.length !== 4) { msg.textContent = 'Mã phải 4 ký tự'; return; }
  msg.textContent = '';

  isHost = false;
  myRoomCode = code;
  document.getElementById('codeDisplay').textContent = myRoomCode;
  document.getElementById('playerCount').textContent = 'Đang kết nối...';

  peer = new Peer({ debug: 1 });
  peer.on('open', () => {
    conn = peer.connect('TANK-' + code, { reliable: true });
    setupConnection();
  });
  peer.on('error', () => {
    document.getElementById('playerCount').textContent = 'Không tìm thấy phòng!';
  });
};

function setupConnection() {
  conn.on('open', () => {
    joined = true;
    conn.send({ type: 'join', name: currentUser, id: myId });
    if (!isHost) {
      document.getElementById('playerCount').textContent = 'Đã kết nối (Client)';
      document.getElementById('btnReady').classList.remove('hidden');
    }
    show('waiting');
  });

  conn.on('data', (data) => {
    if (isHost) {
      // FIX: xử lý join muộn — thêm player vào state nếu state đã tồn tại
      if (data.type === 'join') {
        if (state && !state.players[data.id]) {
          state.players[data.id] = {
            id: data.id, name: data.name || 'Player2',
            x: 0, y: 0, hp: 100, score: 0, angle: -Math.PI/2, aim: 0, shoot: false,
            input: {x:0, y:0, aim:0, shoot:false}
          };
        }
      }
      // FIX: xử lý ready từ client → host bắt đầu game
      if (data.type === 'ready' && !gameStarted) {
        startGameAsHost();
      }
      if (data.type === 'input' && state && state.players[data.id]) {
        state.players[data.id].input = data.input;
      }
      // FIX: client yêu cầu restart
      if (data.type === 'restartRequest' && state && state.over) {
        restartGameAsHost();
      }
    } else {
      if (data.type === 'state') {
        state = data.state;
        // FIX: xử lý events trước khi bị host xóa
        if (state.events && state.events.length) {
          state.events.forEach(e => {
            if (e && e.type === 'hurt') {
              playSound('hurt');
              if (e.target === myId) triggerHitEffect();
            } else if (typeof e === 'string') {
              playSound(e);
            }
          });
          state.events = [];
        }
        // FIX: cập nhật gameStarted khi nhận state đầu tiên
        if (!gameStarted) {
          gameStarted = true;
          show('game');
          document.getElementById('hudRoomCode').querySelector('span').textContent = myRoomCode;
        }
        updateHUD(state, myId);
      }
      // FIX: nhận lệnh restart từ host
      if (data.type === 'restart') {
        document.getElementById('overlay').classList.add('hidden');
        gameStarted = true;
      }
      // FIX: nhận lệnh game over từ host
      if (data.type === 'gameover') {
        document.getElementById('finalScore').textContent = data.score || 0;
        document.getElementById('overlay').classList.remove('hidden');
      }
    }
  });

  conn.on('close', () => {
    // FIX: chỉ reload nếu đang trong phòng chơi
    if (gameStarted) {
      alert('Mất kết nối phòng!');
      location.reload();
    }
  });
}

function updateHUD(st, myId) {
  const me = st.players[myId];
  if (me) {
    document.getElementById('hpFillP1').style.width = Math.max(0, me.hp) + '%';
    document.getElementById('hpTextP1').textContent = Math.max(0, Math.round(me.hp)) + ' / 100';
    document.getElementById('scoreVal').textContent = me.score;
    document.getElementById('waveVal').textContent = st.wave;
  }
  const p2 = Object.values(st.players).find(p => p.id !== myId);
  if (p2) {
    document.getElementById('p2Hud').classList.remove('hidden');
    document.getElementById('hpFillP2').style.width = Math.max(0, p2.hp) + '%';
    document.getElementById('hpTextP2').textContent = Math.max(0, Math.round(p2.hp)) + ' / 100';
  } else {
    document.getElementById('p2Hud').classList.add('hidden');
  }
}

document.getElementById('btnLeave').onclick = () => {
  if (peer) peer.destroy();
  location.reload();
};

document.getElementById('btnMenu').onclick = () => {
  if (confirm('Thoát về menu? Tiến trình sẽ mất.')) {
    if (peer) peer.destroy();
    location.reload();
  }
};

document.getElementById('btnToMenu').onclick = () => {
  if (peer) peer.destroy();
  location.reload();
};

// FIX: restart xử lý đúng cho cả host và client
document.getElementById('btnRestart').onclick = () => {
  document.getElementById('overlay').classList.add('hidden');
  if (isHost) {
    restartGameAsHost();
  } else {
    conn.send({ type: 'restartRequest' });
  }
};

// FIX: tách hàm restart
function restartGameAsHost() {
  initGame();
  state.over = false;
  lastTime = performance.now();
  sendTimer = 0;
  if (conn && conn.open) conn.send({ type: 'restart' });
  requestAnimationFrame(hostLoop);
}

// FIX: tách hàm start game
function startGameAsHost() {
  if (gameStarted) return;
  gameStarted = true;
  show('game');
  document.getElementById('hudRoomCode').querySelector('span').textContent = myRoomCode;
  if (!state) initGame();
  lastTime = performance.now();
  requestAnimationFrame(hostLoop);
}

document.getElementById('btnReady').onclick = () => {
  initAudio();
  if (isHost) {
    startGameAsHost();
  } else {
    // Client: báo host bắt đầu; host sẽ gửi state → clientLoop sẽ tự show game
    conn.send({ type: 'ready' });
    requestAnimationFrame(clientLoop);
  }
};

/* ==========================================================
   5. GAME LOGIC (HOST)
   ========================================================== */
let state = null, lastTime = performance.now(), sendTimer = 0;

const BOSS_NAMES = ['BOSS XẠ THỦ', 'BOSS HÚT MÁU', 'BOSS HÚC', 'BOSS TRIỆU HỒI', 'BOSS DỊCH CHUYỂN', 'BOSS ĐẶT BẪY'];

function initGame() {
  state = {
    time: 0, wave: 1, spawnTimer: 1, bossIndex: 0, over: false,
    players: {
      [myId]: { id: myId, name: currentUser, x: 0, y: 0, hp: 100, score: 0, angle: -Math.PI/2, aim: 0, shoot: false, input: {x:0, y:0, aim:0, shoot:false} }
    },
    enemies: [], bullets: [], ebullets: [], pickups: [],
    events: []
  };
  // FIX: nếu có client đã join trước khi game bắt đầu, thêm vào state
  if (conn && conn.open && !isHost) {
    // không xảy ra vì host không phải client
  }
}

const TYPES = [
  { behavior: 'chase',    hp: 22,  speed: 96, r: 15, dmg: 8,  score: 10, color: '#7bd66b', stroke: '#3d8a35' },
  { behavior: 'chase',    hp: 52,  speed: 72, r: 23, dmg: 15, score: 25, color: '#e8a13a', stroke: '#a86a15' },
  { behavior: 'chase',    hp: 135, speed: 48, r: 33, dmg: 27, score: 60, color: '#d9506a', stroke: '#8b2a3c' },
  { behavior: 'shoot',    hp: 40,  speed: 60, r: 18, dmg: 12, score: 35, color: '#b46bff', stroke: '#6a2f9e' },
  { behavior: 'zigzag',   hp: 30,  speed: 120, r: 16, dmg: 10, score: 20, color: '#4dd9ff', stroke: '#1b4a5e' },
  { behavior: 'splitter', hp: 80,  speed: 55, r: 26, dmg: 18, score: 45, color: '#ff66b2', stroke: '#8a1f4d' }
];

function spawnEnemy() {
  if (state.enemies.length > 100) return;
  const margin = 100;
  const maxW = innerWidth / 2 + margin, maxH = innerHeight / 2 + margin;
  let spawnX, spawnY;
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { spawnX = (Math.random() * 2 - 1) * maxW; spawnY = -maxH; }
  else if (side === 1) { spawnX = maxW; spawnY = (Math.random() * 2 - 1) * maxH; }
  else if (side === 2) { spawnX = (Math.random() * 2 - 1) * maxW; spawnY = maxH; }
  else { spawnX = -maxW; spawnY = (Math.random() * 2 - 1) * maxH; }

  let avgX = 0, avgY = 0, count = 0;
  for (const id in state.players) {
    if (state.players[id].hp > 0) { avgX += state.players[id].x; avgY += state.players[id].y; count++; }
  }
  if (count > 0) { avgX /= count; avgY /= count; }

  let available = [0, 1, 2];
  if (state.wave >= 2) available.push(4);
  if (state.wave >= 3) available.push(3);
  if (state.wave >= 4) available.push(5);
  let idx = available[Math.floor(Math.random() * available.length)];
  if (Math.random() < 0.1 + state.wave * 0.02) idx = 2;
  const t = TYPES[idx];

  const hpScale = 1 + (state.wave - 1) * 0.1;

  state.enemies.push({
    x: avgX + spawnX, y: avgY + spawnY,
    behavior: t.behavior,
    hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed * (1 + state.wave * 0.02), r: t.r, dmg: t.dmg,
    score: t.score, color: t.color, stroke: t.stroke,
    angle: 0, hitFlash: 0, seed: Math.random() * 10,
    isBig: idx === 2, isBoss: false, atkCd: rand(1,3)
  });
}

function spawnBoss() {
  const type = state.bossIndex % 6;
  state.bossIndex++;
  const stats = [
    { hp: 720, speed: 66, r: 48, color: '#b46bff', stroke: '#6a2f9e' },
    { hp: 520, speed: 78, r: 46, color: '#ff4d6d', stroke: '#8a1f35' },
    { hp: 420, speed: 90, r: 44, color: '#ff8c1a', stroke: '#a04d00' },
    { hp: 560, speed: 55, r: 46, color: '#1ac4c4', stroke: '#0a7272' },
    { hp: 480, speed: 80, r: 45, color: '#e0e0e0', stroke: '#555' },
    { hp: 650, speed: 40, r: 50, color: '#ffd93d', stroke: '#8a6d1a' }
  ];
  const s = stats[type];

  let avgX = 0, avgY = 0, count = 0;
  for (const id in state.players) { avgX += state.players[id].x; avgY += state.players[id].y; count++; }
  if (count > 0) { avgX /= count; avgY /= count; }

  state.enemies.push({
    x: avgX + 700, y: avgY, hp: s.hp + state.wave * 100, maxHp: s.hp + state.wave * 100,
    speed: s.speed, r: s.r, dmg: 30 + state.wave * 2, score: 300 + state.wave * 30,
    color: s.color, stroke: s.stroke, angle: 0, hitFlash: 0, seed: Math.random() * 10,
    isBoss: true, bossType: type, atkCd: 1.5, drainCd: 3, drainWarn: 0, draining: 0,
    chargeState: 0, chargeTimer: 0, chargeDirX: 1, chargeDirY: 0, summonCd: 3, shieldCd: 4, shieldTime: 0, mineCd: 2
  });
  state.events.push('pickup');
}

function hostLoop(now) {
  if (!isHost || !state || state.over) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  state.time += dt;
  if (state.time > state.wave * 15) { state.wave++; state.events.push('pickup'); }

  let allDead = true;
  for (const id in state.players) if (state.players[id].hp > 0) allDead = false;
  if (allDead) {
    state.over = true;
    const finalScore = state.players[myId] ? state.players[myId].score : 0;
    // FIX: gửi gameover cho client
    if (conn && conn.open) {
      conn.send({ type: 'gameover', score: finalScore });
      conn.send({ type: 'state', state: JSON.parse(JSON.stringify(state)) });
    }
    document.getElementById('finalScore').textContent = finalScore;
    updateHighScore(currentUser, finalScore);
    document.getElementById('overlay').classList.remove('hidden');
    return;
  }

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    state.spawnTimer = Math.max(0.3, 1.5 - state.wave * 0.1);
    let num = state.wave >= 10 ? 4 : state.wave >= 6 ? 3 : state.wave >= 3 ? 2 : 1;
    for (let i=0; i<num; i++) spawnEnemy();
  }
  if (state.wave % 3 === 0 && !state.enemies.some(e=>e.isBoss) && state.time > state.wave*15 - 1) spawnBoss();

  for (const id in state.players) {
    const p = state.players[id];
    if (p.hp <= 0) continue;
    const len = Math.hypot(p.input.x, p.input.y);
    if (len > 0) { p.x += (p.input.x / len) * 280 * dt; p.y += (p.input.y / len) * 280 * dt; p.angle = Math.atan2(p.input.y, p.input.x); }
    p.aim = p.input.aim;

    if (p.input.shoot && (!p.lastShoot || now - p.lastShoot > 150)) {
      p.lastShoot = now;
      state.bullets.push({ x: p.x + Math.cos(p.aim) * 30, y: p.y + Math.sin(p.aim) * 30, vx: Math.cos(p.aim) * 1000, vy: Math.sin(p.aim) * 1000, life: 1.2, owner: id });
      state.events.push('shoot');
    }
  }

  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.bullets.splice(i, 1); continue; }
    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 6) {
        e.hp -= 20; state.events.push('hit'); state.bullets.splice(i, 1);
        if (e.hp <= 0) {
          state.enemies.splice(j, 1);
          if (state.players[b.owner]) {
            state.players[b.owner].score += e.score;
            if (Math.random() < 0.15) state.pickups.push({ x: e.x, y: e.y, type: 'health' });
          }
          if (e.behavior === 'splitter') {
             for(let k=0;k<2;k++) {
                state.enemies.push({ x: e.x+rand(-20,20), y: e.y+rand(-20,20), behavior: 'chase', hp: 20, maxHp: 20, speed: 100, r: 12, dmg: 8, score: 10, color: '#7bd66b', stroke: '#3d8a35', angle:0, hitFlash:0, seed:Math.random()*10, isBoss:false, atkCd:2 });
             }
          }
        }
        break;
      }
    }
  }

  for (const e of state.enemies) {
    let target = null, minD = Infinity;
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp <= 0) continue;
      const d = Math.hypot(p.x - e.x, p.y - e.y);
      if (d < minD) { minD = d; target = p; }
    }
    if (!target) continue;
    const dx = target.x - e.x, dy = target.y - e.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx/d, uy = dy/d;

    if (e.isBoss) {
       e.x += ux * e.speed * dt; e.y += uy * e.speed * dt;
    } else {
      if (e.behavior === 'chase') { e.x += ux * e.speed * dt; e.y += uy * e.speed * dt; }
      else if (e.behavior === 'zigzag') {
        const px = -uy, py = ux, zig = Math.sin(state.time * 12 + e.seed) * 1.5;
        e.x += (ux + px * zig) * e.speed * 0.8 * dt; e.y += (uy + py * zig) * e.speed * 0.8 * dt;
      } else if (e.behavior === 'shoot') {
        if (d > 320) { e.x += ux * e.speed * dt; e.y += uy * e.speed * dt; }
        else if (d < 250) { e.x -= ux * e.speed * dt; e.y -= uy * e.speed * dt; }
        e.atkCd -= dt;
        if (e.atkCd <= 0 && d < 600) {
          e.atkCd = rand(2, 3.5);
          state.ebullets.push({ x: e.x, y: e.y, vx: ux * 350, vy: uy * 350, r: 7, dmg: e.dmg, life: 4, color: '#b46bff' });
        }
      } else if (e.behavior === 'splitter') {
         e.x += ux * e.speed * dt; e.y += uy * e.speed * dt;
      }
    }

    if (d < e.r + 18 && target.hp > 0) {
      target.hp -= e.dmg * dt;
      if (Math.random() < 0.1) state.events.push({ type: 'hurt', target: target.id });
    }
  }

  for (let i = state.ebullets.length - 1; i >= 0; i--) {
    const b = state.ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.ebullets.splice(i, 1); continue; }
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp > 0 && Math.hypot(p.x - b.x, p.y - b.y) < 20 + b.r) {
        p.hp -= b.dmg; state.ebullets.splice(i, 1);
        state.events.push({ type: 'hurt', target: p.id });
        break;
      }
    }
  }

  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const k = state.pickups[i];
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp > 0 && Math.hypot(p.x - k.x, p.y - k.y) < 30) {
        p.hp = Math.min(100, p.hp + 40); state.pickups.splice(i, 1); state.events.push('pickup'); break;
      }
    }
  }

  // FIX: xử lý events phát âm thanh host
  state.events.forEach(e => {
    if (e && e.type === 'hurt') { playSound('hurt'); if (e.target === myId) triggerHitEffect(); }
    else if (typeof e === 'string') playSound(e);
  });

  // FIX: gửi state TRƯỚC khi xóa events, để client cũng nhận được âm thanh
  sendTimer += dt;
  if (sendTimer > 0.05) {
    sendTimer = 0;
    if (conn && conn.open) {
      const sendState = JSON.parse(JSON.stringify(state));
      for (const id in sendState.players) delete sendState.players[id].input;
      conn.send({ type: 'state', state: sendState });
    }
    state.events = []; // xóa sau khi gửi
  }

  updateHUD(state, myId);
  drawGame(state, myId);
  requestAnimationFrame(hostLoop);
}

/* ==========================================================
   6. CLIENT LOOP
   ========================================================== */
let inputTimer = 0;
function clientLoop(now) {
  if (isHost) return;
  if (state && state.over) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  inputTimer += dt;
  if (inputTimer > 0.033 && conn && conn.open) {
    inputTimer = 0;
    conn.send({ type: 'input', id: myId, input: getInputs() });
  }
  if (state) {
    // FIX: khi nhận state đầu tiên thì show game
    if (!gameStarted) {
      gameStarted = true;
      show('game');
      document.getElementById('hudRoomCode').querySelector('span').textContent = myRoomCode;
    }
    drawGame(state, myId);
  }
  requestAnimationFrame(clientLoop);
}

/* ==========================================================
   7. INPUT & RENDER
   ========================================================== */
const keys = Object.create(null);
const mouse = { x: innerWidth / 2, y: innerHeight / 2, down: false };

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvasEl.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvasEl.addEventListener('mousedown', e => { mouse.down = true; });
addEventListener('mouseup', e => { mouse.down = false; });
canvasEl.addEventListener('contextmenu', e => e.preventDefault());

function getInputs() {
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft']) mx--;
  if (keys['d'] || keys['arrowright']) mx++;
  if (keys['w'] || keys['arrowup']) my--;
  if (keys['s'] || keys['arrowdown']) my++;
  const aim = Math.atan2(mouse.y - innerHeight / 2, mouse.x - innerWidth / 2);
  return { x: mx, y: my, aim: aim, shoot: mouse.down || keys[' '] };
}

// FIX: guard state null
setInterval(() => {
  if (isHost && state && state.players[myId] && !state.over) {
    state.players[myId].input = getInputs();
  }
}, 33);

const ctx = canvasEl.getContext('2d');
let W = innerWidth, H = innerHeight;
const DPR = Math.min(devicePixelRatio || 1, 2);
let cam = { x: 0, y: 0 };

function resize() {
  W = innerWidth; H = innerHeight;
  canvasEl.width = Math.floor(W * DPR); canvasEl.height = Math.floor(H * DPR);
  canvasEl.style.width = W + 'px'; canvasEl.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

function drawGame(st, myId) {
  ctx.clearRect(0, 0, W, H);
  const me = st.players[myId];
  if (!me) return;

  let targetX = me.x, targetY = me.y;
  if (me.hp <= 0) {
     let alive = Object.values(st.players).find(p => p.hp > 0);
     if (alive) { targetX = alive.x; targetY = alive.y; }
  }
  cam.x += (targetX - cam.x) * 0.15; cam.y += (targetY - cam.y) * 0.15;

  let sx = 0, sy = 0;
  if (shakeTime > 0) {
    shakeTime -= 0.016; sx = (Math.random() - 0.5) * shakeIntensity; sy = (Math.random() - 0.5) * shakeIntensity;
  }

  ctx.save();
  ctx.translate(W / 2 - cam.x + sx, H / 2 - cam.y + sy);

  ctx.fillStyle = '#0b1017'; ctx.fillRect(cam.x - W/2 - 100, cam.y - H/2 - 100, W+200, H+200);
  const g = 64; ctx.strokeStyle = 'rgba(60,130,100,0.10)'; ctx.beginPath();
  const gx0 = Math.floor((cam.x - W/2)/g)*g, gy0 = Math.floor((cam.y - H/2)/g)*g;
  for (let x = gx0; x <= cam.x + W/2; x += g) { ctx.moveTo(x, cam.y - H/2); ctx.lineTo(x, cam.y + H/2); }
  for (let y = gy0; y <= cam.y + H/2; y += g) { ctx.moveTo(cam.x - W/2, y); ctx.lineTo(cam.x + W/2, y); }
  ctx.stroke();

  for (const k of st.pickups) {
    ctx.save(); ctx.translate(k.x, k.y); ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(46,224,122,0.2)'; ctx.fill(); ctx.strokeStyle = '#2ee07a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#2ee07a'; ctx.fillRect(-4, -1, 8, 2); ctx.fillRect(-1, -4, 2, 8); ctx.restore();
  }

  for (const e of st.enemies) {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.beginPath();
    const n = e.behavior === 'zigzag' ? 4 : 12;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const r = e.r * (0.8 + 0.2 * Math.sin(performance.now() * 0.01 + i));
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = e.color; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#000'; ctx.fillRect(-e.r, -e.r - 10, e.r*2, 4);
      ctx.fillStyle = '#ff5b6e'; ctx.fillRect(-e.r, -e.r - 10, e.r*2 * (e.hp/e.maxHp), 4);
    }
    ctx.restore();
  }

  for (const b of st.bullets) {
    ctx.save(); ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff8cc'; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  for (const b of st.ebullets) {
    ctx.save(); ctx.shadowColor = b.color; ctx.shadowBlur = 10;
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }

  for (const id in st.players) {
    const p = st.players[id];
    if (p.hp <= 0) {
       ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha=0.4;
       ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fillStyle='#333'; ctx.fill(); ctx.restore(); continue;
    }
    const isMe = (id === myId);
    const bodyCol = isMe ? '#5fbf7d' : '#6ba8ff', stroke = isMe ? '#1e5233' : '#1e3a8a';
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.save(); ctx.rotate(p.angle || 0);
    ctx.fillStyle = '#1c2530'; ctx.fillRect(-18, -18, 36, 8); ctx.fillRect(-18, 10, 36, 8);
    ctx.fillStyle = bodyCol; ctx.fillRect(-15, -12, 30, 24); ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(-15, -12, 30, 24);
    ctx.restore();
    ctx.save(); ctx.rotate(p.aim || 0);
    ctx.fillStyle = '#26473a'; ctx.fillRect(5, -4, 25, 8);
    ctx.fillStyle = bodyCol; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = isMe ? '#9df3c4' : '#8ecaff';
    ctx.fillText(p.name, 0, -30);
    ctx.fillStyle = '#000'; ctx.fillRect(-20, -22, 40, 4);
    ctx.fillStyle = '#2ee07a'; ctx.fillRect(-20, -22, 40 * (p.hp/100), 4);
    ctx.restore();
  }
  ctx.restore();

  if (hitFlash > 0) {
    hitFlash -= 0.05;
    ctx.fillStyle = `rgba(255, 30, 30, ${hitFlash * 0.4})`; ctx.fillRect(0, 0, W, H);
  }
}

})();
</script>
