<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tank Arena P2P</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#080c11;
    font-family:system-ui,"Segoe UI",Arial,sans-serif;user-select:none;color:#dff5e8}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair}
  .hidden{display:none !important}
  .screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:24px;
    background:radial-gradient(circle at 50% 40%,#0e1e26,#05080c 70%);
    overflow-y:auto;text-align:center}
  .screen h1{font-size:clamp(32px,7vw,56px);letter-spacing:6px;color:#9df3c4;
    text-shadow:0 0 40px #2ee07a66}
  .panel{background:#0a141a;border:2px solid #1e3a30;border-radius:14px;
    padding:22px;display:flex;flex-direction:column;gap:12px;
    width:min(340px,90vw)}
  .panel input{padding:12px 14px;border-radius:10px;background:#0e1a20;
    border:2px solid #26485a;color:#dff5e8;font-size:15px;outline:none;
    font-family:inherit;text-align:center;letter-spacing:2px}
  .panel input:focus{border-color:#2ee07a}
  .panel button{padding:12px;border-radius:10px;background:#12463a;
    color:#9df3c4;border:2px solid #2ee07a;font-size:14px;font-weight:800;
    letter-spacing:2px;cursor:pointer;transition:.15s}
  .panel button:hover{background:#2ee07a;color:#04140c}
  .panel button.ghost{background:#0e1a20;color:#cfe9d8;border-color:#26485a}
  .panel button.ghost:hover{background:#12463a;border-color:#2ee07a;color:#9df3c4}
  #msg{font-size:13px;min-height:20px;letter-spacing:1px;color:#ff8a9a}
  #codeDisplay{font-size:32px;letter-spacing:10px;color:#9df3c4;
    font-weight:800;margin:8px 0}
  .hint{font-size:12px;color:#6ea8a0;letter-spacing:1px;line-height:1.7}
  
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;padding:18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    text-shadow:0 2px 8px #000;font-weight:700}
  .hpbar{width:220px;height:16px;border-radius:8px;background:#101c24;
    border:2px solid #26485a;overflow:hidden;transition: border-color 0.2s}
  .hpbar.hurt { border-color: #ff5b6e; box-shadow: 0 0 15px #ff5b6e88; }
  
  #hpFill{height:100%;width:100%;border-radius:6px;
    background:linear-gradient(90deg,#2ee07a,#9df3c4);transition:width .1s}
  #hpText{font-size:12px;margin-top:4px;opacity:.85}
  
  #scoreBox{text-align:right;font-size:12px;letter-spacing:2px;line-height:1.8;
    opacity:.9}
  #scoreBox b{font-size:22px;color:#9df3c4;display:block}
  #hudRoomCode { color: #6ea8a0; font-size: 14px; margin-bottom: 5px; display: block;}
  #hudRoomCode span { color: #ffd93d; font-size: 18px; letter-spacing: 3px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <h1>TANK ARENA P2P</h1>
  <div class="panel">
    <input id="inpName" placeholder="Tên người chơi" maxlength="20">
    <button id="btnLogin">VÀO GAME</button>
  </div>
  <div class="hint">Chơi trực tiếp P2P không cần server.</div>
</div>

<!-- LOBBY -->
<div id="lobbyScreen" class="screen hidden">
  <h1>LOBBY</h1>
  <div class="panel">
    <button id="btnCreate">TẠO PHÒNG MỚI (HOST)</button>
    <input id="inpCode" placeholder="MÃ PHÒNG CỦA BẠN BÈ" maxlength="4" style="text-transform:uppercase">
    <button id="btnJoin">THAM GIA PHÒNG</button>
    <div id="msg"></div>
  </div>
  <div class="hint">Người tạo phòng làm Host (máy chủ). Tối đa 4 người.</div>
</div>

<!-- WAITING -->
<div id="waitingScreen" class="screen hidden">
  <h1>PHÒNG CHỜ</h1>
  <div class="panel">
    <div style="opacity:.7;font-size:13px;letter-spacing:2px">MÃ PHÒNG</div>
    <div id="codeDisplay">----</div>
    <div style="font-size:13px;letter-spacing:1px;opacity:.85">
      Trạng thái: <span id="playerCount">Đang kết nối...</span>
    </div>
    <button id="btnReady" class="hidden">BẮT ĐẦU CHIẾN</button>
    <button id="btnLeave" class="ghost">RỜI PHÒNG</button>
  </div>
</div>

<!-- GAME -->
<canvas id="game" class="hidden"></canvas>
<div id="hud" class="hidden">
  <div>
    <div class="hpbar" id="hpBarContainer"><div id="hpFill"></div></div>
    <div id="hpText">100 / 100</div>
  </div>
  <div id="scoreBox">
    <span id="hudRoomCode">MÃ PHÒNG: <span></span></span>
    ĐIỂM<b id="scoreVal">0</b>
    SÓNG<b id="waveVal">1</b>
  </div>
</div>

<script>
(function(){
'use strict';

/* ==========================================================
   1. ÂM THANH (WEB AUDIO API)
   ========================================================== */
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  const now = audioCtx.currentTime;

  if (type === 'shoot') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
    gain.gain.setValueAtTime(0.05, now); // Nhỏ lại để không bị điếc tai
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'hurt') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(100, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'pickup') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.setValueAtTime(800, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  }
}

/* ==========================================================
   2. HIỆU ỨNG MÀN HÌNH (RUNG & CHỚP ĐỎ)
   ========================================================== */
let shakeTime = 0;
let shakeIntensity = 0;
let hitFlash = 0;

function triggerHitEffect() {
  shakeTime = 0.3; // Rung 0.3 giây
  shakeIntensity = 15; // Biên độ rung
  hitFlash = 1; // Chớp đỏ
  
  const hpBar = document.getElementById('hpBarContainer');
  hpBar.classList.add('hurt');
  setTimeout(() => hpBar.classList.remove('hurt'), 200);
}

/* ==========================================================
   3. KHỞI TẠO CƠ BẢN
   ========================================================== */
const screens = {
  login: document.getElementById('loginScreen'),
  lobby: document.getElementById('lobbyScreen'),
  waiting: document.getElementById('waitingScreen')
};
const canvasEl = document.getElementById('game');
const hudEl = document.getElementById('hud');

function show(name) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  canvasEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  if (name === 'game') { 
    canvasEl.classList.remove('hidden'); 
    hudEl.classList.remove('hidden'); 
  }
  else if (screens[name]) screens[name].classList.remove('hidden');
}

let playerName = localStorage.getItem('ta_name') || '';
document.getElementById('inpName').value = playerName;
if (playerName) show('lobby'); else show('login');

document.getElementById('btnLogin').addEventListener('click', () => {
  initAudio();
  const n = document.getElementById('inpName').value.trim();
  if (n.length < 2) { alert('Tên ít nhất 2 ký tự'); return; }
  localStorage.setItem('ta_name', n);
  playerName = n;
  show('lobby');
});

/* ==========================================================
   4. MẠNG P2P (PEERJS)
   ========================================================== */
let peer = null;
let conn = null;
let isHost = false;
let myId = Math.random().toString(36).substr(2, 5);
let myRoomCode = '';
let joined = false;

document.getElementById('btnCreate').addEventListener('click', () => {
  initAudio();
  isHost = true;
  myRoomCode = Math.random().toString(36).substr(2, 4).toUpperCase();
  document.getElementById('codeDisplay').textContent = myRoomCode;
  document.getElementById('msg').textContent = 'Đang tạo phòng...';
  
  peer = new Peer('TANK-' + myRoomCode, { debug: 1 });
  
  peer.on('open', () => {
    joined = true;
    document.getElementById('playerCount').textContent = 'Sẵn sàng (Host)';
    document.getElementById('btnReady').classList.remove('hidden');
    show('waiting');
  });

  peer.on('error', (err) => {
    alert('Lỗi tạo phòng: ' + err.type + '. Vui lòng thử lại!');
  });

  peer.on('connection', (c) => {
    conn = c;
    setupConnection();
  });
});

document.getElementById('btnJoin').addEventListener('click', () => {
  initAudio();
  const code = document.getElementById('inpCode').value.trim().toUpperCase();
  if (code.length !== 4) { document.getElementById('msg').textContent = 'Mã phải 4 ký tự'; return; }
  
  isHost = false;
  myRoomCode = code;
  document.getElementById('codeDisplay').textContent = myRoomCode;
  document.getElementById('msg').textContent = 'Đang kết nối tới Host...';
  
  peer = new Peer({ debug: 1 });
  
  peer.on('open', () => {
    conn = peer.connect('TANK-' + code, { reliable: true });
    setupConnection();
  });

  peer.on('error', (err) => {
    document.getElementById('msg').textContent = 'Không tìm thấy phòng hoặc lỗi mạng!';
  });
});

function setupConnection() {
  conn.on('open', () => {
    joined = true;
    conn.send({ type: 'join', name: playerName, id: myId });
    
    if (!isHost) {
      document.getElementById('playerCount').textContent = 'Đã kết nối (Client)';
      document.getElementById('btnReady').classList.remove('hidden');
    }
    show('waiting');
  });

  conn.on('data', (data) => {
    if (isHost) {
      if (data.type === 'input') {
        if (state && state.players[data.id]) {
          state.players[data.id].input = data.input;
        }
      }
    } else {
      if (data.type === 'state') {
        state = data.state;
        
        // Xử lý sự kiện từ Host
        if (state.events) {
          state.events.forEach(e => {
            if (e.type === 'hurt') {
              playSound('hurt');
              // Nếu người bị đánh là mình thì rung màn hình
              if (e.target === myId) triggerHitEffect();
            } else {
              playSound(e);
            }
          });
          state.events = [];
        }
        
        const me = state.players[myId];
        if (me) {
          document.getElementById('hpFill').style.width = Math.max(0, me.hp) + '%';
          document.getElementById('hpText').textContent = Math.max(0, Math.round(me.hp)) + ' / 100';
          document.getElementById('scoreVal').textContent = me.score;
          document.getElementById('waveVal').textContent = state.wave;
        }
      }
    }
  });

  conn.on('close', () => {
    alert('Mất kết nối với phòng!');
    location.reload();
  });
}

document.getElementById('btnLeave').addEventListener('click', () => {
  if (peer) peer.destroy();
  location.reload();
});

document.getElementById('btnReady').addEventListener('click', () => {
  show('game');
  
  // Hiển thị mã phòng lên HUD
  document.querySelector('#hudRoomCode span').textContent = myRoomCode;

  if (isHost) {
    if (!state) initGame();
    requestAnimationFrame(hostLoop);
  } else {
    conn.send({ type: 'ready' });
    requestAnimationFrame(clientLoop);
  }
});

/* ==========================================================
   5. GAME LOGIC (HOST CHẠY)
   ========================================================== */
let state = null;
let lastTime = performance.now();
let sendTimer = 0;

function initGame() {
  state = {
    time: 0, wave: 1, spawnTimer: 1,
    players: {
      [myId]: { id: myId, name: playerName, x: 0, y: 0, hp: 100, score: 0, angle: -Math.PI/2, aim: 0, shoot: false, input: {x:0, y:0, aim:0, shoot:false} }
    },
    enemies: [], bullets: [], pickups: [],
    events: [] // Mảng chứa âm thanh và hiệu ứng
  };
}

function spawnEnemy() {
  if (state.enemies.length > 150) return;

  // Lấy vị trí trung bình của người chơi
  let targetX = 0, targetY = 0, count = 0;
  for (const id in state.players) {
    const p = state.players[id];
    if (p.hp > 0) {
      targetX += p.x; targetY += p.y; count++;
    }
  }
  
  if (count > 0) { targetX /= count; targetY /= count; } 
  else return;

  // Sinh quái ở khoảng cách 800 đơn vị xung quanh
  const a = Math.random() * Math.PI * 2;
  const dist = 800;
  const spawnX = targetX + Math.cos(a) * dist;
  const spawnY = targetY + Math.sin(a) * dist;

  state.enemies.push({
    x: spawnX, y: spawnY,
    hp: 20 + state.wave * 10, maxHp: 20 + state.wave * 10,
    speed: 80 + state.wave * 5, r: 15,
    color: `hsl(${Math.random() * 60 + 60}, 80%, 60%)`
  });
}

function hostLoop(now) {
  if (!isHost) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (!state) initGame();

  // Biến đổi thời gian
  state.time += dt;
  if (state.time > state.wave * 15) {
    state.wave++;
    state.events.push('pickup');
  }

  // Spawn quái
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    state.spawnTimer = Math.max(0.2, 1.5 - state.wave * 0.1);
    let numSpawns = 1;
    if (state.wave >= 3) numSpawns = 2;
    if (state.wave >= 6) numSpawns = 3;
    if (state.wave >= 10) numSpawns = 4;
    for(let i=0; i<numSpawns; i++) spawnEnemy();
  }

  // Update Players
  for (const id in state.players) {
    const p = state.players[id];
    const len = Math.hypot(p.input.x, p.input.y);
    if (len > 0) {
      p.x += (p.input.x / len) * 280 * dt;
      p.y += (p.input.y / len) * 280 * dt;
      p.angle = Math.atan2(p.input.y, p.input.x);
    }
    p.aim = p.input.aim;
    p.shoot = p.input.shoot;

    if (p.shoot && (!p.lastShoot || now - p.lastShoot > 150)) {
      p.lastShoot = now;
      state.bullets.push({
        x: p.x + Math.cos(p.aim) * 30, y: p.y + Math.sin(p.aim) * 30,
        vx: Math.cos(p.aim) * 1000, vy: Math.sin(p.aim) * 1000, life: 1.2, owner: id
      });
      state.events.push('shoot');
    }
  }

  // Update Bullets
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.bullets.splice(i, 1); continue; }

    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 6) {
        e.hp -= 20;
        state.bullets.splice(i, 1);
        state.events.push('hit');
        
        if (e.hp <= 0) {
          state.enemies.splice(j, 1);
          if (state.players[b.owner]) {
            state.players[b.owner].score += 10;
            if (Math.random() < 0.15) {
              state.pickups.push({ x: e.x, y: e.y, type: 'health' });
            }
          }
        }
        break;
      }
    }
  }

  // Update Enemies
  for (const e of state.enemies) {
    let target = null, minD = Infinity;
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp <= 0) continue;
      const d = Math.hypot(p.x - e.x, p.y - e.y);
      if (d < minD) { minD = d; target = p; }
    }
    
    if (target) {
      const dx = target.x - e.x, dy = target.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      e.x += (dx / d) * e.speed * dt;
      e.y += (dy / d) * e.speed * dt;
      
      if (d < e.r + 18 && target.hp > 0) {
        target.hp -= 20 * dt;
        // Thêm sự kiện bị đánh trúng kèm theo ID người chơi
        if (Math.random() < 0.1) {
          state.events.push({ type: 'hurt', target: target.id });
        }
      }
    }
  }

  // Update Pickups
  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const k = state.pickups[i];
    for (const id in state.players) {
      const p = state.players[id];
      if (p.hp > 0 && Math.hypot(p.x - k.x, p.y - k.y) < 30) {
        p.hp = Math.min(100, p.hp + 40);
        state.pickups.splice(i, 1);
        state.events.push('pickup');
        break;
      }
    }
  }

  // Xử lý sự kiện (Âm thanh & Rung màn hình) cho HOST
  state.events.forEach(e => {
    if (e.type === 'hurt') {
      playSound('hurt');
      if (e.target === myId) triggerHitEffect();
    } else {
      playSound(e);
    }
  });

  // Gửi state cho Client
  sendTimer += dt;
  if (sendTimer > 0.05) {
    sendTimer = 0;
    if (conn && conn.open) {
      const sendState = JSON.parse(JSON.stringify(state));
      for (const id in sendState.players) delete sendState.players[id].input;
      conn.send({ type: 'state', state: sendState });
    }
  }
  
  state.events = []; // Xóa sự kiện sau khi xử lý

  // Vẽ
  drawGame(state, myId);
  requestAnimationFrame(hostLoop);
}

/* ==========================================================
   6. GAME LOGIC (CLIENT CHẠY)
   ========================================================== */
let inputTimer = 0;

function clientLoop(now) {
  if (isHost) return;
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  inputTimer += dt;
  if (inputTimer > 0.033) {
    inputTimer = 0;
    if (conn && conn.open) {
      conn.send({ type: 'input', id: myId, input: getInputs() });
    }
  }

  if (state) drawGame(state, myId);
  requestAnimationFrame(clientLoop);
}

/* ==========================================================
   7. INPUT & RENDER
   ========================================================== */
const keys = Object.create(null);
const mouse = { x: innerWidth / 2, y: innerHeight / 2, down: false };

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvasEl.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvasEl.addEventListener('mousedown', e => { mouse.down = true; });
addEventListener('mouseup', e => { mouse.down = false; });
canvasEl.addEventListener('contextmenu', e => e.preventDefault());

function getInputs() {
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft']) mx--;
  if (keys['d'] || keys['arrowright']) mx++;
  if (keys['w'] || keys['arrowup']) my--;
  if (keys['s'] || keys['arrowdown']) my++;
  
  const aim = Math.atan2(mouse.y - innerHeight / 2, mouse.x - innerWidth / 2);
  return { x: mx, y: my, aim: aim, shoot: mouse.down || keys[' '] };
}

setInterval(() => {
  if (isHost && state && state.players[myId]) {
    state.players[myId].input = getInputs();
  }
}, 33);

const ctx = canvasEl.getContext('2d');
let W = innerWidth, H = innerHeight;
const DPR = Math.min(devicePixelRatio || 1, 2);
let cam = { x: 0, y: 0 };

function resize() {
  W = innerWidth; H = innerHeight;
  canvasEl.width = Math.floor(W * DPR);
  canvasEl.height = Math.floor(H * DPR);
  canvasEl.style.width = W + 'px';
  canvasEl.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

function drawGame(st, myId) {
  ctx.clearRect(0, 0, W, H);
  const me = st.players[myId];
  if (!me) return;

  // Camera
  cam.x += (me.x - cam.x) * 0.15;
  cam.y += (me.y - cam.y) * 0.15;

  // --- HIỆU ỨNG RUNG MÀN HÌNH ---
  let shakeX = 0, shakeY = 0;
  if (shakeTime > 0) {
    shakeTime -= 0.016; // Giảm dần theo thời gian
    shakeX = (Math.random() - 0.5) * shakeIntensity;
    shakeY = (Math.random() - 0.5) * shakeIntensity;
  }

  ctx.save();
  // Áp dụng độ rung vào ma trận vẽ
  ctx.translate(W / 2 - cam.x + shakeX, H / 2 - cam.y + shakeY);

  // Nền
  ctx.fillStyle = '#0b1017';
  ctx.fillRect(cam.x - W / 2 - 100, cam.y - H / 2 - 100, W + 200, H + 200);
  const g = 64;
  ctx.strokeStyle = 'rgba(60,130,100,0.10)';
  ctx.beginPath();
  const gx0 = Math.floor((cam.x - W / 2) / g) * g;
  const gy0 = Math.floor((cam.y - H / 2) / g) * g;
  for (let x = gx0; x <= cam.x + W / 2; x += g) {
    ctx.moveTo(x, cam.y - H / 2); ctx.lineTo(x, cam.y + H / 2);
  }
  for (let y = gy0; y <= cam.y + H / 2; y += g) {
    ctx.moveTo(cam.x - W / 2, y); ctx.lineTo(cam.x + W / 2, y);
  }
  ctx.stroke();

  // Vẽ vật phẩm
  for (const k of st.pickups) {
    ctx.save(); ctx.translate(k.x, k.y);
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(46,224,122,0.2)'; ctx.fill();
    ctx.strokeStyle = '#2ee07a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#2ee07a';
    ctx.fillRect(-4, -1, 8, 2); ctx.fillRect(-1, -4, 2, 8);
    ctx.restore();
  }

  // Vẽ quái
  for (const e of st.enemies) {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      const r = e.r * (0.8 + 0.2 * Math.sin(performance.now() * 0.01 + i));
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = e.color; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#000'; ctx.fillRect(-e.r, -e.r - 10, e.r*2, 4);
      ctx.fillStyle = '#ff5b6e'; ctx.fillRect(-e.r, -e.r - 10, e.r*2 * (e.hp/e.maxHp), 4);
    }
    ctx.restore();
  }

  // Vẽ đạn
  for (const b of st.bullets) {
    ctx.save();
    ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff8cc';
    ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Vẽ người chơi
  for (const id in st.players) {
    const p = st.players[id];
    if (p.hp <= 0) {
       ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha=0.4;
       ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
       ctx.restore();
       continue;
    }
    
    const isMe = (id === myId);
    const bodyCol = isMe ? '#5fbf7d' : '#6ba8ff';
    const stroke = isMe ? '#1e5233' : '#1e3a8a';

    ctx.save(); ctx.translate(p.x, p.y);
    
    // Thân
    ctx.save(); ctx.rotate(p.angle || 0);
    ctx.fillStyle = '#1c2530'; ctx.fillRect(-18, -18, 36, 8); ctx.fillRect(-18, 10, 36, 8);
    ctx.fillStyle = bodyCol; ctx.fillRect(-15, -12, 30, 24);
    ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(-15, -12, 30, 24);
    ctx.restore();

    // Nòng pháo
    ctx.save(); ctx.rotate(p.aim || 0);
    ctx.fillStyle = '#26473a'; ctx.fillRect(5, -4, 25, 8);
    ctx.fillStyle = bodyCol; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // Tên
    ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillStyle = isMe ? '#9df3c4' : '#8ecaff';
    ctx.fillText(p.name, 0, -30);
    
    // Máu
    ctx.fillStyle = '#000'; ctx.fillRect(-20, -22, 40, 4);
    ctx.fillStyle = '#2ee07a'; ctx.fillRect(-20, -22, 40 * (p.hp/100), 4);

    ctx.restore();
  }

  ctx.restore();

  // --- HIỆU ỨNG CHỚP ĐỎ ---
  if (hitFlash > 0) {
    hitFlash -= 0.05; // Mờ dần
    ctx.fillStyle = `rgba(255, 30, 30, ${hitFlash * 0.4})`;
    ctx.fillRect(0, 0, W, H);
  }
}

})();
</script>
</body>
</html>
