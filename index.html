<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tank Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--neon:#00f3ff;--green:#00ff66;--red:#ff0055;--gold:#ffcc00;--purple:#b46bff;--bg:#05080c;--panel:rgba(10,20,30,.92)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#dff5e8;font-family:'Rajdhani',system-ui,sans-serif;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;display:block;cursor:crosshair}
.hidden{display:none!important}
button{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:1px;cursor:pointer;border-radius:4px;text-transform:uppercase;transition:.15s;border:1px solid currentColor;background:rgba(255,255,255,.04);color:#fff}
button:active{transform:scale(.97)}
.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:radial-gradient(circle at 50% 40%,#0e1e26,#05080c);overflow-y:auto;text-align:center}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(30px,7vw,60px);letter-spacing:6px;color:#fff;text-shadow:0 0 15px var(--neon),0 0 40px var(--neon)}
.panel{background:var(--panel);border:1px solid rgba(0,243,255,.35);border-radius:6px;padding:20px;width:min(380px,92vw);display:flex;flex-direction:column;gap:10px}
.panel input{padding:13px;border-radius:4px;background:#000;border:1px solid rgba(0,243,255,.4);color:#fff;font-size:18px;text-align:center;font-family:inherit;outline:none}
.row{display:flex;justify-content:space-between;align-items:center;font-size:16px;border-bottom:1px dashed rgba(0,243,255,.15);padding:3px 0}
.row b{font-family:'Orbitron';color:var(--neon)}
.btn{padding:14px;width:min(380px,92vw);font-size:15px;color:var(--neon)}
.btn:hover{background:var(--neon);color:#000}
.btn.p{color:var(--purple)}.btn.p:hover{background:var(--purple)}
.btn.g{color:var(--gold)}.btn.g:hover{background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(380px,92vw)}
.grid2 button{padding:11px 6px;font-size:12px}
.sep{font-family:'Orbitron';font-size:11px;color:#5a7a8a}
#hud{position:fixed;inset:0;pointer-events:none;font-family:'Orbitron',sans-serif;z-index:10}
#hudL{position:absolute;left:16px;bottom:16px;width:240px;display:flex;flex-direction:column;gap:4px}
.bar{position:relative;height:16px;background:rgba(0,0,0,.65);border:1px solid rgba(0,243,255,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0}
.bar span{position:absolute;inset:0;font-size:10px;line-height:16px;text-align:center;text-shadow:0 1px 2px #000}
#hpF{background:linear-gradient(90deg,#ff0055,#ff5b6e)}#mpF{background:linear-gradient(90deg,#00f3ff,#88f3ff)}#xpF{background:linear-gradient(90deg,#ffcc00,#ffeeaa)}
#shF{position:absolute;top:0;left:0;background:rgba(255,255,255,.45)!important}
#botBar{margin-top:6px}#botF{background:linear-gradient(90deg,#b46bff,#e0c6ff)}
#scoreBox{position:absolute;top:14px;right:14px;background:var(--panel);border:1px solid rgba(0,243,255,.3);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;pointer-events:auto;min-width:130px}
#modeTag{font-size:11px;letter-spacing:2px;color:var(--neon);font-weight:800}
.sr{display:flex;justify-content:space-between;gap:14px;font-size:12px;color:#88a}.sr b{font-size:16px;color:#fff}
#scoreBox button{padding:6px;font-size:10px;margin-top:4px}
#goal{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--red);color:var(--red);padding:5px 16px;text-align:center;font-size:11px;border-radius:4px;min-width:150px}
#goal b{display:block;font-size:22px;line-height:1.1}
#goal .pb{height:4px;background:rgba(255,255,255,.1);margin-top:4px}#goal .pb i{display:block;height:100%;background:var(--neon);width:0}
#pus{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:40vw}
.pu{padding:4px 8px;background:rgba(0,0,0,.7);border:1px solid var(--gold);color:var(--gold);font-size:10px;border-radius:2px}.pu.bad{border-color:var(--red);color:var(--red)}
#mini{position:absolute;top:14px;left:14px;border:2px solid rgba(0,243,255,.5);border-radius:50%;background:rgba(5,10,15,.9)}
#skills{position:fixed;right:16px;bottom:16px;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:10px;width:230px;z-index:26}
.sk{position:relative;width:56px;height:56px;font-size:24px;background:rgba(10,20,30,.9);border:2px solid currentColor;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sk .cdo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);color:#fff;font-size:18px;font-family:Orbitron}
.sk.cd .cdo{display:flex}
.sk small{position:absolute;bottom:0;right:6px;font-size:9px;color:#fff;font-family:Orbitron}
.joy{position:fixed;bottom:22px;width:112px;height:112px;border-radius:50%;border:2px solid rgba(0,243,255,.35);background:rgba(0,243,255,.05);z-index:25;touch-action:none}
#joyL{left:20px}#joyR{right:20px;border-color:rgba(255,0,85,.4);background:rgba(255,0,85,.05)}
.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(0,243,255,.6);border:2px solid #fff;pointer-events:none}
#joyR .knob{background:rgba(255,0,85,.6)}
.ov{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,8,12,.88);text-align:center;padding:20px}
#ovT{font-size:clamp(36px,10vw,72px)}#ovA{font-size:20px}#ovA b{font-family:Orbitron;font-size:30px;color:var(--neon)}#ovB{opacity:.7;color:#88a}
.ovb{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.ovb button{padding:13px 30px;font-size:14px}
#settings{position:fixed;z-index:80;top:50%;left:50%;transform:translate(-50%,-50%);width:min(360px,92vw)}
#test{position:fixed;top:80px;right:14px;width:230px;max-height:calc(100vh - 100px);overflow-y:auto;background:var(--panel);border:2px solid var(--purple);border-radius:6px;padding:8px;z-index:45;display:flex;flex-direction:column;gap:6px}
#test .t{font-family:Orbitron;font-size:10px;color:var(--purple)}
#test .g{display:grid;grid-template-columns:1fr 1fr;gap:4px}#test button{padding:5px 3px;font-size:9px}
@media(max-width:700px){#hudL{width:170px;left:8px}#scoreBox{transform:scale(.8);transform-origin:top right;top:8px;right:8px}#mini{width:96px!important;height:96px!important;top:8px;left:8px}#goal{top:8px;transform:translateX(-50%) scale(.8)}#skills{width:160px;bottom:140px}.sk{width:46px;height:46px;font-size:20px}#test{width:190px}}
</style>
</head>
<body>
<div id="nameScr" class="screen">
  <h1>TANK ARENA</h1>
  <div class="panel">
    <div style="font-family:Orbitron;color:var(--neon);font-size:13px">NHẬP TÊN CHIẾN BINH</div>
    <input id="nameIn" maxlength="20" placeholder="TÊN CỦA BẠN...">
    <button id="nameOk" class="btn" style="width:100%">VÀO GAME</button>
    <div id="nameMsg" style="color:var(--red);min-height:18px;font-size:13px"></div>
  </div>
</div>
<div id="menuScr" class="screen hidden">
  <h1>TANK ARENA</h1>
  <div class="panel">
    <div class="row"><span>CHIẾN BINH</span><b id="mUser">-</b></div>
    <div class="row"><span>KỶ LỤC PVE</span><b id="mHi">0</b></div>
    <div class="row"><span>THẮNG BOT</span><b id="mWins">0</b></div>
  </div>
  <button class="btn" data-start="pve">▶ CHIẾN DỊCH (PVE)</button>
  <button class="btn p" data-start="spectate">👁 XEM BOT TỰ ĐỘNG</button>
  <button class="btn g" data-start="test">🧪 THỬ NGHIỆM</button>
  <div class="sep">— ĐẤU VỚI BOT —</div>
  <div class="grid2">
    <button data-start="duel" data-d="easy" style="color:var(--green)">DỄ</button>
    <button data-start="duel" data-d="normal" style="color:var(--neon)">BÌNH THƯỜNG</button>
    <button data-start="duel" data-d="hard" style="color:var(--gold)">KHÁ</button>
    <button data-start="duel" data-d="insane" style="color:var(--red)">SIÊU KHÓ</button>
  </div>
  <div style="display:flex;gap:10px"><button id="chName" style="padding:9px 16px;font-size:11px;color:#7a9a92">ĐỔI TÊN</button><button class="openSet" style="padding:9px 16px;font-size:11px;color:#7a9a92">CÀI ĐẶT</button></div>
</div>

<canvas id="game" class="hidden"></canvas>
<div id="hud" class="hidden">
  <canvas id="mini" width="140" height="140" style="width:140px;height:140px"></canvas>
  <div id="goal" class="hidden">MỤC TIÊU CÒN<b id="goalN">0</b><div class="pb"><i id="goalP"></i></div></div>
  <div id="pus"></div>
  <div id="hudL">
    <div class="bar"><i id="hpF"></i><i id="shF"></i><span id="hpT"></span></div>
    <div class="bar"><i id="mpF"></i><span id="mpT"></span></div>
    <div class="bar" id="xpBar" style="height:12px"><i id="xpF"></i><span id="xpT" style="line-height:12px;font-size:9px"></span></div>
    <div class="bar hidden" id="botBar"><i id="botF"></i><span id="botT"></span></div>
  </div>
  <div id="scoreBox">
    <span id="modeTag">CHIẾN DỊCH</span>
    <div class="sr"><span>ĐIỂM</span><b id="scoreV">0</b></div>
    <div class="sr" id="waveRow"><span>MÀN</span><b id="waveV">1</b></div>
    <div style="display:flex;gap:4px"><button id="btnPause" style="flex:1;color:#fff">☰</button><button class="openSet" style="flex:1;color:#fff">⚙</button></div>
  </div>
</div>
<div id="skills" class="hidden"></div>
<div id="joyL" class="joy hidden"><div class="knob"></div></div>
<div id="joyR" class="joy hidden"><div class="knob"></div></div>

<div id="test" class="hidden">
  <div class="t">👹 BOSS</div><div class="g" id="tBoss"></div>
  <div class="t">👾 QUÁI</div><div class="g" id="tEn"></div>
  <div class="t">🎁 POWERUP</div><div class="g" id="tPu"></div>
  <div class="t">🛠 TIỆN ÍCH</div><div class="g" id="tUt"></div>
</div>

<div id="pauseOv" class="ov hidden">
  <h1 style="font-size:40px">TẠM DỪNG</h1>
  <div style="display:flex;flex-direction:column;gap:10px;width:min(300px,80vw)">
    <button id="bResume" class="btn" style="width:100%">▶ TIẾP TỤC</button>
    <button class="btn g openSet" style="width:100%">⚙ CÀI ĐẶT</button>
    <button id="bExit" class="btn" style="width:100%;color:var(--red)">✖ THOÁT</button>
  </div>
</div>
<div id="endOv" class="ov hidden">
  <h1 id="ovT">GAME OVER</h1>
  <p id="ovA"></p><p id="ovB"></p>
  <div class="ovb"><button id="bAgain" style="color:var(--green)">CHƠI LẠI</button><button id="bMenu" style="color:#fff">VỀ MENU</button></div>
</div>
<div id="settings" class="panel hidden">
  <div style="font-family:Orbitron;color:var(--neon);text-align:center;letter-spacing:2px">CÀI ĐẶT</div>
  <div class="row"><span>Âm thanh</span><button id="setSnd" style="padding:6px 14px;font-size:11px"></button></div>
  <div class="row"><span>Rung màn hình</span><button id="setShk" style="padding:6px 14px;font-size:11px"></button></div>
  <button id="setClose" class="btn" style="width:100%;color:#ccc">ĐÓNG</button>
</div>

<script>
(()=>{
'use strict';
/* ============ TIỆN ÍCH ============ */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=d=>{while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let user=store.get('ta2_name','');
let scores=store.get('ta2_scores',{});
const cfg=Object.assign({sound:true,shake:true},store.get('ta2_cfg',{}));

/* ============ ÂM THANH ============ */
let AC=null;const lastSnd={};
const SND={shoot:['square',400,100,.04,.1],hit:['sawtooth',200,50,.08,.1],hurt:['triangle',100,30,.18,.2],pickup:['sine',600,1200,.1,.2],level:['square',400,1600,.14,.4],boom:['sawtooth',80,20,.3,.5],laser:['sawtooth',1200,200,.12,.3],skill:['sine',500,1500,.14,.3],win:['square',800,200,.22,.7],lose:['sawtooth',200,40,.22,.8],nomana:['square',120,80,.1,.15],charge:['square',200,900,.13,.5]};
function audioInit(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function sfx(n){if(!cfg.sound||!AC)return;const s=SND[n];if(!s)return;const t=AC.currentTime;if(lastSnd[n]&&t-lastSnd[n]<.06)return;lastSnd[n]=t;
  const o=AC.createOscillator(),g=AC.createGain();o.type=s[0];o.frequency.setValueAtTime(s[1],t);o.frequency.exponentialRampToValueAtTime(s[2],t+s[4]);
  g.gain.setValueAtTime(s[3],t);g.gain.exponentialRampToValueAtTime(.001,t+s[4]);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+s[4]);}

/* ============ DỮ LIỆU ============ */
const MANA_REGEN=32,BOT_REGEN=18,COST_SHOT=4,COST_BOT_SHOT=3,COST_LASER=16,COST_BOMB=20;
const SKILLS={
  charge:{n:'LAO TỚI',c:'#b46bff',i:'🐂',cd:10,mp:15},
  flame:{n:'PHUN LỬA',c:'#ff8c1a',i:'🔥',cd:8,mp:20},
  freeze:{n:'BĂNG GIÁ',c:'#00f3ff',i:'❄',cd:9,mp:18},
  drain:{n:'HÚT MÁU',c:'#ff0055',i:'🩸',cd:14,mp:25},
  split:{n:'PHÂN THÂN',c:'#00ff66',i:'🧬',cd:18,mp:30},
  laser:{n:'TIA LAZE',c:'#ffcc00',i:'⚡',cd:14,mp:30},
  nuke:{n:'BOM HẠT NHÂN',c:'#88ff00',i:'☢',cd:20,mp:40},
  invis:{n:'TÀNG HÌNH',c:'#9a7aff',i:'👻',cd:14,mp:28},
  teleport:{n:'DỊCH CHUYỂN',c:'#ff40a0',i:'💫',cd:10,mp:22}
};
const SKEYS=Object.keys(SKILLS);
const BOT_CFG={
  easy:{name:'BOT DỄ',color:'#00ff66',spd:.6,jit:.55,range:500,dodge:0,lead:0,rate:.55,dmg:5,ideal:450,hp:70,aim:.15},
  normal:{name:'BOT THƯỜNG',color:'#00f3ff',spd:.8,jit:.28,range:650,dodge:140,lead:.2,rate:.36,dmg:8,ideal:380,hp:90,aim:.22},
  hard:{name:'BOT KHÁ',color:'#ffcc00',spd:.95,jit:.16,range:800,dodge:220,lead:.5,rate:.26,dmg:12,ideal:330,hp:110,aim:.3},
  insane:{name:'BOT SIÊU KHÓ',color:'#ff0055',spd:1.1,jit:.08,range:900,dodge:280,lead:.7,rate:.2,dmg:14,ideal:320,hp:130,aim:.42},
  spectator:{name:'BOT AI',color:'#b46bff',spd:1.05,jit:.05,range:850,dodge:260,lead:.5,rate:.14,dmg:18,ideal:380,hp:150,aim:.4}
};
const DIFF_VI={easy:'DỄ',normal:'BÌNH THƯỜNG',hard:'KHÁ',insane:'SIÊU KHÓ'};
const TYPES=[
  {beh:'chase',hp:30,spd:80,r:14,dmg:10,score:10,xp:1,c:'#ff5b6e',s:'#8a1f35'},
  {beh:'zig',hp:24,spd:110,r:12,dmg:8,score:12,xp:1,c:'#ff8c1a',s:'#a04d00'},
  {beh:'chase',hp:90,spd:55,r:26,dmg:20,score:30,xp:3,c:'#ff0055',s:'#8a1f35'},
  {beh:'shoot',hp:40,spd:70,r:16,dmg:8,score:20,xp:2,c:'#b46bff',s:'#6a2f9e'},
  {beh:'split',hp:45,spd:75,r:18,dmg:12,score:25,xp:2,c:'#ff66b2',s:'#8a1f4d'},
  {beh:'zig',hp:35,spd:130,r:13,dmg:10,score:18,xp:2,c:'#00f3ff',s:'#1b6a8a'}
];
const BOSSES=[
  {name:'BULL',c:'#b46bff',s:'#6a2f9e',r:50,hp:2400,spd:95,dmg:32,xp:40,sk:'charge'},
  {name:'FLAME',c:'#ff8c1a',s:'#a04d00',r:48,hp:2100,spd:88,dmg:26,xp:40,sk:'flame'},
  {name:'FROST',c:'#00f3ff',s:'#1b6a8a',r:48,hp:2250,spd:92,dmg:24,xp:40,sk:'freeze'},
  {name:'DRAIN',c:'#ff0055',s:'#8a1f35',r:50,hp:2300,spd:88,dmg:22,xp:40,sk:'drain'},
  {name:'CLONE',c:'#ff66b2',s:'#8a1f4d',r:54,hp:2550,spd:82,dmg:28,xp:40,sk:'split'},
  {name:'LASER',c:'#ffcc00',s:'#a08a00',r:52,hp:2400,spd:78,dmg:30,xp:40,sk:'laser'},
  {name:'NUKE',c:'#88ff00',s:'#446600',r:54,hp:2700,spd:72,dmg:36,xp:50,sk:'nuke'},
  {name:'GHOST',c:'#9a7aff',s:'#4a3a8a',r:50,hp:2200,spd:85,dmg:25,xp:45,sk:'invis'},
  {name:'WARP',c:'#ff40a0',s:'#8a1a50',r:52,hp:2000,spd:70,dmg:28,xp:45,sk:'teleport'}
];
const PU_GOOD=['laser','bomb','shield','speed','pierce','triple','magnet'];
const PU_BAD=['curse','slow','burn','confuse','freeze','jam'];
const PU_ICON={laser:'⚡',bomb:'💣',shield:'🛡',speed:'»',pierce:'➤',triple:'⋔',magnet:'🧲',curse:'☠',slow:'🐌',burn:'🔥',confuse:'🌀',freeze:'❄',jam:'✖'};
const xpNeed=l=>5+(l-1)*3;

/* ============ TRẠNG THÁI ============ */
let S=null,paused=false,pausedBySet=false,last=0,W=innerWidth,H=innerHeight;
const cam={x:0,y:0};
const cv=$('game'),ctx=cv.getContext('2d'),mini=$('mini'),mctx=mini.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

function mkTank(id,name){
  return{id,name,isTank:true,x:0,y:0,r:20,hp:100,maxHp:100,mana:100,maxMana:100,aim:0,ang:0,dmg:14,rate:.18,bspd:1000,
    lvl:1,xp:0,score:0,pu:{},shield:0,lastShot:0,lastLaser:0,lastBomb:0,skills:[],cd:{},frozen:0,burnT:0,nuke:0,nukeT:0,invis:0,inv:0,
    kx:0,ky:0,ch:null,drain:0,input:{x:0,y:0,aim:0,shoot:false},isBot:false,bot:null,flash:0,manaFlash:0,vx:0,vy:0,px:0,py:0,lvFlash:0,sa:undefined,smx:0,smy:0,botT:0,jit:0,seed:Math.random()*10};
}
function giveSkills(p,n,exclude=[]){
  const ks=SKEYS.filter(k=>!exclude.includes(k));
  for(let i=ks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ks[i],ks[j]]=[ks[j],ks[i]];}
  p.skills=ks.slice(0,n);p.cd={};p.skills.forEach(k=>p.cd[k]=0);
}
function makeBot(p,key){const c=BOT_CFG[key];p.isBot=true;p.bot=c;p.name=c.name;p.maxHp=p.hp=c.hp;p.rate=c.rate;p.dmg=c.dmg;p.jit=c.jit;}

function newGame(mode,diff){
  S={mode,diff,t:0,wave:1,over:false,spectate:false,R:mode==='duel'?700:3000,tanks:[],enemies:[],bullets:[],eb:[],pk:[],fx:[],beams:[],nukes:[],
    ann:null,queue:[],total:0,waveOn:false,clear:0,lastBoss:-1,hit:0,nflash:0,shakeT:0,shakeI:0,pkT:2,inv:false};
  const me=mkTank('me',user||'Player');S.me=me;S.tanks.push(me);
  $('botBar').classList.add('hidden');
  $('xpBar').classList.remove('hidden');$('waveRow').classList.remove('hidden');
  if(mode==='duel'){
    const bot=mkTank('bot','BOT');makeBot(bot,diff);S.tanks.push(bot);
    me.rate=.13;me.bspd=1300;me.x=-350;bot.x=350;
    giveSkills(me,3,['split']);giveSkills(bot,3,['split']);
    $('botBar').classList.remove('hidden');$('xpBar').classList.add('hidden');$('waveRow').classList.add('hidden');
    $('modeTag').textContent='⚔ '+DIFF_VI[diff];$('modeTag').style.color=BOT_CFG[diff].color;
    ann('VS '+bot.name,2.5);
  }else if(mode==='test'){
    me.maxHp=me.hp=500;me.maxMana=me.mana=500;me.dmg=30;me.rate=.12;me.bspd=1400;giveSkills(me,3);
    S.inv=true;$('modeTag').textContent='🧪 THỬ NGHIỆM';$('modeTag').style.color='var(--gold)';
    ann('🧪 CHẾ ĐỘ THỬ NGHIỆM',2.5);
  }else if(mode==='spectate'){
    S.spectate=true;makeBot(me,'spectator');me.name='BOT AI';me.bspd=1200;
    $('modeTag').textContent='👁 XEM BOT';$('modeTag').style.color='var(--purple)';
    startWave();
  }else{
    $('modeTag').textContent='🎯 CHIẾN DỊCH';$('modeTag').style.color='var(--neon)';
    startWave();
  }
  buildSkillBar();
}
function ann(text,t=2){S.ann={text,t,max:t};}

/* ============ SINH QUÁI / MÀN ============ */
function startWave(){
  const w=S.wave,total=Math.min(90,10+w*4),avail=[0];
  if(w>=2)avail.push(4);if(w>=3)avail.push(1);if(w>=4)avail.push(3);if(w>=5)avail.push(5);if(w>=6)avail.push(2);
  S.queue=[];
  for(let i=0;i<total;i++){let t=pick(avail);if(Math.random()<.05+w*.015)t=2;S.queue.push(t);}
  const boss=w>=3&&w%3===0;
  S.total=total+(boss?1:0);S.spawnT=.3;S.waveOn=true;S.clear=0;
  if(boss)spawnBoss();
  ann('MÀN '+w,2);
}
function scaling(w){return{hp:1+(w-1)*.2,dmg:1+(w-1)*.06,spd:1+(w-1)*.02,rw:1+(w-1)*.1};}
function mkEnemy(ti,w,x,y){
  const t=TYPES[ti],sc=scaling(w);
  return{x,y,beh:t.beh,hp:t.hp*sc.hp,maxHp:t.hp*sc.hp,spd:t.spd*sc.spd,r:t.r,dmg:t.dmg*sc.dmg,score:Math.round(t.score*sc.rw),xp:Math.max(1,Math.round(t.xp*sc.rw)),
    color:t.c,stroke:t.s,flash:0,wob:rnd(0,100),spawn:.4,seed:rnd(0,10),atk:rnd(1,3),invis:0,frozen:0,burn:0,bk:0,idx:ti};
}
function spawnPos(dMin,pad){
  const me=S.me,a=Math.random()<.35?me.aim+rnd(-.6,.6):rnd(0,TAU),d=dMin+rnd(0,260);
  const p={x:me.x+Math.cos(a)*d,y:me.y+Math.sin(a)*d,r:pad};inArena(p,10);return p;
}
function spawnEnemy(ti,w){
  if(S.enemies.length>=150)return;
  const p=spawnPos(Math.hypot(W,H)/2+120,TYPES[ti].r);
  S.enemies.push(mkEnemy(ti,w,p.x,p.y));
}
function spawnBoss(idx){
  const me=S.me;
  if(idx===undefined){idx=Math.floor(Math.random()*BOSSES.length);if(idx===S.lastBoss)idx=(idx+1+Math.floor(Math.random()*(BOSSES.length-1)))%BOSSES.length;S.lastBoss=idx;}
  const b=BOSSES[idx],lv=Math.min(100,me.lvl+2);
  const hp=Math.round(b.hp*.8+350+(lv-1)*500),dmg=Math.round(b.dmg*.8+(lv-1)*3);
  const p=spawnPos(Math.hypot(W,H)/2+180,b.r+60);
  S.enemies.push({x:p.x,y:p.y,boss:true,bt:idx,name:b.name,color:b.c,stroke:b.s,r:b.r,hp,maxHp:hp,spd:b.spd*(1+(lv-1)*.012),dmg,score:500+lv*80,xp:b.xp,lvl:lv,
    flash:0,wob:rnd(0,100),spawn:.8,seed:rnd(0,10),invis:0,frozen:0,burn:0,st:'idle',t1:rnd(1.5,2.5),t2:rnd(3,5),dx:0,dy:0,la:0,hitDone:false,tx:0,ty:0});
  sfx('pickup');ann('BOSS '+b.name+' XUẤT HIỆN!',2.5);
}
function inArena(o,pad=0){const R=S.R-pad-(o.r||0),d=Math.hypot(o.x,o.y);if(d>R){o.x*=R/d;o.y*=R/d;}}

/* ============ SÁT THƯƠNG / DANH SÁCH MỤC TIÊU ============ */
const immune=e=>e.boss&&e.bt===0&&e.st==='wind';
function hostiles(p){
  if(S.mode==='duel')return S.tanks.filter(t=>t!==p&&t.hp>0);
  return S.enemies.filter(e=>!e.ally&&e.hp>0&&!immune(e));
}
function hurt(t,d,src,cont){
  if(t.hp<=0||d<=0)return;
  if(t.isTank){
    if(!cont&&t.inv>0)return;
    if(t.shield>0){const a=Math.min(t.shield,d);t.shield-=a;d-=a;if(t.shield<=0){t.shield=0;t.pu.shield=0;}}
    if(d>0){t.hp-=d;if(t===S.me&&!S.spectate){if(cont){S.hit=Math.max(S.hit,.2);if(Math.random()<.1)sfx('hurt');}else{S.hit=1;S.shakeT=.25;S.shakeI=12;sfx('hurt');}}}
    if(S.inv&&t===S.me&&t.hp<1)t.hp=1;
  }else{
    t.hp-=d;t.flash=.1;
    if(t.hp<=0)kill(t,src);
  }
}
function kill(e,src){
  const i=S.enemies.indexOf(e);if(i<0)return;
  S.enemies.splice(i,1);e.hp=0;
  burst(e.x,e.y,e.color||'#fff',e.boss?40:10,e.boss?500:200);
  sfx(e.boss?'boom':'hit');
  if(e.boss){S.shakeT=.5;S.shakeI=20;}
  if(e.ally)return;
  if(S.waveOn)S.killed=(S.killed||0)+1;
  const me=S.me;
  if(e.beh==='split'&&!e.child){
    for(let k=0;k<2;k++){const c=mkEnemy(0,S.wave,e.x+rnd(-20,20),e.y+rnd(-20,20));c.r=10;c.hp=c.maxHp=e.maxHp*.4;c.color=e.color;c.stroke=e.stroke;c.child=true;c.score=3;c.xp=0;c.spawn=.1;S.enemies.push(c);}
    if(S.waveOn)S.total+=2;
  }
  if(S.mode==='duel')return;
  me.score+=e.score||0;
  const orbs=e.boss?8:Math.min(3,Math.max(1,e.xp||1)),per=Math.max(1,Math.ceil((e.xp||0)/orbs));
  if(e.xp>0)for(let k=0;k<orbs;k++){if(S.pk.length>350)break;S.pk.push({type:'xp',x:e.x+rnd(-20,20),y:e.y+rnd(-20,20),v:per,bob:rnd(0,10),life:30,vx:rnd(-80,80),vy:rnd(-80,80)});}
  if(Math.random()<(e.boss?.9:.15))spawnPowerup(e.x+rnd(-30,30),e.y+rnd(-30,30));
  if(e.boss&&S.mode==='pve'&&Math.random()<.75){
    const k=BOSSES[e.bt].sk;
    if(!me.skills.includes(k)){me.skills.push(k);me.cd[k]=0;buildSkillBar();ann('✨ HỌC ĐƯỢC: '+SKILLS[k].n,2.5);}
  }
}
function burst(x,y,c,n,sp){
  for(let i=0;i<n&&S.fx.length<300;i++){const a=rnd(0,TAU),s=sp*rnd(.4,1.2);S.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.35,.7),m:.7,c,r:rnd(2,5)});}
}
function knock(t,nx,ny,f){t.kx+=nx*f;t.ky+=ny*f;}

/* ============ POWERUP / XP ============ */
function spawnPowerup(x,y,type){
  const p={x,y,r:0};inArena(p,40);
  const bad=type?PU_BAD.includes(type):Math.random()<.35;
  S.pk.push({type:type||pick(bad?PU_BAD:PU_GOOD),bad,x:p.x,y:p.y,bob:rnd(0,10),life:type?60:22,vx:0,vy:0});
}
function applyPickup(p,k){
  if(k.type==='xp'){
    p.xp+=k.v;sfx('pickup');
    while(p.xp>=xpNeed(p.lvl)){p.xp-=xpNeed(p.lvl);p.lvl++;p.lvFlash=1;p.maxHp+=15;p.hp=Math.min(p.maxHp,p.hp+30);p.dmg+=2;p.maxMana+=10;p.mana=p.maxMana;burst(p.x,p.y,'#ffd93d',20,300);sfx('level');}
    return;
  }
  p.pu[k.type]=Math.max(p.pu[k.type]||0,k.bad?6:8);
  if(k.type==='shield')p.shield=40;
  sfx(k.bad?'hurt':'pickup');burst(p.x,p.y,k.bad?'#ff0055':'#00ff66',15,250);
}
function updatePickups(dt){
  const me=S.me;
  for(let i=S.pk.length-1;i>=0;i--){
    const k=S.pk[i];k.life-=dt;k.bob+=dt*4;
    if(k.life<=0){S.pk.splice(i,1);continue;}
    if(k.vx||k.vy){k.x+=k.vx*dt;k.y+=k.vy*dt;k.vx*=.9;k.vy*=.9;}
    k.mag=false;
    if(me.hp>0&&!(k.bad)){
      const mp=me.pu.magnet>0,range=k.type==='xp'?(mp?600:90):(mp?600:0);
      const d=dist(me,k);
      if(range>0&&d<range&&d>1){k.mag=true;const sp=400*(1-d/range)+150;k.x+=(me.x-k.x)/d*sp*dt;k.y+=(me.y-k.y)/d*sp*dt;}
    }
    for(const p of S.tanks){
      if(p.hp<=0)continue;
      if(dist(p,k)<(k.type==='xp'?34:32)){applyPickup(p,k);S.pk.splice(i,1);break;}
    }
  }
}

/* ============ BẮN / KỸ NĂNG ============ */
function fireB(p,a,spd,dmg,o={}){
  if(S.bullets.length>=260)return;
  S.bullets.push(Object.assign({x:p.x+Math.cos(a)*28,y:p.y+Math.sin(a)*28,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1.2,owner:p.id,dmg,hit:[],r:6},o));
}
function shoot(p){
  let rate=p.rate*(p.pu.jam>0?2:1);
  if(S.t-p.lastShot<=rate)return;
  const cost=p.isBot?COST_BOT_SHOT:COST_SHOT;
  p.lastShot=S.t;
  if(p.mana<cost){if(!p.isBot){p.manaFlash=1;sfx('nomana');}return;}
  p.mana-=cost;
  let dmg=p.dmg+(p.pu.pierce>0?10:0);if(p.pu.curse>0)dmg*=.8;
  const offs=p.pu.triple>0?[-.18,0,.18]:[0];
  for(const o of offs)fireB(p,p.aim+o+(p.jit?(Math.random()-.5)*p.jit:0),p.bspd,dmg,{pierce:p.pu.pierce>0,color:p.isBot&&p.id!=='me'?'#ff5b6e':null});
  if(p.pu.laser>0&&S.t-p.lastLaser>.4&&p.mana>=COST_LASER){p.mana-=COST_LASER;p.lastLaser=S.t;laserShot(p);}
  if(p.pu.bomb>0&&S.t-p.lastBomb>.8&&p.mana>=COST_BOMB){p.mana-=COST_BOMB;p.lastBomb=S.t;bomb(p,p.x+Math.cos(p.aim)*260,p.y+Math.sin(p.aim)*260);}
  sfx('shoot');
}
function laserShot(p){
  const c=Math.cos(p.aim),s=Math.sin(p.aim);
  for(const e of hostiles(p)){const dx=e.x-p.x,dy=e.y-p.y,pr=dx*c+dy*s;if(pr<0||pr>2000)continue;if(Math.abs(-dx*s+dy*c)<6+e.r){hurt(e,40,p);burst(e.x,e.y,'#4dd9ff',3,150);}}
  S.beams.push({kind:'thin',x:p.x,y:p.y,a:p.aim,life:.15,max:.15});sfx('laser');
}
function bomb(p,x,y){
  for(const e of hostiles(p))if(dist(e,{x,y})<120+e.r){hurt(e,60,p);burst(e.x,e.y,'#ff8c1a',6,200);}
  S.beams.push({kind:'bomb',x,y,r:120,life:.4,max:.4});burst(x,y,'#ff8c1a',30,400);sfx('boom');S.shakeT=.3;S.shakeI=12;
}
const SK={
  charge(p,a){p.ch={st:'wind',t:1.2,dx:Math.cos(a),dy:Math.sin(a),hit:[],sc:.6};sfx('charge');},
  flame(p,a){for(let k=-2;k<=2;k++)fireB(p,a+k*.18,700,p.dmg*3,{fire:true,pierce:true,life:1.2,r:10,color:'#ff8c1a'});},
  freeze(p,a){for(let k=0;k<6;k++)fireB(p,a+k/6*TAU,500,p.dmg*2,{freeze:2.5,life:2.5,r:9,color:'#4dd9ff'});},
  drain(p){p.drain=1.5;},
  split(p){
    const hp=100+p.lvl*20;
    for(let k=0;k<2;k++){const a=rnd(0,TAU),q={x:p.x+Math.cos(a)*60,y:p.y+Math.sin(a)*60,r:18};inArena(q);
      S.enemies.push({x:q.x,y:q.y,ally:true,hp,maxHp:hp,spd:200,r:18,dmg:p.dmg*.7,color:'#2ee07a',stroke:'#0a5a2e',flash:0,wob:0,spawn:.3,seed:rnd(0,10),atk:1,aim:0,life:7,maxLife:7,sc:.3,owner:p.id,invis:0});}
    burst(p.x,p.y,'#2ee07a',25,350);
  },
  laser(p,a){S.beams.push({kind:'wide',x:p.x,y:p.y,a,life:1.2,max:1.2,hw:60,dps:p.dmg*8,owner:p});},
  nuke(p,a){S.nukes.push({x:p.x+Math.cos(a)*350,y:p.y+Math.sin(a)*350,R:250,t:3,max:3,owner:p});},
  invis(p){p.invis=4;},
  teleport(p,a){
    const o={x:p.x,y:p.y};
    const n={x:p.x+Math.cos(a)*450,y:p.y+Math.sin(a)*450,r:p.r};inArena(n);p.x=n.x;p.y=n.y;p.inv=Math.max(p.inv,.4);
    for(const e of hostiles(p)){if(dist(e,o)<110+e.r||dist(e,p)<110+e.r)hurt(e,p.dmg*3,p);}
    burst(o.x,o.y,'#ff40a0',20,350);burst(p.x,p.y,'#ff40a0',20,350);
    S.beams.push({kind:'ring',x:o.x,y:o.y,r:110,life:.5,max:.5,c:'#ff40a0'},{kind:'ring',x:p.x,y:p.y,r:110,life:.5,max:.5,c:'#ff40a0'});
  }
};
const SK_MSG={charge:'🐂 LAO TỚI!',drain:'🩸 HÚT MÁU!',split:'🧬 PHÂN THÂN!',laser:'⚡ TIA LAZE!',nuke:'☢ BOM HẠT NHÂN ĐÃ ĐẶT!',invis:'👻 TÀNG HÌNH!',teleport:'💫 DỊCH CHUYỂN!'};
function cast(p,key,aimOverride){
  if(!S||S.over||p.hp<=0||p.frozen>0)return;
  const sk=SKILLS[key];if(!sk||(p.cd[key]||0)>0)return;
  if(p.ch)return;
  if(p.mana<sk.mp){p.manaFlash=1;if(!p.isBot)sfx('nomana');return;}
  p.mana-=sk.mp;p.cd[key]=sk.cd;
  const a=aimOverride!==undefined?aimOverride:p.aim;
  SK[key](p,a);
  if(!p.isBot||S.spectate){sfx('skill');if(SK_MSG[key])ann(SK_MSG[key],1.2);if(key==='laser'){S.shakeT=.4;S.shakeI=16;}}
}

/* ============ CẬP NHẬT NGƯỜI CHƠI ============ */
function updateTank(p,dt){
  if(p.hp<=0)return;
  p.vx=(p.x-p.px)/(dt||1);p.vy=(p.y-p.py)/(dt||1);
  for(const k in p.pu)if(p.pu[k]>0)p.pu[k]=Math.max(0,p.pu[k]-dt);
  for(const k in p.cd)if(p.cd[k]>0)p.cd[k]=Math.max(0,p.cd[k]-dt);
  p.inv=Math.max(0,p.inv-dt);p.lvFlash=Math.max(0,p.lvFlash-dt);p.manaFlash=Math.max(0,p.manaFlash-dt);
  p.invis=Math.max(0,p.invis-dt);p.frozen=Math.max(0,p.frozen-dt);
  p.mana=Math.min(p.maxMana,p.mana+(p.isBot?BOT_REGEN:MANA_REGEN)*(p.pu.curse>0?.5:1)*dt);
  if(p.pu.burn>0){p.burnT+=dt;if(p.burnT>=.5){p.burnT=0;hurt(p,1.5,null,true);burst(p.x,p.y,'#ff3a1a',2,80);}}
  if(p.nuke>0){p.nuke-=dt;p.nukeT+=dt;if(p.nukeT>=.5){p.nukeT=0;hurt(p,p.maxHp*.02,null,true);burst(p.x,p.y,'#88ff00',3,100);}}
  if(p.drain>0){
    p.drain-=dt;let tot=0;
    for(const e of hostiles(p)){if(dist(p,e)<350+e.r){const d=p.dmg*2.5*dt;hurt(e,d,p,true);tot+=d;if(Math.random()<.2)S.fx.push({x:e.x,y:e.y,vx:(p.x-e.x),vy:(p.y-e.y),l:.4,m:.4,c:'#ff4d6d',r:4});}}
    p.hp=Math.min(p.maxHp,p.hp+tot*.6);
  }
  if(p.hp<=0)return;
  if(p.ch){updateCharge(p,dt);p.px=p.x;p.py=p.y;return;}
  let ix=p.input.x,iy=p.input.y;
  if(p.frozen>0){ix=iy=0;}
  if(p.pu.confuse>0){ix=-ix;iy=-iy;}
  let sm=1;if(p.pu.speed>0)sm*=1.6;if(p.pu.slow>0)sm*=.6;if(p.pu.freeze>0)sm*=.35;if(p.frozen>0)sm=0;if(p.bot)sm*=p.bot.spd;
  const len=Math.hypot(ix,iy);
  if(len>0){p.x+=ix/len*280*sm*dt;p.y+=iy/len*280*sm*dt;p.ang=Math.atan2(iy,ix);}
  p.aim=p.input.aim;
  if(p.kx||p.ky){p.x+=p.kx*dt;p.y+=p.ky*dt;const d=Math.exp(-6*dt);p.kx*=d;p.ky*=d;if(Math.abs(p.kx)<5)p.kx=0;if(Math.abs(p.ky)<5)p.ky=0;}
  inArena(p);
  if(p.frozen<=0&&p.input.shoot)shoot(p);
  p.px=p.x;p.py=p.y;
}
function updateCharge(p,dt){
  const c=p.ch;c.t-=dt;
  if(c.st==='wind'){
    if(!p.isBot&&touch.aimOn&&Math.hypot(touch.ax,touch.ay)>.2){c.dx=Math.cos(Math.atan2(touch.ay,touch.ax));c.dy=Math.sin(Math.atan2(touch.ay,touch.ax));}
    else{c.dx=Math.cos(p.aim);c.dy=Math.sin(p.aim);}
    p.x+=Math.cos(S.t*40)*1.5;p.y+=Math.sin(S.t*40)*1.5;
    c.sc-=dt;
    if(c.sc<=0){c.sc=.6;const a=Math.atan2(c.dy,c.dx);for(let k=-1;k<=1;k++)fireB(p,a+k*.3,700,p.dmg,{color:'#ff4dff',r:7});sfx('shoot');}
    if(c.t<=0){c.st='dash';c.t=.55;sfx('boom');}
  }else if(c.st==='dash'){
    const ox=p.x,oy=p.y;p.x+=c.dx*900*dt;p.y+=c.dy*900*dt;inArena(p);
    const sx=p.x-ox,sy=p.y-oy,sl=sx*sx+sy*sy;
    for(const e of hostiles(p)){
      if(c.hit.includes(e))continue;
      const t=sl>0?clamp(((e.x-ox)*sx+(e.y-oy)*sy)/sl,0,1):0;
      if(Math.hypot(ox+sx*t-e.x,oy+sy*t-e.y)<p.r+e.r+50){
        c.hit.push(e);hurt(e,p.dmg*5,p);burst(e.x,e.y,'#b46bff',8,250);S.shakeT=.25;S.shakeI=16;
        if(e.isTank)knock(e,c.dx,c.dy,900);else{e.x+=c.dx*80;e.y+=c.dy*80;inArena(e);}
      }
    }
    if(c.t<=0){c.st='rec';c.t=.8;}
  }else{
    p.x+=c.dx*60*dt;p.y+=c.dy*60*dt;inArena(p);
    if(c.t<=0)p.ch=null;
  }
}

/* ============ ĐẠN ============ */
function updateBullets(dt){
  for(let i=S.bullets.length-1;i>=0;i--){
    const b=S.bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){S.bullets.splice(i,1);continue;}
    let used=false;
    const targets=S.mode==='duel'?S.tanks.filter(t=>t.id!==b.owner&&t.hp>0):S.enemies;
    for(const e of targets){
      if(e.ally||e.hp<=0||immune(e)||b.hit.includes(e))continue;

        hurt(e,b.dmg,S.me);burst(b.x,b.y,'#fff8cc',2,120);sfx('hit');
        if(b.freeze){if(e.isTank){e.frozen=b.freeze;burst(e.x,e.y,'#4dd9ff',10,250);}else if(e.boss)e.frozen=Math.min(1,(e.frozen||0)+.3);else e.frozen=(e.frozen||0)+b.freeze;}

}

function updateEnemies(dt){

    let tg=null,md=1e9;
    for(const t of S.tanks){if(t.hp<=0||t.invis>0)continue;const d=dist(e,t);if(d<md){md=d;tg=t;}}
    for(const a of S.enemies){if(!a.ally||a.hp<=0)continue;const d=dist(e,a);if(d<md){md=d;tg=a;}}
    if(!tg){e.wd=(!e.wd||Math.random()<.02)?rnd(0,TAU):e.wd;e.x+=Math.cos(e.wd)*e.spd*.3*dt;e.y+=Math.sin(e.wd)*e.spd*.3*dt;inArena(e);continue;}
    const slow=e.frozen>0?.3:1;

function contact(e,tg,dt,m=1){if(tg.hp>0&&dist(e,tg)<e.r+(tg.r||18))hurt(tg,e.dmg*dt*m,null,true);}
function minionAI(e,tg,dt,slow,d){

/* ============ BOT AI ============ */
function botInput(p){
  const c=p.bot;
  let tg=null,md=1e9;
  for(const h of hostiles(p)){if(h.invis>0)continue;const d=dist(p,h);if(d<md){md=d;tg=h;}}
  let mx=0,my=0,dodging=false;
  if(c.dodge){
    const list=S.mode==='duel'?S.bullets:S.eb;
    for(const b of list){
      if(b.owner===p.id)continue;
      const bx=p.x-b.x,by=p.y-b.y,bd=Math.hypot(bx,by);
      if(bd>c.dodge||bd<8)continue;
      const bl=Math.hypot(b.vx,b.vy)||1,nx=b.vx/bl,ny=b.vy/bl;
      if((bx*nx+by*ny)/bd>.6){
        const side=(bx*ny-by*nx)>0?1:-1,u=1-bd/c.dodge;
        mx+=-ny*side*u*2.5;my+=nx*side*u*2.5;dodging=true;
      }
    }
  }
  if(!dodging){
    let best=null,bd=500;
    for(const k of S.pk){if(k.bad)continue;const d=dist(p,k);if(d<bd){bd=d;best=k;}}
    if(best&&(S.mode!=='duel'||c.dodge>200)){const d=dist(p,best)||1;mx+=(best.x-p.x)/d*1.2;my+=(best.y-p.y)/d*1.2;}
    for(const k of S.pk){if(!k.bad)continue;const d=dist(p,k);if(d<220){mx+=(p.x-k.x)/(d||1)*(1-d/220)*2;my+=(p.y-k.y)/(d||1)*(1-d/220)*2;}}
    if(tg){
      const nx=(tg.x-p.x)/md,ny=(tg.y-p.y)/md;
      if(md<c.ideal-100){mx-=nx;my-=ny;}
      else if(md>c.ideal+100){mx+=nx*.8;my+=ny*.8;}
      else{const s=Math.sin(S.t*1.2+p.seed);mx+=-ny*s*.9;my+=nx*s*.9;}
    }else{p.wd=(!p.wd||Math.random()<.02)?rnd(0,TAU):p.wd;mx+=Math.cos(p.wd)*.6;my+=Math.sin(p.wd)*.6;}
  }
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  p.smx=p.smx*.85+mx*.15;p.smy=p.smy*.85+my*.15;
  const sl=Math.hypot(p.smx,p.smy);
  const out={x:sl>.08?p.smx/sl:0,y:sl>.08?p.smy/sl:0,aim:p.aim,shoot:false};
  if(tg){
    let tx=tg.x,ty=tg.y;
    if(tg.isTank){const bt=md/(p.bspd||1000);tx+=tg.vx*bt*c.lead;ty+=tg.vy*bt*c.lead;}
    const ta=Math.atan2(ty-p.y,tx-p.x);
    if(p.sa===undefined)p.sa=ta;
    p.sa+=angDiff(ta-p.sa)*c.aim;
    out.aim=p.sa;out.shoot=md<c.range;
    botSkills(p,tg,md);
  }
  return out;
}
function botSkills(p,tg,d){
  if(!p.skills.length||p.ch||S.t-p.botT<1)return;
  const hp=p.hp/p.maxHp,duel=S.mode==='duel';
  let cluster=0;if(!duel)for(const e of S.enemies)if(!e.ally&&dist(e,p)<450)cluster++;
  const a=Math.atan2(tg.y-p.y,tg.x-p.x);
  let best=null,bs=0;
  for(const k of p.skills){
    const sk=SKILLS[k];if((p.cd[k]||0)>0||p.mana<sk.mp+15)continue;
    let s=0;
    switch(k){
      case'charge':if(hp>=.5&&d>200&&d<450)s=70;break;
      case'flame':if(d<400)s=d<250?90:65;break;
      case'freeze':if(d<500)s=cluster>=3?95:d<300?65:45;break;
      case'drain':if(!duel&&d<350)s=hp<.4?110:cluster>=3?70:0;break;
      case'split':if(!duel&&cluster>=3&&hp>=.5)s=60;break;
      case'laser':if(d<700)s=d<400?80:55;break;
      case'nuke':if(d>200&&d<800&&hp>=.35)s=tg.boss?90:cluster>=3?85:65;break;
      case'invis':if(hp<.4&&(cluster>=1||duel))s=90;break;
      case'teleport':if(d>100&&d<500)s=hp<.4?80:40;break;
    }
    if(s>bs){bs=s;best=k;}
  }
  if(best&&bs>=50){p.aim=a;cast(p,best,a);p.botT=S.t;}
}

function joystick(el,on,off){
  const knob=el.firstElementChild;let pid=null;
  const upd=e=>{const r=el.getBoundingClientRect(),m=r.width*.36;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d;}knob.style.transform=`translate(${dx}px,${dy}px)`;on(dx/m,dy/m);};
  const end=e=>{if(e.pointerId!==pid)return;pid=null;knob.style.transform='';off();};
  el.addEventListener('pointerdown',e=>{if(pid!==null)return;e.preventDefault();pid=e.pointerId;try{el.setPointerCapture(pid)}catch(_){}upd(e);});
  el.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();upd(e);}});
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

  if(touch.aimOn&&Math.hypot(touch.ax,touch.ay)>.2){aim=Math.atan2(touch.ay,touch.ax);shoot=touch.shoot;}
  else if(!isTouch){aim=Math.atan2(mouse.y-(H/2+me.y-cam.y),mouse.x-(W/2+me.x-cam.x));shoot=mouse.down||keys[' '];}
  return{x:mx,y:my,aim,shoot};
}

/* ============ VÒNG LẶP ============ */
function loop(now){
  if(!S)return;
  const dt=Math.min((now-last)/1000,.1);last=now;
  if(!paused&&!S.over){try{step(dt);}catch(err){console.error(err);}}
  if(S&&!paused)draw();
  requestAnimationFrame(loop);
}
function step(dt){
  S.t+=dt;
  if(S.ann){S.ann.t-=dt;if(S.ann.t<=0)S.ann=null;}
  const me=S.me;
  if(S.mode==='test'&&me.hp<1)me.hp=1;
  me.input=me.isBot?botInput(me):getInput();
  for(const t of S.tanks){if(t===me)continue;t.input=t.hp>0&&me.hp>0?botInput(t):{x:0,y:0,aim:t.aim,shoot:false};}
  const alive=S.tanks.filter(t=>t.hp>0);
  if(S.mode==='duel'){if(alive.length<=1){endGame(alive[0]);return;}}
  else if(me.hp<=0){endGame(null);return;}
  if(S.waveOn&&S.mode!=='test'){
    if(S.queue.length){
      S.spawnT-=dt;
      if(S.spawnT<=0){const n=S.wave>=10?3:S.wave>=5?2:1;for(let i=0;i<n&&S.queue.length;i++)spawnEnemy(S.queue.shift(),S.wave);S.spawnT=Math.max(.1,.35-S.wave*.012);}
    }
    if(!S.queue.length&&!S.enemies.some(e=>!e.ally)){S.waveOn=false;S.clear=2;S.killed=0;ann('MÀN '+S.wave+' HOÀN THÀNH!',2);sfx('pickup');}
  }else if(S.clear>0&&S.mode!=='test'&&S.mode!=='duel'){S.clear-=dt;if(S.clear<=0){S.wave++;S.killed=0;startWave();}}
  if(S.mode==='duel'){
    S.pkT-=dt;
    if(S.pkT<=0&&S.pk.length<4){S.pkT=3+Math.random()*2;const a=rnd(0,TAU),r=rnd(0,S.R-100);spawnPowerup(Math.cos(a)*r,Math.sin(a)*r);}
  }
  for(const t of S.tanks)updateTank(t,dt);
  updateBullets(dt);
  if(S.mode!=='duel'){updateEnemies(dt);updateEBullets(dt);}
  updateNukes(dt);updatePickups(dt);updateFx(dt);
  updateHUD();
}
function endGame(winner){
  S.over=true;
  const me=S.me;
  if(S.mode==='duel'){
    const bot=S.tanks[1],d='Độ khó: '+DIFF_VI[S.diff];
    if(winner===me){sfx('win');const s=scores[user]||(scores[user]={hi:0,wins:0});s.wins++;store.set('ta2_scores',scores);showEnd('CHIẾN THẮNG','var(--green)','Đã hạ gục <b>'+bot.name+'</b>',d);}
    else{sfx('lose');showEnd('THẤT BẠI','var(--red)','<b>'+bot.name+'</b> đã hạ gục bạn',d);}
  }else{
    sfx('lose');
    if(S.mode==='pve'){const s=scores[user]||(scores[user]={hi:0,wins:0});if(me.score>s.hi){s.hi=me.score;store.set('ta2_scores',scores);}}
    showEnd(S.spectate?'BOT ĐÃ CHẾT':'GAME OVER','var(--red)','Điểm: <b>'+me.score+'</b>','Cấp '+me.lvl+' · Màn '+S.wave);
  }
}
function showEnd(t,c,a,b){$('ovT').textContent=t;$('ovT').style.color=c;$('ovA').innerHTML=a;$('ovB').innerHTML=b;$('endOv').classList.remove('hidden');updateHUD();draw();}

function drawArrows(){

function drawBossBars(){
  if(S.mode==='duel')return;
  const bs=S.enemies.filter(e=>e.boss&&e.invis<=0);
  const w=Math.min(520,W-80),x=(W-w)/2,y0=W<700?100:64;
  bs.slice(0,4).forEach((b,i)=>{
    const y=y0+i*26;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-4,y-4,w+8,24);
    ctx.fillStyle='rgba(255,0,85,.2)';ctx.fillRect(x,y,w,16);
    ctx.fillStyle=b.color;ctx.fillRect(x,y,w*Math.max(0,b.hp/b.maxHp),16);
    ctx.fillStyle='#fff';ctx.font='bold 11px Orbitron';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('BOSS '+b.name+' Lv'+b.lvl+'  '+Math.ceil(b.hp)+' / '+Math.ceil(b.maxHp),W/2,y+8);ctx.textBaseline='alphabetic';
  });
}
function drawMini(){
  const sz=mini.clientWidth||140,k=mini.width/sz;
  mctx.setTransform(k,0,0,k,0,0);mctx.clearRect(0,0,sz,sz);
  const pad=8,ir=(sz-pad*2)/2,sc=ir/S.R,c=sz/2;
  mctx.save();mctx.beginPath();mctx.arc(c,c,ir,0,TAU);mctx.clip();
  mctx.fillStyle='rgba(255,50,50,.06)';mctx.fillRect(0,0,sz,sz);
  const dot=(o,col,r)=>{mctx.fillStyle=col;mctx.beginPath();mctx.arc(c+o.x*sc,c+o.y*sc,r,0,TAU);mctx.fill();};
  for(const q of S.pk)if(q.type!=='xp')dot(q,q.bad?'#ff5b6e':'#ffd93d',1.6);
  for(const e of S.enemies){if(e.invis>0)continue;dot(e,e.ally?'#2ee07a':e.boss?e.color:'#ff5b6e',e.boss?4:1.6);}
  for(const t of S.tanks){if(t.hp<=0||(t!==S.me&&t.invis>0))continue;dot(t,t===S.me?'#2ee07a':'#6ba8ff',3.2);}
  mctx.restore();
  mctx.strokeStyle='rgba(255,80,80,.65)';mctx.lineWidth=1.5;mctx.beginPath();mctx.arc(c,c,ir,0,TAU);mctx.stroke();
}

/* ============ HUD / UI ============ */
const hc={};
function setT(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v;}}
function setW(id,v){if(hc[id]!==v){hc[id]=v;$(id).style.width=v;}}
function updateHUD(){
  const me=S.me;
  setW('hpF',Math.max(0,me.hp/me.maxHp*100)+'%');setT('hpT','HP '+Math.max(0,Math.ceil(me.hp))+' / '+Math.ceil(me.maxHp));
  setW('mpF',Math.max(0,me.mana/me.maxMana*100)+'%');setT('mpT','MP '+Math.floor(me.mana)+' / '+me.maxMana);
  setW('shF',me.shield>0?Math.min(100,me.shield/me.maxHp*100)+'%':'0%');
  setW('xpF',Math.min(100,me.xp/xpNeed(me.lvl)*100)+'%');setT('xpT','LV '+me.lvl+' • XP '+me.xp+'/'+xpNeed(me.lvl));
  setT('scoreV',String(me.score).padStart(6,'0'));setT('waveV',String(S.wave).padStart(2,'0'));
  if(S.mode==='duel'){const b=S.tanks[1];setW('botF',Math.max(0,b.hp/b.maxHp*100)+'%');setT('botT',b.name+' · '+Math.max(0,Math.ceil(b.hp)));}
  const g=$('goal');
  if((S.mode==='pve'&&!S.spectate)||S.mode==='spectate'){
    g.classList.toggle('hidden',!S.waveOn);
    if(S.waveOn){let n=0;for(const e of S.enemies)if(!e.ally)n++;const rem=S.queue.length+n;setT('goalN',rem);setW('goalP',(S.total>0?clamp((S.total-rem)/S.total,0,1)*100:0)+'%');}
  }else g.classList.add('hidden');
  const sig=Object.keys(me.pu).filter(k=>me.pu[k]>0).map(k=>k+Math.ceil(me.pu[k])).join(',');
  if(hc.pus!==sig){hc.pus=sig;const box=$('pus');box.innerHTML='';for(const k in me.pu)if(me.pu[k]>0){const d=document.createElement('div');d.className='pu'+(PU_BAD.includes(k)?' bad':'');d.textContent=PU_ICON[k]+' '+k.toUpperCase()+' '+Math.ceil(me.pu[k])+'s';box.appendChild(d);}}
  for(const b of $('skills').children){const cd=S.me.cd[b.dataset.k]||0,t=cd>0?String(Math.ceil(cd)):'';if(b._t!==t){b._t=t;b.classList.toggle('cd',cd>0);b.querySelector('.cdo').textContent=t;}}
}
function buildSkillBar(){
  const box=$('skills');box.innerHTML='';
  S.me.skills.forEach((k,i)=>{
    const sk=SKILLS[k],b=document.createElement('button');
    b.className='sk';b.dataset.k=k;b.style.color=sk.c;
    b.innerHTML=sk.i+'<small>'+(i+1)+'</small><div class="cdo"></div>';
    if(S.spectate)b.style.pointerEvents='none';
    else b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();cast(S.me,k);});
    box.appendChild(b);
  });
}
function show(name){
  for(const id of['nameScr','menuScr'])$(id).classList.add('hidden');
  const inGame=name==='game';
  for(const id of['game','hud','skills'])$(id).classList.toggle('hidden',!inGame);
  const joy=inGame&&isTouch&&!(S&&S.spectate);
  $('joyL').classList.toggle('hidden',!joy);$('joyR').classList.toggle('hidden',!joy);
  $('test').classList.toggle('hidden',!(inGame&&S&&S.mode==='test'));
  $('pauseOv').classList.add('hidden');$('endOv').classList.add('hidden');$('settings').classList.add('hidden');
  paused=false;
  if(name==='name')$('nameScr').classList.remove('hidden');
  if(name==='menu')$('menuScr').classList.remove('hidden');
}
function showMenu(){
  S=null;
  if(!user){show('name');$('nameIn').value='';return;}
  show('menu');const d=scores[user]||{hi:0,wins:0};
  $('mUser').textContent=user;$('mHi').textContent=d.hi;$('mWins').textContent=d.wins;
}
function start(mode,diff){
  audioInit();Object.keys(hc).forEach(k=>delete hc[k]);
  touch.mx=touch.my=touch.ax=touch.ay=0;touch.moveOn=touch.aimOn=touch.shoot=false;
  newGame(mode,diff);
  if(mode==='test')buildTest();
  show('game');last=performance.now();requestAnimationFrame(loop);
}
let lastCfg=null;
function pause(){if(!S||S.over)return;paused=true;$('pauseOv').classList.remove('hidden');}
function resume(){paused=false;$('pauseOv').classList.add('hidden');last=performance.now();}
function openSettings(){
  $('settings').classList.remove('hidden');
  if(S&&!S.over&&!paused){pausedBySet=true;pause();}
  refreshSet();
}
function closeSettings(){$('settings').classList.add('hidden');if(pausedBySet){pausedBySet=false;resume();}}
function refreshSet(){$('setSnd').textContent=cfg.sound?'BẬT':'TẮT';$('setShk').textContent=cfg.shake?'BẬT':'TẮT';$('setSnd').style.color=cfg.sound?'var(--green)':'var(--red)';$('setShk').style.color=cfg.shake?'var(--green)':'var(--red)';}
function buildTest(){
  const mk=(id,items)=>{const g=$(id);g.innerHTML='';items.forEach(([t,f,c])=>{const b=document.createElement('button');b.textContent=t;if(c)b.style.color=c;b.onclick=()=>{if(S&&!S.over)f();};g.appendChild(b);});};
  mk('tBoss',BOSSES.map((b,i)=>[b.name,()=>spawnBoss(i),b.c]));
  mk('tEn',TYPES.map((t,i)=>[t.beh.toUpperCase()+' #'+i,()=>{const p=spawnPos(250,20);const e=mkEnemy(i,5,p.x,p.y);e.hp=e.maxHp*=2;S.enemies.push(e);},t.c]));
  mk('tPu',[...PU_GOOD,...PU_BAD].map(t=>[PU_ICON[t]+' '+t,()=>{const a=rnd(0,TAU);spawnPowerup(S.me.x+Math.cos(a)*100,S.me.y+Math.sin(a)*100,t);},PU_BAD.includes(t)?'#ff0055':'#00ff66']));
  mk('tUt',[
    ['❤ Hồi đầy',()=>{S.me.hp=S.me.maxHp;S.me.mana=S.me.maxMana;}],
    ['⬆ Lv+1',()=>{const m=S.me;m.lvl++;m.maxHp+=15;m.dmg+=2;m.maxMana+=10;m.hp=m.maxHp;m.mana=m.maxMana;}],
    ['✦ Mọi kỹ năng',()=>{S.me.skills=SKEYS.slice();SKEYS.forEach(k=>S.me.cd[k]=0);buildSkillBar();}],
    ['⏱ Reset CD',()=>{for(const k in S.me.cd)S.me.cd[k]=0;}],
    ['🗑 Xóa quái',()=>{S.enemies=S.enemies.filter(e=>e.ally);}],
    ['🧹 Xóa đạn',()=>{S.bullets=[];S.eb=[];}]
  ]);
}

/* ============ SỰ KIỆN UI ============ */
function submitName(){
  audioInit();const u=$('nameIn').value.trim();
  if(!u){$('nameMsg').textContent='VUI LÒNG NHẬP TÊN';return;}
  user=u;store.set('ta2_name',u);if(!scores[u]){scores[u]={hi:0,wins:0};store.set('ta2_scores',scores);}
  showMenu();
}
$('nameOk').onclick=submitName;
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});
$('chName').onclick=()=>{show('name');$('nameIn').value=user;$('nameMsg').textContent='';};
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,b.dataset.d||null));
document.querySelectorAll('.openSet').forEach(b=>b.onclick=openSettings);
$('setClose').onclick=closeSettings;
$('setSnd').onclick=()=>{cfg.sound=!cfg.sound;store.set('ta2_cfg',cfg);refreshSet();};
$('setShk').onclick=()=>{cfg.shake=!cfg.shake;store.set('ta2_cfg',cfg);refreshSet();};
$('btnPause').onclick=()=>{if(S&&!S.over)pause();};
$('bResume').onclick=resume;
$('bExit').onclick=()=>{paused=false;showMenu();};
$('bMenu').onclick=showMenu;
$('bAgain').onclick=()=>{if(S)start(S.mode,S.diff);};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!S.over&&!paused)pause();mouse.down=false;});
showMenu();
})();
</script>
